<title>Level 11 · Symbol Arcade</title>

<script type="application/json" id="level-info">
{"t":"Symbol Arcade","d":"Blast the right symbols before they land in Symbol Invaders, then race the clock in a memory match.","s":"Game · symbols","c":"#f72585","emoji":"👾🃏"}
</script>
<style>
.field{position:relative;height:min(62vh,560px);background:#0b1426;border-radius:20px;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;
 background-image:radial-gradient(#ffffff22 1px,transparent 1px);background-size:28px 28px}
.inv{position:absolute;width:118px;height:62px;background:var(--paper);border-radius:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 0 0 3px #4cc9f0,0 0 18px #4cc9f088}
.inv svg{width:100px;height:50px;pointer-events:none}
.inv.boom{animation:boom .35s forwards;pointer-events:none}
@keyframes boom{to{transform:scale(1.8) rotate(25deg);opacity:0}}
.inv.bad{box-shadow:0 0 0 4px var(--red);animation:shake .3s}
.sy line,.sy path,.sy rect,.sy circle{stroke:var(--ink);stroke-width:3.2;stroke-linecap:round;fill:none}
.ground{position:absolute;left:0;right:0;bottom:0;height:8px;background:linear-gradient(90deg,#f72585,#4cc9f0)}
.hud{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.target{font:700 26px Fredoka;background:#13233b;color:#fff;padding:8px 18px;border-radius:14px}
.target b{color:var(--yellow)}
.hud .big{font:700 22px Fredoka}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;background:#0b1426dd;padding:20px}
.overlay h2{color:#fff;font-size:34px}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:640px;margin:12px auto 0}
.mc{aspect-ratio:1.25;perspective:700px;border:0;background:none;padding:0;cursor:pointer}
.mc .in{position:relative;width:100%;height:100%;transition:transform .35s;transform-style:preserve-3d}
.mc.open .in,.mc.got .in{transform:rotateY(180deg)}
.mc .f,.mc .b{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;align-items:center;justify-content:center}
.mc .f{background:linear-gradient(135deg,#7b5cff,#f72585);color:#fff;font-size:34px}
.mc .b{transform:rotateY(180deg);background:var(--paper);border:3px solid #d3e0f0;font:600 19px Fredoka;color:var(--ink);padding:4px;text-align:center}
.mc.got .b{border-color:var(--green);background:#dcfaf0}
.mc .b svg{width:90%;height:70%}
</style>
</head>
<body>
<script src="../common.js?h=daf867c1"></script>
<script src="../circuit.js?h=8b387158"></script>
<script>
const C=[['cell','Cell'],['battery','Battery'],['bulb','Bulb'],['switch','Switch'],['push','Push switch'],['resistor','Resistor'],['motor','Motor'],['buzzer','Buzzer'],['led','LED']];
const symSVG=k=>`<svg viewBox="-60 -30 120 60">${Circuit.sym(Circuit.parse(k),{},55)}${k==='motor'?'<text x="0" y="6.5" text-anchor="middle" style="font:800 18px Nunito,sans-serif;fill:var(--ink)">M</text>':''}</svg>`;

Level({n:11,title:'Symbol Arcade',summary:'speed comes from practice – the more you see the symbols, the faster you read circuit diagrams.',steps:[
 // Symbol Invaders
 (st,api)=>{
  const c=h('div',{class:'card'});st.append(c);
  c.append(h('div',{class:'kicker'},'Game 1 · Symbol Invaders'));
  const tgt=h('div',{class:'target'}),sc=h('span',{class:'big'},'⭐ 0'),lv=h('span',{class:'big'},'❤️❤️❤️'),tm=h('span',{class:'big'},'⏱ 60');
  c.append(h('div',{class:'hud'},tgt,h('div',{class:'row'},sc,lv,tm)));
  const f=h('div',{class:'field'},h('div',{class:'ground'}));c.append(f);
  const ov=h('div',{class:'overlay',html:'<h2>👾 Symbol Invaders</h2><p class="lead">Circuit symbols are falling! Tap the one that matches the name at the top before it hits the ground.<br>Wrong symbol = lose a life. Let the right one land = lose a life.</p>'});
  const go=h('button',{class:'btn warm'},'▶ Start');ov.append(go);f.append(ov);
  let inv=[],target,score=0,lives=3,time=60,run=false,last,spawnT=0,best=0;
  const pickTarget=()=>{target=C[Math.random()*C.length|0];tgt.innerHTML=`Tap the <b>${target[1].toUpperCase()}</b>`;};
  function spawn(){const W=f.clientWidth-130;const hasT=inv.some(o=>o.k===target[0]&&!o.dead);
   const k=(!hasT&&Math.random()<.55)?target[0]:C[Math.random()*C.length|0][0];
   const el=h('div',{class:'inv',html:symSVG(k)});const o={k,el,x:6+Math.random()*W,y:-70,v:38+Math.min(90,score*4)+Math.random()*20};
   el.style.left=o.x+'px';el.addEventListener('pointerdown',e=>{e.preventDefault();hit(o);});f.append(el);inv.push(o);}
  function hit(o){if(!run||o.dead)return;
   if(o.k===target[0]){o.dead=true;o.el.classList.add('boom');score++;Sfx.good();sc.textContent='⭐ '+score;setTimeout(()=>o.el.remove(),350);pickTarget();}
   else{o.el.classList.add('bad');setTimeout(()=>o.el.classList.remove('bad'),300);lose();}}
  function lose(){lives--;Sfx.bad();lv.textContent='❤️'.repeat(Math.max(0,lives))+'🖤'.repeat(3-Math.max(0,lives));if(lives<=0)end();}
  function loop(t){if(!run)return;const dt=Math.min(.05,(t-last)/1000);last=t;time-=dt;tm.textContent='⏱ '+Math.ceil(Math.max(0,time));
   spawnT-=dt;if(spawnT<=0&&inv.filter(o=>!o.dead).length<5){spawn();spawnT=Math.max(.55,1.4-score*.04);}
   const H=f.clientHeight-70;
   inv.forEach(o=>{if(o.dead)return;o.y+=o.v*dt;o.el.style.top=o.y+'px';if(o.y>H){o.dead=true;o.el.remove();if(o.k===target[0]){lose();pickTarget();}}});
   inv=inv.filter(o=>!o.dead||o.el.isConnected);
   if(time<=0)end();if(run)requestAnimationFrame(loop);}
  function start(){inv.forEach(o=>o.el.remove());inv=[];score=0;lives=3;time=60;sc.textContent='⭐ 0';lv.textContent='❤️❤️❤️';ov.classList.add('hide');pickTarget();run=true;last=performance.now();spawnT=0;requestAnimationFrame(loop);}
  let added=false;
  function end(){if(!run)return;run=false;best=Math.max(best,score);Sfx.win();if(score>=10)confetti(80);
   ov.innerHTML=`<h2>${lives<=0?'💥 Out of lives!':'⏱ Time!'}</h2><p class="lead">You blasted <b>${score}</b> symbols. Best: ${best}.</p>`;
   ov.append(h('div',{class:'row',style:'justify-content:center'},h('button',{class:'btn ghost',onclick:start},'↻ Play again'),h('button',{class:'btn go',onclick:()=>{if(!added){added=true;api.add(Math.min(best,15),15);}api.next();}},'Next game →')));
   ov.classList.remove('hide');}
  go.onclick=()=>{Sfx.ac();start();};
 },
 // Memory
 (st,api)=>{
  const c=h('div',{class:'card'});st.append(c);
  const set=shuffle(C).slice(0,8);
  const cards=shuffle(set.flatMap(([k,n])=>[{k,face:symSVG(k)},{k,face:n}]));
  const tm=h('span',{class:'big'},'⏱ 0s'),mv=h('span',{class:'big'},'🔄 0');
  c.append(h('div',{class:'kicker'},'Game 2 · Memory match'),h('div',{class:'hud'},h('h2',{style:'margin:0'},'Pair each symbol with its name'),h('div',{class:'row'},mv,tm)));
  const g=h('div',{class:'mem'});c.append(g);const msg=h('div');c.append(msg);
  let open=[],got=0,miss=0,moves=0,lock=false,t0=null,tick;
  cards.forEach(o=>{const b=h('button',{class:'mc',html:`<div class="in"><div class="f">⚡</div><div class="b">${o.face}</div></div>`});
   b.onclick=()=>{if(lock||b.classList.contains('open')||b.classList.contains('got'))return;
    if(!t0){t0=Date.now();tick=setInterval(()=>{if(!document.body.contains(tm))return clearInterval(tick);tm.textContent='⏱ '+Math.round((Date.now()-t0)/1000)+'s';},500);}
    Sfx.click();b.classList.add('open');open.push([b,o]);
    if(open.length===2){moves++;mv.textContent='🔄 '+moves;const [[b1,o1],[b2,o2]]=open;open=[];
     if(o1.k===o2.k){b1.classList.add('got');b2.classList.add('got');Sfx.good();got++;
      if(got===8){clearInterval(tick);const s=Math.round((Date.now()-t0)/1000),pts=Math.max(2,10-Math.floor(miss/2));api.add(pts,10);Sfx.win();confetti(90);
       msg.append(h('div',{class:'msg good'},`🎉 All 8 pairs in ${moves} moves and ${s} seconds. +${pts}`),h('div',{class:'row',style:'margin-top:12px'},api.nextBtn('Finish level →')));}}
     else{miss++;lock=true;setTimeout(()=>{b1.classList.remove('open');b2.classList.remove('open');lock=false;},850);}}};
   g.append(b);});
 }
]});
</script>
</body>
</html>
