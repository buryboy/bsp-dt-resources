# Builds the student-facing site for dt.bsphosted.fr (Hostinger) on every push to main and puts it on the
# `hostinger-site` branch. Hostinger's Git deployment pulls that branch into public_html (auto-deploy webhook).
# Only the open iPad workbooks, front pages and teacher lesson files go there: no admin tools, no backend code.
name: School site (dt.bsphosted.fr)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: school-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build front pages and site
        run: |
          python3 book-kit/tools/make_home.py
          python3 book-kit/tools/build_ipad_site.py "$RUNNER_TEMP/site"
          cp book-kit/hostinger/htaccess "$RUNNER_TEMP/site/.htaccess"
          rm -f "$RUNNER_TEMP/site/README.md"
          echo "files: $(find "$RUNNER_TEMP/site" -type f | wc -l)"
      - name: Publish to the hostinger-site branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$RUNNER_TEMP/site"
          git init -q -b hostinger-site
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "School site built from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" hostinger-site
