<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Visual timer · BSP D&amp;T tools</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E⏳%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="kit/tools.css">
<style>
html, body { height: 100%; }
body { height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
.tk-top { flex: none; }
#stage { flex: 1; min-height: 0; position: relative; cursor: pointer; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

#nums.off { visibility: hidden; }
body.done #nums { visibility: visible; color: var(--green); font-weight: 700; font-size: clamp(30px, 6vh, 64px); }
#controls { flex: none; padding: 6px 14px 12px; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; }
.btn.on { background: var(--ink); color: var(--bg); box-shadow: none; }
.btn.big { font-size: 22px; padding: 10px 28px; min-width: 170px; }
.btn.preset { min-width: 48px; padding: 10px 12px; }
.lab { font-weight: 600; color: var(--muted); }
#mins { width: 84px; min-height: 44px; border-radius: 12px; border: 2px solid var(--line); background: var(--card); padding: 6px 8px; font-weight: 600; text-align: center; }
label.tog { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
label.tog input { width: 20px; height: 20px; accent-color: var(--ink2); }
.help { font-size: 14px; color: var(--muted); text-align: center; }
.help kbd { font: inherit; font-weight: 600; border: 1.5px solid var(--line); border-radius: 6px; padding: 0 5px; background: var(--card); }
.tk-hide-idle { transition: opacity .3s; }
@media (max-height: 640px) { .help { display: none; } }
</style>
</head>
<body>
<main id="stage" title="Click to start / pause"><canvas id="cv" role="img" aria-label="Picture timer"></canvas></main>
<div id="nums" role="timer"></div>
<div id="controls">
  <div class="row">
    <span class="row" id="styles">
      <button class="btn" data-style="sand">Sand glass</button>
      <button class="btn" data-style="pie">Pie disc</button>
      <button class="btn" data-style="bucket">Bucket</button>
      <button class="btn" data-style="candle">Candle</button>
    </span>
    <span class="lab">Minutes</span>
    <span class="row" id="presets"></span>
    <input id="mins" type="number" min="0.5" max="180" step="0.5" aria-label="Minutes" title="Any number of minutes (0.5 to 180)">
  </div>
  <div class="row">
    <button class="btn go big" id="startBtn">▶ Start</button>
    <button class="btn" id="resetBtn" title="Reset (R)">↺ Reset</button>
    <label class="btn tog"><input type="checkbox" id="numT"> Show numbers</label>
    <label class="btn tog"><input type="checkbox" id="snd"> Gentle end sound</label>
  </div>
  <div class="help"><kbd>Space</kbd> start / pause · <kbd>R</kbd> reset · <kbd>N</kbd> numbers on / off · <kbd>1</kbd>–<kbd>4</kbd> picture · <kbd>F</kbd> full screen</div>
</div>
<script src="kit/tools.js"></script>
<script>
'use strict';
TK.top('Visual timer');
const $ = (s) => document.querySelector(s);
const PRESETS = [1, 2, 3, 5, 10, 15, 20, 30], STYLE_KEYS = ['sand', 'pie', 'bucket', 'candle'];
const S = Object.assign({ style: 'sand', dur: 300, state: 'idle', endAt: 0, left: 300000, numbers: false, sound: true }, TK.store('sandTimer', {}));

const pad = (n) => String(n).padStart(2, '0');

  sb.textContent = txt; sb.classList.toggle('go', S.state !== 'run'); sb.classList.toggle('blue', S.state === 'run');

}
let lastNums = '';
function nums() {
  const sec = Math.ceil(leftMs() / 1000);
  const t = S.state === 'done' ? 'All done ✓' : fmt(sec) + (S.state === 'pause' ? ' · paused' : S.state === 'idle' ? ' · ready' : ' left');

// ---------- drawing ----------
const cv = $('#cv'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;

new ResizeObserver(resize).observe($('#stage')); resize();
const pal = () => (document.body.classList.contains('dark')
  ? { ink: '#f3f5ff', soft: '#2e3766', face: '#1b2140', muted: '#a3abd0', glass: 'rgba(160,190,255,0.10)', wood: '#b07a48', woodD: '#7d5230', sand: '#f0bf5a', sandD: '#c9932e', water: '#4db4ff', waterD: '#2d86d6', metal: '#4a5588', metalD: '#343d6b', pie: '#ff5a4d', wax: '#f3e9d2', waxD: '#d9cba8', brass: '#d0a13a' }

    ctx.beginPath(); ctx.moveTo(-w, yBot + mound * 0.5); ctx.quadraticCurveTo(0, yBot - mound * 1.7, w, yBot + mound * 0.5); ctx.lineTo(w, HG + 4); ctx.lineTo(-w, HG + 4); ctx.closePath(); ctx.fill();
  }

    ctx.fillStyle = c.sand; ctx.fillRect(-3.5, -6, 7, peakY + 10);
    ctx.fillStyle = c.sandD;
    const tt = moving ? t : 0;
    for (let i = 0; i < 16; i++) { const ph = (tt * 1.4 + i / 16) % 1, y = ph * ph * peakY, x = Math.sin(i * 12.9898) * 3; ctx.beginPath(); ctx.arc(x, y, 2.4, 0, 7); ctx.fill(); }

  ctx.beginPath(); for (let i = 0; i <= 20; i++) { const y = HG * 0.45 + i * (HG * 0.43 / 20); ctx[i ? 'lineTo' : 'moveTo'](-hw(Math.abs(y) / HG) + 16, y); } ctx.stroke(); ctx.restore();

}
function drawPie(p, t, c) {

  ctx.beginPath(); ctx.arc(0, 0, R, 0, 7); ctx.fillStyle = c.face; ctx.fill(); ctx.lineWidth = 10; ctx.strokeStyle = c.ink; ctx.stroke();

  ctx.globalAlpha = 1;
  ctx.lineWidth = 9; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a0) * 214, Math.sin(a0) * 214); ctx.stroke(); // the hand
  ctx.beginPath(); ctx.arc(0, 0, 24, 0, 7); ctx.fillStyle = c.ink; ctx.fill(); ctx.beginPath(); ctx.arc(0, 0, 9, 0, 7); ctx.fillStyle = c.face; ctx.fill();

  ctx.strokeStyle = c.ink; ctx.lineWidth = 40; ctx.beginPath(); ctx.moveTo(300, -256); ctx.lineTo(0, -256); ctx.lineTo(0, -222); ctx.stroke();
  ctx.strokeStyle = c.metal; ctx.lineWidth = 26; ctx.beginPath(); ctx.moveTo(300, -256); ctx.lineTo(0, -256); ctx.lineTo(0, -222); ctx.stroke();
  ctx.strokeStyle = c.ink; ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(150, -276); ctx.lineTo(150, -296); ctx.moveTo(118, -298); ctx.lineTo(182, -298); ctx.stroke();

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.clearRect(0, 0, W, H);
  const s = Math.min(W / 680, H / 640); // every picture is drawn in a 680 × 640 box around the centre
  ctx.translate(W / 2, H / 2 + 8 * s); ctx.scale(s, s);
  ctx.save(); (DRAW[S.style] || drawSand)(p, ms / 1000, pal(), S.state === 'run' && !reduce); ctx.restore();
  nums();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
setInterval(check, 500); // still finishes (and chimes) when the tab is in the background

// ---------- wiring ----------
$('#presets').innerHTML = PRESETS.map((m) => `<button class="btn preset" data-min="${m}" title="${m} minute${m > 1 ? 's' : ''}">${m}</button>`).join('');
$('#presets').onclick = (e) => { const b = e.target.closest('.preset'); if (b) setDur(+b.dataset.min * 60); };
$('#styles').onclick = (e) => { const b = e.target.closest('[data-style]'); if (b) { S.style = b.dataset.style; save(); ui(); } };
$('#mins').onchange = (e) => { const v = parseFloat(e.target.value); if (isFinite(v) && v > 0) setDur(v * 60); e.target.blur(); ui(); };
$('#mins').addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === 'Escape') e.target.blur(); });
$('#startBtn').onclick = () => (S.state === 'done' ? start() : toggle());
$('#resetBtn').onclick = reset;
$('#numT').onchange = (e) => { S.numbers = e.target.checked; save(); ui(); };
$('#snd').onchange = (e) => { S.sound = e.target.checked; save(); if (S.sound) chime(); };
$('#stage').onclick = toggle;
document.addEventListener('click', (e) => { const t = e.target.closest('button, label.tog'); if (t && e.detail > 0) { t.blur(); const i = t.querySelector && t.querySelector('input'); i && i.blur(); } });
addEventListener('keydown', (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const a = document.activeElement, tag = a && a.tagName;
  if (tag === 'INPUT' && a.type !== 'checkbox' || tag === 'TEXTAREA' || tag === 'SELECT') return;
  const k = e.key;
  if (k === ' ' || k === 'Spacebar') { if (tag === 'BUTTON' || tag === 'INPUT') return; e.preventDefault(); toggle(); }
  else if (k === 'r' || k === 'R') reset();
  else if (k === 'n' || k === 'N') { S.numbers = !S.numbers; save(); ui(); }
  else if (k === 'f' || k === 'F') { try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); } catch (err) {} }
  else if (/^[1-4]$/.test(k)) { S.style = STYLE_KEYS[+k - 1]; save(); ui(); }
});
TK.idle([$('#controls'), document.querySelector('.tk-top')], 3500);
ui();
</script>
