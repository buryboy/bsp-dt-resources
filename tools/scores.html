<!doctype html>
<html lang="en">
<head>
<script src="../gate.js"></script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scoreboard · BSP D&amp;T tools</title>
<link rel="stylesheet" href="kit/tools.css">
<style>
html, body { height: 100%; }
body { display: flex; flex-direction: column; overflow: hidden; }
.seg { display: inline-flex; border-radius: 12px; overflow: hidden; box-shadow: 0 0 0 2px var(--line) inset; background: var(--card); }
.seg button { border: 0; background: transparent; padding: 0 14px; min-height: 44px; font-weight: 600; cursor: pointer; }
.seg button.on { background: var(--ink2); color: #fff; }
#ctl { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 0 16px 8px; transition: opacity .4s; }
#ctl label { display: flex; align-items: center; gap: 6px; font-weight: 600; }
#ctl input[type=number] { width: 76px; min-height: 44px; border-radius: 12px; border: 2px solid var(--line); background: var(--card); padding: 4px 8px; font-weight: 600; text-align: center; }
#ctl .sp { flex: 1; }
.btn.warn { color: var(--red); }
.btn.armed { background: var(--red); color: #fff; box-shadow: 0 3px 0 #8e2219; }
#stage { flex: 1; min-height: 0; padding: 4px 16px 6px; display: flex; }
#help { padding: 2px 16px 8px; font-size: 14px; text-align: center; }
kbd { background: var(--card); border-radius: 6px; padding: 1px 6px; box-shadow: 0 0 0 1.5px var(--line) inset; font-family: inherit; font-weight: 600; }

/* teams */
#teams { flex: 1; display: grid; gap: 14px; min-height: 0; }
.team { --c: #2b3fd1; position: relative; background: var(--c); color: #fff; border-radius: 22px; display: flex; flex-direction: column; align-items: center; min-height: 0; min-width: 0; padding: 10px 12px 12px; overflow: hidden;
  box-shadow: 0 6px 0 rgba(0,0,0,.18); transition: transform .25s, box-shadow .25s, outline-color .25s; outline: 6px solid transparent; outline-offset: -6px; container-type: size; }
.team.lead { outline-color: #ffd84a; box-shadow: 0 6px 0 rgba(0,0,0,.18), 0 0 34px rgba(255,216,74,.75); }
.team .head { display: flex; align-items: center; gap: 6px; width: 100%; }
.team .key { font-size: 14px; font-weight: 700; background: rgba(255,255,255,.25); border-radius: 8px; padding: 2px 8px; flex: none; }
.team input.name { flex: 1; min-width: 0; background: transparent; border: 0; border-bottom: 2px dashed transparent; color: #fff; font-weight: 700; font-size: clamp(18px, 9cqh, 40px); text-align: center; padding: 0; outline: 0; }
.team input.name:hover, .team input.name:focus { border-bottom-color: rgba(255,255,255,.6); }
.team label.col { position: relative; flex: none; width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,.22); display: flex; align-items: center; justify-content: center; font-size: 17px; cursor: pointer; overflow: hidden; }
.team label.col input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
.team .crown { flex: none; font-size: clamp(20px, 10cqh, 44px); line-height: 1; transform: scale(0) rotate(-40deg); width: 0; transition: transform .45s cubic-bezier(.3,1.6,.5,1), width .3s; pointer-events: none; filter: drop-shadow(0 2px 2px rgba(0,0,0,.3)); }
.team.lead .crown { transform: scale(1) rotate(-10deg); width: 1.25em; }
.team .score { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; font-weight: 700; line-height: 1; font-size: clamp(54px, min(52cqh, 42cqw), 340px); font-variant-numeric: tabular-nums; text-shadow: 0 4px 0 rgba(0,0,0,.18); cursor: pointer; user-select: none; }
.team .score.bump { animation: bump .38s cubic-bezier(.3,1.7,.5,1); }
.team .score.dip { animation: dip .38s ease; }
@keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.22) rotate(-3deg); } 100% { transform: scale(1); } }
@keyframes dip { 0% { transform: scale(1); } 40% { transform: scale(.82); } 100% { transform: scale(1); } }
.team .members { font-size: clamp(12px, 5cqh, 18px); opacity: .92; text-align: center; max-height: 2.6em; overflow: hidden; line-height: 1.25; padding: 0 4px; }
.team .tgt { width: 86%; height: 8px; border-radius: 6px; background: rgba(255,255,255,.28); margin: 4px 0 8px; overflow: hidden; flex: none; }
.team .tgt i { display: block; height: 100%; width: 0; background: #fff; border-radius: 6px; transition: width .4s; }
.team .btns { display: flex; gap: 8px; width: 100%; flex: none; }
.team .btns button { flex: 1; border: 0; border-radius: 14px; min-height: clamp(48px, 18cqh, 96px); font-weight: 700; font-size: clamp(22px, 10cqh, 46px); background: rgba(255,255,255,.94); color: var(--c); cursor: pointer; box-shadow: 0 4px 0 rgba(0,0,0,.22); touch-action: manipulation; }
.team .btns button.minus { flex: .7; background: rgba(0,0,0,.22); color: #fff; }
.team .btns button:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.22); }
.fly { position: absolute; left: 50%; top: 42%; font-weight: 700; font-size: clamp(28px, 16cqh, 70px); pointer-events: none; animation: fly .9s ease-out forwards; text-shadow: 0 2px 0 rgba(0,0,0,.25); }
@keyframes fly { from { transform: translate(-50%, 0); opacity: 1; } to { transform: translate(-50%, -140%); opacity: 0; } }

/* individuals */
#indiv { flex: 1; display: none; flex-direction: column; min-height: 0; gap: 8px; }
#names { flex: 1; min-height: 0; display: grid; gap: 10px; overflow: auto; padding: 4px 2px 8px; align-content: start; }
.kid { position: relative; border: 0; border-radius: 16px; background: var(--card); box-shadow: 0 3px 0 var(--line), 0 0 0 2px var(--line) inset; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 12px 6px 16px; cursor: pointer; min-height: 56px; text-align: left; touch-action: manipulation; overflow: hidden; }
.kid:active { transform: translateY(2px); }
.kid .n { font-weight: 600; font-size: var(--kfs, 26px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kid .p { flex: none; min-width: 1.9em; text-align: center; font-weight: 700; font-size: calc(var(--kfs, 26px) * 1.15); background: var(--ink2); color: #fff; border-radius: 12px; padding: 2px 8px; font-variant-numeric: tabular-nums; }
.kid .p.zero { background: var(--line); color: var(--muted); }
.kid.top { box-shadow: 0 3px 0 #d9a400, 0 0 0 3px #ffd84a inset; }
.kid.top .n::before { content: '👑 '; }
.kid .p.bump { animation: bump .38s cubic-bezier(.3,1.7,.5,1); }
.kid .p.dip { animation: dip .38s ease; }
#empty { margin: auto; text-align: center; font-size: 24px; max-width: 620px; }
#empty a { color: var(--ink2); font-weight: 600; }

#banner { position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%) scale(.6); background: #fff; color: #1e2e96; border-radius: 28px; padding: 22px 44px; font-size: clamp(34px, 6vw, 96px); font-weight: 700; text-align: center; box-shadow: 0 16px 60px rgba(0,0,0,.4); opacity: 0; pointer-events: none; transition: transform .45s cubic-bezier(.3,1.6,.5,1), opacity .3s; z-index: 30; max-width: 92vw; }
#banner.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
#banner small { display: block; font-size: .42em; font-weight: 600; color: #6b7290; }
#confetti { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 25; }
@media (max-width: 900px) { #help { display: none; } }
</style>
</head>
<body>
<div id="ctl" class="tk-hide-idle">
  <span class="seg" id="mode"><button data-m="teams">Teams</button><button data-m="indiv">Individuals</button></span>
  <!-- teams controls -->
  <span class="t-only seg" title="Number of teams"><button id="less" aria-label="Fewer teams">−</button><button id="count" disabled style="min-width:86px">4 teams</button><button id="more" aria-label="More teams">+</button></span>
  <label class="t-only" title="First team to reach this wins a celebration. 0 = no target.">🎯 Target <input id="target" type="number" min="0" max="9999" step="1"></label>
  <select class="tk-class" id="cls" title="Class list"></select>
  <button class="btn t-only" id="fromClass" title="Shuffle the chosen class into the teams">🎲 Teams from class</button>
  <!-- individual controls -->
  <span class="i-only seg" id="tap" title="What a tap on a name does"><button data-v="1">Tap = +1</button><button data-v="-1">Tap = −1</button></span>
  <span class="i-only seg" id="sort" title="Order of the names"><button data-s="name">A–Z</button><button data-s="pts">Top first</button></span>
  <span class="sp"></span>
  <button class="btn" id="undo" title="Undo the last change (Z)">↶ Undo</button>
  <button class="btn" id="mute" title="Sound on / off (M)">🔊</button>
  <button class="btn warn" id="reset">↺ Reset scores</button>
</div>
<div id="stage">
  <div id="teams"></div>
  <div id="indiv"><div id="names"></div><div id="empty" class="muted" style="display:none"></div></div>
</div>
<div id="help" class="muted tk-hide-idle"></div>
<canvas id="confetti"></canvas>
<div id="banner"></div>
<script src="kit/tools.js"></script>
<script>
'use strict';
TK.top('Scoreboard');
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const COLS = ['#d33a2c', '#2b3fd1', '#1f9d45', '#e08a00', '#8a3fd1', '#0e9aa7', '#d6388f', '#5b6475'];
const NAMES = ['Red', 'Blue', 'Green', 'Gold', 'Purple', 'Teal', 'Pink', 'Grey'];
const mkTeam = (i) => ({ name: NAMES[i] + ' team', color: COLS[i], score: 0, members: [] });
let S = Object.assign({ mode: 'teams', teams: [0, 1, 2, 3].map(mkTeam), target: 0, sound: true, tap: 1, sort: 'name', indiv: {} }, TK.store('scores', {}));
if (!Array.isArray(S.teams) || S.teams.length < 2) S.teams = [0, 1, 2, 3].map(mkTeam);
const save = () => TK.save('scores', S);
const undo = [];   // { kind:'team', i, d } | { kind:'kid', cls, name, d }
const snd = (k) => S.sound && TK.beep(k);

// ---------- teams ----------
const reached = new Set();   // teams already celebrated for the current target
function layout() {
  const n = S.teams.length, el = $('#stage'), w = el.clientWidth, h = el.clientHeight;
  let best = { cols: n, score: -1 };
  for (let cols = 1; cols <= n; cols++) { const rows = Math.ceil(n / cols), cw = w / cols, ch = h / rows, s = Math.min(cw, ch * 1.25) * (cols * rows === n ? 1 : 0.94); if (s > best.score) best = { cols, score: s }; }
  $('#teams').style.gridTemplateColumns = `repeat(${best.cols}, 1fr)`;
  $('#teams').style.gridTemplateRows = `repeat(${Math.ceil(n / best.cols)}, 1fr)`;
}
function renderTeams() {
  $('#teams').innerHTML = S.teams.map((t, i) => `<div class="team" data-i="${i}" style="--c:${esc(t.color)}">
    <div class="head"><span class="key" title="Press ${i + 1} to add a point">${i + 1}</span><span class="crown">👑</span><input class="name" value="${esc(t.name)}" maxlength="24" aria-label="Team name"><label class="col" title="Team colour">🎨<input type="color" value="${esc(t.color)}" aria-label="Team colour"></label></div>
    <div class="score" title="Tap to add 1">${t.score}</div>
    <div class="members">${esc((t.members || []).join(' · '))}</div>
    <div class="tgt"><i></i></div>
    <div class="btns"><button class="minus" data-d="-1" aria-label="Take 1 off">−1</button><button data-d="1">+1</button><button data-d="5">+5</button></div>
  </div>`).join('');
  $('#count').textContent = S.teams.length + ' teams';
  layout(); marks();
}
function marks() {
  const top = Math.max(...S.teams.map((t) => t.score)), any = S.teams.some((t) => t.score !== top) || S.teams.length === 1;
  $$('.team').forEach((el, i) => {
    const t = S.teams[i];
    el.classList.toggle('lead', t.score === top && top > 0 && any);
    const bar = $('.tgt', el); bar.style.visibility = S.target > 0 ? 'visible' : 'hidden';
    $('i', bar).style.width = (S.target > 0 ? Math.max(0, Math.min(100, (t.score / S.target) * 100)) : 0) + '%';
    if (S.target > 0 && t.score < S.target) reached.delete(i);
  });
}
function addTeam(i, d, quiet) {
  const t = S.teams[i]; if (!t) return;
  t.score += d; save();
  if (!quiet) { undo.push({ kind: 'team', i, d }); if (undo.length > 200) undo.shift(); }
  const el = $(`.team[data-i="${i}"]`), sc = $('.score', el);
  sc.textContent = t.score; sc.classList.remove('bump', 'dip'); void sc.offsetWidth; sc.classList.add(d > 0 ? 'bump' : 'dip');
  const f = document.createElement('span'); f.className = 'fly'; f.textContent = (d > 0 ? '+' : '−') + Math.abs(d); el.appendChild(f); setTimeout(() => f.remove(), 900);
  marks();
  if (S.target > 0 && t.score >= S.target && !reached.has(i) && d > 0) { reached.add(i); celebrate(t.name, 'reached ' + S.target + ' points!', t.color); }
  else snd(d > 0 ? 'tick' : 'buzz');
}
$('#teams').addEventListener('click', (e) => {
  const el = e.target.closest('.team'); if (!el) return; const i = +el.dataset.i;
  const b = e.target.closest('.btns button'); if (b) return addTeam(i, +b.dataset.d);
  if (e.target.closest('.score')) addTeam(i, 1);
});
$('#teams').addEventListener('input', (e) => {
  const el = e.target.closest('.team'); if (!el) return; const t = S.teams[+el.dataset.i];
  if (e.target.matches('.name')) t.name = e.target.value;
  if (e.target.matches('.col input')) { t.color = e.target.value; el.style.setProperty('--c', t.color); }
  save();
});
$('#teams').addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.matches('.name')) e.target.blur(); });
$('#less').onclick = () => { if (S.teams.length > 2) { S.teams.pop(); undo.length = 0; save(); renderTeams(); } };
$('#more').onclick = () => { if (S.teams.length < 8) { const used = S.teams.map((t) => t.color); let i = COLS.findIndex((c) => !used.includes(c)); if (i < 0) i = S.teams.length; S.teams.push(mkTeam(i)); save(); renderTeams(); } };
$('#target').value = S.target || 0;
$('#target').oninput = (e) => { S.target = Math.max(0, Math.floor(+e.target.value || 0)); reached.clear(); S.teams.forEach((t, i) => { if (S.target > 0 && t.score >= S.target) reached.add(i); }); save(); marks(); };
$('#fromClass').onclick = () => {
  const c = TK.currentClass();
  if (!c || !c.students.length) { flash('Add a class list first: choose “✎ Edit classes…” in the class menu.'); return; }
  const names = TK.shuffle(c.students); S.teams.forEach((t) => (t.members = []));
  names.forEach((n, k) => S.teams[k % S.teams.length].members.push(n));
  save(); renderTeams(); snd('ding');
};

// ---------- individuals ----------
const clsKey = () => { const c = TK.currentClass(); return c ? c.name : null; };
function renderKids() {
  const c = TK.currentClass(), box = $('#names'), empty = $('#empty');
  if (!c || !c.students.length) {
    box.style.display = 'none'; empty.style.display = 'block';
    empty.innerHTML = c ? 'This class has no names yet. <a href="classes.html?back=scores.html">Edit the class list</a>.' : 'No class lists saved yet. <a href="classes.html?back=scores.html">Add a class list</a> once and every tool can use it.';
    return;
  }
  box.style.display = 'grid'; empty.style.display = 'none';
  const pts = S.indiv[c.name] || {}, top = Math.max(0, ...c.students.map((n) => pts[n] || 0));
  let list = c.students.map((n, i) => ({ n, i, p: pts[n] || 0 }));
  if (S.sort === 'pts') list.sort((a, b) => b.p - a.p || a.n.localeCompare(b.n)); else list.sort((a, b) => a.n.localeCompare(b.n));
  // pick columns / type size so the whole class fits without scrolling where possible
  const w = box.clientWidth, h = box.clientHeight || 400, n = list.length;
  let cols = 1, fs = 18;
  for (let k = 1; k <= 8; k++) { const rows = Math.ceil(n / k), rh = (h - 10 * (rows - 1) - 12) / rows, cw = (w - 10 * (k - 1)) / k; const f = Math.min(rh * 0.5, cw / 9.5, 44); if (f > fs) { fs = f; cols = k; } }
  const rows = Math.ceil(n / cols);
  box.style.gridTemplateColumns = `repeat(${cols}, 1fr)`; box.style.setProperty('--kfs', Math.round(fs) + 'px');
  box.style.gridAutoRows = Math.max(56, Math.floor((h - 10 * (rows - 1) - 12) / rows)) + 'px';
  box.innerHTML = list.map((k) => `<button class="kid${k.p === top && top > 0 ? ' top' : ''}" data-n="${esc(k.n)}"><span class="n">${esc(k.n)}</span><span class="p${k.p ? '' : ' zero'}">${k.p}</span></button>`).join('');
}
function addKid(name, d, quiet) {
  const cls = clsKey(); if (!cls) return;
  const pts = (S.indiv[cls] = S.indiv[cls] || {}); pts[name] = (pts[name] || 0) + d; if (!pts[name]) delete pts[name]; save();
  if (!quiet) { undo.push({ kind: 'kid', cls, name, d }); if (undo.length > 200) undo.shift(); }
  renderKids();
  const el = $$('.kid').find((b) => b.dataset.n === name); if (el) $('.p', el).classList.add(d > 0 ? 'bump' : 'dip');
  snd(d > 0 ? 'tick' : 'buzz');
}
$('#names').addEventListener('click', (e) => { const b = e.target.closest('.kid'); if (b) addKid(b.dataset.n, S.tap); });
$('#names').addEventListener('contextmenu', (e) => { const b = e.target.closest('.kid'); if (b) { e.preventDefault(); addKid(b.dataset.n, -1); } });
const classSel = TK.classSelect($('#cls'), () => { if (S.mode === 'indiv') renderKids(); });

// ---------- shared controls ----------
function setMode(m) {
  S.mode = m; save();
  $$('#mode button').forEach((b) => b.classList.toggle('on', b.dataset.m === m));
  $$('.t-only').forEach((e) => (e.style.display = m === 'teams' ? '' : 'none'));
  $$('.i-only').forEach((e) => (e.style.display = m === 'indiv' ? '' : 'none'));
  $('#teams').style.display = m === 'teams' ? 'grid' : 'none'; $('#indiv').style.display = m === 'indiv' ? 'flex' : 'none';
  $('#reset').textContent = m === 'teams' ? '↺ Reset scores' : '↺ Reset class points'; disarm();
  $('#help').innerHTML = m === 'teams'
    ? 'Keys: <kbd>1</kbd>–<kbd>8</kbd> add a point · <kbd>Shift</kbd>+number takes one off · <kbd>Z</kbd> undo · <kbd>M</kbd> sound · tap a name or 🎨 to change it. Saved on this device only.'
    : 'Tap a name to award a point (right-click takes one off) · <kbd>Z</kbd> undo · <kbd>M</kbd> sound. Totals are saved for each class on this device only.';
  if (m === 'teams') renderTeams(); else renderKids();
}
$('#mode').onclick = (e) => { const b = e.target.closest('button'); if (b) setMode(b.dataset.m); };
const seg = (id, attr, key, cast) => { const upd = () => $$(id + ' button').forEach((b) => b.classList.toggle('on', cast(b.dataset[attr]) === S[key])); $(id).onclick = (e) => { const b = e.target.closest('button'); if (!b) return; S[key] = cast(b.dataset[attr]); save(); upd(); if (S.mode === 'indiv') renderKids(); }; upd(); };
seg('#tap', 'v', 'tap', Number); seg('#sort', 's', 'sort', String);
const muteUi = () => { $('#mute').textContent = S.sound ? '🔊' : '🔇'; };
$('#mute').onclick = () => { S.sound = !S.sound; save(); muteUi(); }; muteUi();
function doUndo() {
  const u = undo.pop(); if (!u) return;
  if (u.kind === 'team') { if (S.mode !== 'teams') setMode('teams'); addTeam(u.i, -u.d, true); }
  else { const pts = (S.indiv[u.cls] = S.indiv[u.cls] || {}); pts[u.name] = (pts[u.name] || 0) - u.d; if (!pts[u.name]) delete pts[u.name]; save(); if (S.mode === 'indiv') renderKids(); }
}
$('#undo').onclick = doUndo;
let armT = 0;
function disarm() { clearTimeout(armT); const b = $('#reset'); b.classList.remove('armed'); b.textContent = S.mode === 'teams' ? '↺ Reset scores' : '↺ Reset class points'; }
$('#reset').onclick = () => {
  const b = $('#reset');
  if (!b.classList.contains('armed')) { b.classList.add('armed'); b.textContent = 'Tap again to reset'; armT = setTimeout(disarm, 3500); return; }
  disarm(); undo.length = 0;
  if (S.mode === 'teams') { S.teams.forEach((t) => (t.score = 0)); reached.clear(); save(); renderTeams(); }
  else { const c = clsKey(); if (c) delete S.indiv[c]; save(); renderKids(); }
};
let flashT = 0;
function flash(html, ms = 3200) { const b = $('#banner'); b.innerHTML = `<small style="font-size:.5em;color:#1e2e96">${html}</small>`; b.classList.add('show'); clearTimeout(flashT); flashT = setTimeout(() => b.classList.remove('show'), ms); }

// ---------- celebration ----------
const cf = $('#confetti'), cx = cf.getContext('2d'); let parts = [], cfRun = false;
function celebrate(name, line, color) {
  const b = $('#banner'); b.innerHTML = `🏆 ${esc(name)}<small>${esc(line)}</small>`; b.style.color = color || '#1e2e96'; b.classList.add('show');
  clearTimeout(flashT); flashT = setTimeout(() => b.classList.remove('show'), 4200);
  snd('tada');
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  cf.width = innerWidth; cf.height = innerHeight;
  for (let i = 0; i < 180; i++) parts.push({ x: innerWidth * (0.2 + Math.random() * 0.6), y: innerHeight * 0.45, vx: (Math.random() - 0.5) * 22, vy: -8 - Math.random() * 16, r: 6 + Math.random() * 8, a: Math.random() * 7, va: (Math.random() - 0.5) * 0.5, c: TK.pick([color || '#2b3fd1', '#ffd84a', '#ff6fae', '#36c98a', '#ffffff', '#5aa8ff']), life: 1 });
  if (!cfRun) { cfRun = true; requestAnimationFrame(cfFrame); }
}
function cfFrame() {
  cx.clearRect(0, 0, cf.width, cf.height);
  parts = parts.filter((p) => p.life > 0 && p.y < cf.height + 40);
  for (const p of parts) { p.vy += 0.5; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.a += p.va; p.life -= 0.005; cx.save(); cx.translate(p.x, p.y); cx.rotate(p.a); cx.globalAlpha = Math.min(1, p.life * 3); cx.fillStyle = p.c; cx.fillRect(-p.r, -p.r * 0.45, p.r * 2, p.r * 0.9); cx.restore(); }
  if (parts.length) requestAnimationFrame(cfFrame); else { cfRun = false; cx.clearRect(0, 0, cf.width, cf.height); }
}

// ---------- keys ----------
addEventListener('keydown', (e) => {
  if (e.target.matches('input, select, textarea') || e.ctrlKey || e.metaKey || e.altKey) return;
  const m = /^(?:Digit|Numpad)([1-8])$/.exec(e.code);
  if (m && S.mode === 'teams') { const i = +m[1] - 1; if (i < S.teams.length) { addTeam(i, e.shiftKey ? -1 : 1); e.preventDefault(); } return; }
  const k = e.key.toLowerCase();
  if (k === 'z') doUndo(); else if (k === 'm') $('#mute').click();
});
let rz = 0; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => (S.mode === 'teams' ? layout() : renderKids()), 80); });
TK.idle([$('#help')], 6000);
setMode(S.mode === 'indiv' ? 'indiv' : 'teams');
</script>
</body>
