<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Green slip · Under maintenance</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; background: #eef4f0; color: #1d2b22; font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; padding: 24px; box-sizing: border-box; }
  .card { max-width: 460px; background: #fff; border-radius: 18px; box-shadow: 0 10px 34px #1f6b3a22; overflow: hidden; text-align: center; }
  .top { background: #1f6b3a; color: #fff; padding: 18px 20px; font-weight: 700; font-size: 18px; }
  .body { padding: 26px 24px 28px; }
  .ic { font-size: 44px; line-height: 1; margin-bottom: 10px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { margin: 0; line-height: 1.5; color: #4a5a50; }
</style>
</head>
<body>
  <div class="card" role="main">
    <div class="top">Green slip · The British School of Paris</div>
    <div class="body">
      <div class="ic" aria-hidden="true">🛠️</div>
      <h1>Under maintenance</h1>
      <p>The green slip is not available at the moment. Please use a paper green slip for now.</p>
    </div>
  </div>
</body>
</html>
