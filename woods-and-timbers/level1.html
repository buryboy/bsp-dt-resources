/* Drag an element and drop it on anything matching opts.targets. onDrop(el,target,x,y) returns false to send it back. */
function drag(el,opts){

  el.addEventListener('pointerdown',e=>{
    if(el.dataset.locked==='1'||e.button>0)return;e.preventDefault();
    const r=el.getBoundingClientRect(),ox=e.clientX-r.left,oy=e.clientY-r.top,sx=e.clientX,sy=e.clientY;
    let moved=false,ph=null;
    const start=()=>{moved=true;ph=el.cloneNode(true);ph.classList.add('ph');el.parentNode.insertBefore(ph,el);
      el.style.width=r.width+'px';el.style.height=r.height+'px';el.style.left=r.left+'px';el.style.top=r.top+'px';el.classList.add('dragging');opts.onStart&&opts.onStart(el);};
    const mv=ev=>{if(!moved){if(Math.hypot(ev.clientX-sx,ev.clientY-sy)<6)return;start();}

      const t=document.elementFromPoint(ev.clientX,ev.clientY);$$(opts.targets).forEach(x=>x.classList.toggle('over',!!t&&x.contains(t)));};
    const up=ev=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);
      $$(opts.targets).forEach(x=>x.classList.remove('over'));
      if(!moved){opts.onTap&&opts.onTap(el);return;}
      const t=document.elementFromPoint(ev.clientX,ev.clientY);const target=t&&t.closest(opts.targets);
      el.classList.remove('dragging');['width','height','left','top'].forEach(p=>el.style[p]='');

      else if(opts.onMiss)opts.onMiss(el);};
    addEventListener('pointermove',mv);addEventListener('pointerup',up);addEventListener('pointercancel',up);
  });

/* Procedural wood swatch */
function swatch(canvas,spec,seed){
  const ctx=canvas.getContext('2d'),w=canvas.width,h=canvas.height,r=mulberry32(seed||hash(spec.base+spec.dark));

    ctx.strokeStyle=spec.dark;ctx.globalAlpha=(spec.bold?0.35:0.18)+r()*0.2;ctx.lineWidth=(spec.bold?2.5:1)+r()*(spec.fine?0.6:2);

}

let step=0,age=3.4,playing=false,felled=0,sec=null,order=[],tIdx=0,firstTry=true,wrongs=0,awaiting=false,guess=10,results=[],fbHTML='',inset=null;

  <div class="insetbox"><canvas id="ring" width="300" height="300"></canvas><div><b class="t">Inside the trunk</b>Each year the cambium adds a new ring: <b>light earlywood</b> in spring, <b>dark latewood</b> in summer.</div></div>
  <p class="fact" id="fact" style="font-size:15.5px"></p><div class="spacer"></div><button class="cta" id="fell"></button>`;

 }else if(step===1){
  panel.innerHTML=`<h2>Timber! 🪓</h2><p>Trees are <b>felled</b> (cut down), then <b>converted</b> (sawn into planks) and <b>seasoned</b> (dried) before they can be used.</p><p>First, let’s look inside the trunk at a cross-section.</p><div class="spacer"></div><button class="cta" id="next" disabled>Look inside →</button>`;
  $('#next').onclick=startIdentify;
 }else if(step===2)renderIdentify();
 else if(step===3){
  panel.innerHTML=`<h2>How old was your tree?</h2><p>Each <b>annual ring</b> = one year (a light spring band + a dark summer band). Count from the pith outwards. Pinch to zoom in.</p>
  <div class="stepper"><button id="minus">−</button><b id="g">${guess}</b><button id="plus">+</button></div><div class="spacer"></div><button class="cta" id="check">Check my answer</button>`;
  holdBtn($('#minus'),-1);holdBtn($('#plus'),1);$('#check').onclick=checkAge;}}

let shownAge=age;
function onAge(){updateTree(age);if(inset&&$('#ring'))drawSection(inset,300,age,treeType,0.12+0.88*woodSum(age,treeType)/REF);

  b.onpointerdown=e=>{e.preventDefault();go();to=setTimeout(()=>iv=setInterval(go,90),400);};const stop=()=>{clearTimeout(to);clearInterval(iv);};b.onpointerup=stop;b.onpointerleave=stop;b.onpointercancel=stop;}

  else{firstTry=false;wrongs++;G.toast(`That’s the ${PARTS[got].name.toLowerCase()}, so try again!`,'bad',1500);fbHTML=`<b>Hint:</b> ${PARTS[target].hint}`;renderIdentify();
    if(wrongs>=3){const [a,b]=regionBand(target);const m=addRing(a,b,'#ffffff',0);tween(1600,p=>m.material.opacity=0.6*Math.sin(p*Math.PI*3)**2,()=>{disc.remove(m);});}}}

let last=performance.now(),stepAcc=0;const FRAME=1/12;
function loop(now){requestAnimationFrame(loop);const dt=Math.min(0.05,(now-last)/1000);last=now;
  for(let i=tweens.length-1;i>=0;i--){const tw=tweens[i];if(!tw)continue;const p=Math.min(1,(now-tw.t0)/tw.dur);tw.fn(tw.ease(p));if(p>=1){tweens.splice(i,1);tw.done&&tw.done();}}
  if(step===0&&playing){age=Math.min(MAX_AGE,age+dt*1.5);if(age>=MAX_AGE){playing=false;syncPlay();}}
  stepAcc+=dt;
  if(stepAcc>=FRAME){stepAcc%=FRAME; // stop-motion tick
    if(step===0){if(Math.abs(age-shownAge)>0.0001){shownAge=age;onAge();}tree.rotation.x=Math.sin(now/1300)*0.015;tree.rotation.z=Math.sin(now/1700)*0.01;}
    for(const b of blobs){const s=b.userData.s||1;const j=1+(Math.random()-0.5)*0.03;b.scale.set(s*j,s*0.9*(2-j),s*j);} // clay "boil"
    clouds.forEach(c=>{c.position.x+=c.userData.v*FRAME*3;if(c.position.x>24)c.position.x=-24;});
    sunBall.rotation.z+=0.05;
    if(discG.visible&&step>=2)discG.position.y=1.6+Math.sin(now/900)*0.025;}
  controls.update();renderer.render(scene,camera);}
buildTree('deciduous');setStep(0);requestAnimationFrame(loop);
})();
</script>
