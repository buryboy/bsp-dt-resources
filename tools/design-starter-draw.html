<!doctype html>
<html lang="en">
<head>
<script src="../gate.js"></script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Design starter · BSP D&amp;T</title>
<link rel="stylesheet" href="kit/tools.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloria+Hallelujah&family=Patrick+Hand&display=swap">
<style>
:root { --paper: #f6efdc; --sheet: #fffdf6; --pencil: #3b3a36; --soft: #77736a; --line: #8d877a; --live: #e8590c; --hand: 'Patrick Hand', 'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive; --head: 'Gloria Hallelujah', 'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive; }
[hidden] { display: none !important; }
html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
body { background: var(--paper); color: var(--pencil); font-family: var(--hand); -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: manipulation; }
/* the drawing boxes are the page: one slim toolbar on top, a thin status line underneath, everything else is boxes */
#book { position: fixed; inset: 0; display: flex; flex-direction: column; background: var(--paper); padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
#top { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 0 1px; padding: 0 3px; min-height: 42px; border-bottom: 1.5px solid var(--line); }
#tools, #tools .grp { display: contents; }
#thumb { flex: none; width: 46px; height: 40px; padding: 2px; margin-right: 2px; background: #fff; border: 1.5px solid var(--pencil); border-radius: 4px; cursor: zoom-in; }
#thumb img { width: 100%; height: 100%; object-fit: cover; display: block; background: #e9e4d6; pointer-events: none; }
#thumb.none { display: none; }
#tools .sep { width: 1.5px; height: 24px; margin: 0 3px; background: var(--line); opacity: .55; flex: none; }
.sw { flex: none; width: 34px; height: 42px; border: 0; background: none; padding: 0; cursor: pointer; display: grid; place-items: center; }
.sw i { width: 25px; height: 25px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 1.5px rgba(255, 255, 255, .9), 0 0 0 2.5px rgba(59, 58, 54, .35); }
.sw.on i { box-shadow: 0 0 0 2.5px #fff, 0 0 0 5px var(--pencil); transform: scale(.82); }
.tb { flex: none; width: 40px; height: 42px; border: 0; background: none; padding: 0; cursor: pointer; display: grid; place-items: center; color: var(--pencil); position: relative; }
.tb svg { width: 27px; height: 27px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; position: relative; }
.tb.on::before { content: ''; position: absolute; inset: 4px 2px; background: var(--sheet); border: 2px solid var(--pencil); border-radius: 9px; }
.tb[disabled] { opacity: .3; }
#modesw { flex: none; display: flex; align-items: center; border: 2px solid var(--pencil); border-radius: 10px; background: var(--sheet); padding: 1px; margin: 0 2px; cursor: pointer; font-family: var(--hand); font-size: 16px; height: 36px; color: var(--pencil); }
#modesw span { padding: 3px 7px; border-radius: 7px; white-space: nowrap; line-height: 1.3; }
#modesw span.on { background: var(--pencil); color: #fff; }
#modesw em { font-style: normal; }
@media (max-width: 700px) { #modesw em { display: none; } }
body.ana #tools .draw { display: none; }
#nameL { flex: 0 1 132px; min-width: 84px; display: flex; align-items: center; height: 36px; margin: 0 3px; }
#nameL input { font-family: var(--hand); font-size: 17px; color: var(--pencil); border: 0; border-bottom: 2px solid var(--pencil); background: transparent; width: 100%; height: 32px; padding: 0 3px; border-radius: 0; -webkit-user-select: text; user-select: text; }
#nameL input:focus { outline: none; border-bottom-color: var(--live); }
#save { flex: none; margin-left: auto; font-family: var(--hand); font-size: 18px; background: var(--live); color: #fff; border: 0; border-radius: 10px; padding: 0 14px; height: 36px; cursor: pointer; white-space: nowrap; }
#stage { flex: 1; min-height: 0; position: relative; margin: 4px; }
.pg { position: absolute; background: var(--sheet); outline: 1.5px solid var(--line); outline-offset: -1.5px; overflow: hidden; touch-action: none; }
.pg canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.pg .live { z-index: 2; pointer-events: none; }
.pg img.ph { position: absolute; object-fit: contain; pointer-events: none; display: block; }
.pg .num { position: absolute; left: 5px; bottom: 1px; font-family: var(--head); font-size: 14px; color: var(--soft); pointer-events: none; z-index: 2; }
.pg .lock { position: absolute; right: 4px; bottom: 4px; width: 20px; height: 20px; border-radius: 50%; background: rgba(59, 58, 54, .7); display: grid; place-items: center; z-index: 2; pointer-events: none; }
.pg .lock svg { width: 12px; height: 12px; fill: none; stroke: #fff; stroke-width: 2.4; stroke-linecap: round; }
.pg .say { position: absolute; left: 0; right: 0; top: 0; padding: 1px 8px; background: rgba(255, 244, 173, .9); font-size: 15px; line-height: 1.25; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; z-index: 2; pointer-events: none; display: none; }
.pg.frozen { background: #f1ebdb; }
.pg.frozen canvas, .pg.frozen img.ph { opacity: .6; }
.pg.frozen.todo { background: #e9e2cf; }
.pg.active { outline: 3px solid var(--live); outline-offset: -3px; z-index: 1; cursor: crosshair; }
.pg.active .lock { display: none; }
.pg.active .say.has { display: block; }
.pg.active .num { color: var(--live); left: 7px; bottom: 3px; }
.pg .cap { position: absolute; inset: 0; z-index: 3; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-align: center; padding: 22px 6px 6px; }
body.ana .pg.capok .cap { display: flex; }
body.ana .pg.capok { background: var(--sheet); }
body.ana .pg.capok canvas, body.ana .pg.capok img.ph { opacity: 1; }
body.ana .pg.capok .lock { display: none; }
body.ana .pg.active { cursor: default; }
.cap .capt { font-family: var(--head); font-size: clamp(13px, 1.4vw + 8px, 24px); line-height: 1.2; background: rgba(255, 253, 246, .85); padding: 0 6px; }
.cap .capbtn { font-family: var(--hand); font-size: clamp(18px, 1.6vw + 12px, 34px); background: var(--live); color: #fff; border: 0; border-radius: 12px; padding: 6px 16px; min-height: 46px; cursor: pointer; }
.cap.got { justify-content: flex-end; align-items: flex-end; padding: 4px; }
.cap.got .capt { display: none; }
.cap.got .capbtn { font-size: 17px; min-height: 44px; padding: 4px 12px; background: rgba(59, 58, 54, .88); }
body.zoom .pg:not(.active) { display: none; }
#foot { flex: none; height: 36px; display: flex; align-items: center; padding: 0 6px 2px 124px; overflow: hidden; }
#msg { flex: 1; min-width: 0; font-family: var(--head); font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#msg small { font-family: var(--hand); font-size: 15px; color: var(--soft); margin-left: 10px; }
body.zoom #foot, body.short #foot { display: none; }
#timer { position: fixed; left: calc(5px + env(safe-area-inset-left)); bottom: calc(4px + env(safe-area-inset-bottom)); height: 30px; min-width: 108px; padding: 0 9px; z-index: 30; display: flex; align-items: center; gap: 7px; background: #fff; border: 2px solid var(--pencil); border-radius: 15px; overflow: hidden; pointer-events: none; line-height: 1; }
body.zoom #timer, body.short #timer { opacity: .92; left: calc(8px + env(safe-area-inset-left)); bottom: calc(8px + env(safe-area-inset-bottom)); }
#tfill { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; background: rgba(232, 89, 12, .28); }
#tdig { position: relative; font-size: 23px; font-weight: 700; color: #1c1b19; }
#tdig span { display: inline-block; width: .56em; text-align: center; } #tdig span.c { width: .28em; }
#tsub { position: relative; font-size: 14px; color: var(--pencil); white-space: nowrap; }
#timer.hot { border-color: #c92a2a; } #timer.hot #tdig { color: #c92a2a; } #timer.hot #tfill { background: rgba(201, 42, 42, .3); }
#cover { position: absolute; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; padding: 16px; background: var(--paper); }
#cover .sheet { background: var(--sheet); max-width: 560px; width: 100%; padding: 26px 22px; border: 1.5px solid var(--line); text-align: center; }
#cover h1 { font-family: var(--head); font-size: clamp(22px, 5vw, 30px); margin: 0 0 8px; font-weight: 400; }
#cover p { font-size: 20px; margin: 8px 0; color: var(--soft); }
#cover .doodle { width: 110px; height: 110px; margin: 0 auto 6px; display: block; }
#cover .doodle .p { animation: scrib 2.4s ease-in-out infinite; transform-origin: 60px 60px; }
@keyframes scrib { 50% { transform: translate(14px, -6px) rotate(8deg); } }
#cover input { width: 100%; font-family: var(--hand); font-size: 34px; text-align: center; letter-spacing: .3em; text-transform: uppercase; border: 0; border-bottom: 3px solid var(--pencil); background: transparent; padding: 8px; margin: 10px 0; -webkit-user-select: text; user-select: text; }
#cover .go, dialog .go { font-family: var(--hand); font-size: 22px; background: var(--pencil); color: #fff; border: 0; border-radius: 12px; padding: 8px 22px; min-height: 48px; cursor: pointer; }
#cover .err { color: #c92a2a; min-height: 1.3em; font-size: 18px; }
#cover .lnk { background: none; border: 0; font-family: var(--hand); font-size: 18px; text-decoration: underline; color: var(--soft); min-height: 44px; cursor: pointer; }
#pens { position: fixed; inset: 0; z-index: 25; background: rgba(40, 32, 22, .55); display: none; align-items: center; justify-content: center; }
#pens div { background: #fff4ad; padding: 20px 36px; font-family: var(--head); font-size: clamp(34px, 8vw, 84px); box-shadow: 0 6px 22px rgba(0, 0, 0, .4); text-align: center; line-height: 1.2; }
#pens small { display: block; font-family: var(--hand); font-size: 22px; color: var(--soft); }
body.paused #pens { display: flex; }
#big { position: fixed; inset: 0; z-index: 28; background: rgba(40, 32, 22, .85); display: none; flex-direction: column; align-items: center; justify-content: center; padding: 10px 10px 44px; cursor: zoom-out; }
#big.open { display: flex; }
#big img { max-width: 100%; max-height: calc(100% - 30px); background: #fff; padding: 5px; }
#big span { color: #fff; font-size: 15px; margin-top: 6px; text-align: center; }
#toast { position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%); background: #fff4ad; font-family: var(--head); font-size: clamp(24px, 5vw, 44px); padding: 10px 28px; box-shadow: 0 6px 20px rgba(0, 0, 0, .35); z-index: 27; opacity: 0; pointer-events: none; transition: opacity .25s; text-align: center; white-space: nowrap; }
#toast.show { opacity: 1; }
dialog { border: 0; background: var(--sheet); color: var(--pencil); font-family: var(--hand); padding: 16px; max-width: min(96vw, 760px); width: 100%; max-height: 96vh; box-shadow: 0 8px 40px rgba(0, 0, 0, .5); }
dialog::backdrop { background: rgba(40, 32, 22, .7); }
dialog h2 { font-family: var(--head); font-weight: 400; margin: 0 0 6px; font-size: clamp(19px, 4vw, 26px); }
dialog img { display: block; max-width: 100%; max-height: 50vh; margin: 8px auto; box-shadow: 0 2px 10px rgba(0, 0, 0, .3); -webkit-touch-callout: default; }
dialog input { font-family: var(--hand); font-size: 22px; border: 0; border-bottom: 2px solid var(--pencil); background: transparent; padding: 6px; width: min(100%, 340px); -webkit-user-select: text; user-select: text; }
dialog .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: center; margin-top: 8px; }
dialog .ghost { font-family: var(--hand); font-size: 20px; background: none; border: 2px solid var(--pencil); border-radius: 12px; padding: 6px 16px; min-height: 48px; cursor: pointer; color: var(--pencil); }
dialog p { margin: 6px 0; font-size: 16px; color: var(--soft); text-align: center; }
#col { position: fixed; right: calc(8px + env(safe-area-inset-right)); bottom: calc(44px + env(safe-area-inset-bottom)); z-index: 31; background: #fff4ad; padding: 8px 14px; font-family: var(--head); font-size: 17px; box-shadow: 0 3px 10px rgba(0, 0, 0, .35); display: flex; align-items: center; gap: 10px; max-width: min(94vw, 520px); }
#col.ok { background: #d3f9d8; } #col.bad { background: #ffe3e3; }
#col button { font-family: var(--hand); font-size: 19px; background: var(--pencil); color: #fff; border: 0; border-radius: 10px; padding: 6px 14px; min-height: 44px; cursor: pointer; }
#needname { position: fixed; inset: 0; z-index: 32; background: rgba(40, 32, 22, .6); display: flex; align-items: center; justify-content: center; padding: 14px; }
#needname form { background: #fff4ad; padding: 20px 22px; text-align: center; box-shadow: 0 6px 22px rgba(0, 0, 0, .4); max-width: 560px; width: 100%; }
#needname h1 { font-family: var(--head); font-weight: 400; font-size: clamp(28px, 7vw, 56px); margin: 0 0 4px; }
#needname p { font-size: 19px; margin: 4px 0 8px; color: var(--soft); }
#needname input { width: 100%; font-family: var(--hand); font-size: 30px; text-align: center; border: 0; border-bottom: 3px solid var(--pencil); background: transparent; padding: 6px; margin-bottom: 12px; color: var(--pencil); -webkit-user-select: text; user-select: text; }
#needname button { font-family: var(--hand); font-size: 24px; background: var(--live); color: #fff; border: 0; border-radius: 12px; padding: 8px 26px; min-height: 50px; cursor: pointer; }
</style>
</head>
<body>
<div id="book">
  <div id="top">
    <button id="thumb" class="none" aria-label="Starter picture: tap to enlarge" title="Tap to enlarge"><img id="thumbimg" alt="Starter picture"></button>
    <div id="tools"></div>
    <button id="save" hidden>Save / share</button>
  </div>
  <div id="stage"></div>
  <div id="foot"><div id="msg"></div></div>
  <div id="cover" hidden></div>
</div>
<div id="timer" hidden><i id="tfill"></i><b id="tdig"></b><span id="tsub"></span></div>
<input type="file" id="cam" accept="image/*" capture="environment" hidden>
<div id="pens"><div>Pens down!<small>Paused by your teacher</small></div></div>
<div id="big"><img id="bigimg" alt="Starter picture"><span id="bigcap"></span></div>
<div id="toast"></div>
<div id="col" hidden><span id="colmsg"></span><button id="colretry" hidden>Retry</button></div>
<div id="needname" hidden><form id="nnf"><h1>Type your name</h1><p>Your teacher is collecting the sheets.</p><input id="nn" maxlength="40" autocomplete="off" aria-label="Your name"><button type="submit">Send my sheet</button></form></div>
<dialog id="d-save"><h2>Save your design starter</h2>
  <div class="row"><label for="nm">Your name:</label><input id="nm" maxlength="40" autocomplete="off" placeholder="write your name"></div>
  <img id="outimg" alt="Your finished sheet">
  <p id="savenote">Your name and drawings stay on this device unless your teacher collects the sheets. Save the image, then upload it to Showbie.</p>
  <div class="row"><button class="go" id="doshare">Save / share (e.g. to Showbie)</button><button class="ghost" id="dodown">Download</button><button class="ghost" id="doclose">Close</button></div>
</dialog>
<script src="../workbooks.js"></script>
<script>
'use strict';
const $ = (s, r) => (r || document).querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ls = { get(k, d) { try { const v = localStorage.getItem('bsp-dstart.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem('bsp-dstart.' + k, JSON.stringify(v)); return true; } catch (e) { return false; } } };
try { if (localStorage.getItem('bsp-tools.dark') === 'true') document.body.classList.add('dark'); } catch (e) {}

const params = new URLSearchParams(location.search);
const BACKEND = params.get('backend') /* testing only */ || (window.WORKBOOKS && WORKBOOKS.backend) || '';
const BOARD_EMAIL = 'board@design-starter.local';
const LW = 2000, LH = 1500;                               // every drawing box is a 4:3 page in these units, whatever its size on screen
const BRUSH = { thin: { w: 5, t: 'pen', name: 'Thin pen' }, med: { w: 12, t: 'pen', name: 'Medium pen' }, thick: { w: 26, t: 'pen', name: 'Thick pen' }, marker: { w: 64, t: 'mk', name: 'Marker' }, eraser: { w: 80, t: 'er', name: 'Eraser' } };
const ICON = {
  thin: '<path d="M5 22c5-12 8 6 12-4s6-6 10-8" stroke-width="1.6"/>', med: '<path d="M5 22c5-12 8 6 12-4s6-6 10-8" stroke-width="3.4"/>', thick: '<path d="M5 22c5-12 8 6 12-4s6-6 10-8" stroke-width="6.5"/>',
  marker: '<path d="M6 21h20" stroke-width="9" opacity=".35"/><path d="M19 5l7 7-11 11-8 1 1-8z" stroke-width="2.2"/>',
  line: '<path d="M5 26L27 6" stroke-width="2.6"/><circle cx="5" cy="26" r="2.2" fill="currentColor"/><circle cx="27" cy="6" r="2.2" fill="currentColor"/>',
  eraser: '<path d="M5 20l12-13 9 8-10 11H10z" stroke-width="2.2"/><path d="M12 13l9 8M5 27h22" stroke-width="2.2"/>',
  undo: '<path d="M11 7l-6 6 6 6M5 13h14a7 7 0 0 1 0 14h-4" stroke-width="2.6"/>',
  zoom: '<path d="M5 11V5h6M21 5h6v6M27 21v6h-6M11 27H5v-6" stroke-width="2.8"/>',
};

let code = (params.get('s') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8);
let state = null, pics = [];       // what the board has published
let off = 0;                       // this iPad's clock compared with the server's (only used when it is clearly wrong)
let store = null;                  // { run, boxes: [[stroke, ...], ...] } saved on this iPad
let brush = 'thin', colour = '#111111', lineOn = false, zoomed = false;
let ana = ls.get('ana', false);  // the student's own choice: draw on the iPad (digital) or on paper and photograph it (analogue)
const photos = {};                 // box → { url, blob } (kept in IndexedDB on this iPad)
let fails = 0, pollT = null, gotOnce = false, lastBox = -9, lastPhase = '', toolKey = '', layoutKey = '';
const now = () => Date.now() + off;
const stage = $('#stage');
let pages = [];                    // { el, ink, ctx, w }
const liveC = document.createElement('canvas'); liveC.className = 'live'; const liveX = liveC.getContext('2d');

// ---------- timing: worked out on this iPad from the times the board published, so it keeps going if an update is missed ----------
function phase() {
  const s = state; if (!s || s.st === 'wait') return { ph: 'wait', box: -1 };
  const n = s.n || 6, dur = s.dur || 120000;
  if (s.st === 'idle') return { ph: 'idle', box: -1, n, dur };
  if (s.st === 'done') return { ph: 'done', box: n, n, dur };
  const hold = s.st === 'run' && s.ra && now() < s.ra;
  const e = s.st === 'paused' || hold ? s.pe : now() - s.t0;
  if (e >= n * dur) return { ph: 'done', box: n, n, dur };
  if (s.st === 'paused') return { ph: 'paused', box: e < 0 ? -1 : Math.floor(e / dur), left: e < 0 ? dur : dur - (e % dur), n, dur };
  if (e < 0) return { ph: 'lead', box: -1, left: -e, n, dur };
  return { ph: hold ? 'hold' : 'run', box: Math.floor(e / dur), left: dur - (e % dur), n, dur };
}
async function clockOffset() {
  let best = null;
  for (let i = 0; i < 3; i++) {
    try { const a = Date.now(), j = await (await fetch(BACKEND + (BACKEND.includes('?') ? '&' : '?') + 'a=ping', { cache: 'no-store' })).json(), b = Date.now(); if (j && j.now && (!best || b - a < best.rtt)) best = { rtt: b - a, o: j.now - (a + b) / 2 }; } catch (e) {}
  }
  // tablets keep good time by themselves; only correct a clock that is clearly out (more than the measuring error)
  off = best && Math.abs(best.o) > Math.max(2000, best.rtt) ? Math.round(best.o) : 0;
}

// ---------- reading the board ----------
async function fetchState() {
  const r = await fetch(BACKEND + (BACKEND.includes('?') ? '&' : '?') + 'a=progress&full=1&lesson=' + encodeURIComponent('dstart-' + code) + '&email=' + encodeURIComponent(BOARD_EMAIL), { cache: 'no-store' });
  const j = await r.json();
  if (!j || j.ok === false) throw new Error('bad');
  if (j.items === undefined) return { old: true };
  let s = null, p = null;
  try { s = j.items.state ? JSON.parse(j.items.state.answer) : null; } catch (e) {}
  try { p = j.items.pics ? JSON.parse(j.items.pics.answer) : null; } catch (e) {}
  return { s, p };
}
async function poll() {
  clearTimeout(pollT); if (!code) return;
  let wait = 3000;
  if (document.visibilityState === 'visible') {
    try {
      const r = await fetchState(); fails = 0; gotOnce = true;
      if (r.old) { cover('<h1>Not ready yet</h1><p>The results backend needs updating before this activity can run. Tell your teacher.</p>'); return; }
      if (r.s && (!state || (r.s.t || 0) >= (state.t || 0))) state = r.s; else if (!r.s) state = null;
      if (r.p && Array.isArray(r.p.list)) pics = r.p.list;
      apply();
      const ph = phase().ph; if (ph === 'done' || ph === 'wait') wait = 5000;
    } catch (e) { fails++; wait = Math.min(15000, 3000 * fails); apply(); }
  }
  pollT = setTimeout(poll, wait + Math.random() * 800);       // spread the class's requests out
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') poll(); });

// ---------- drawing data ----------
const storeKey = () => 'd.' + code;
function loadStore() { store = ls.get(storeKey(), null); if (!store || !Array.isArray(store.boxes)) store = { run: '', boxes: [] }; }
let saveT = null, fullWarned = false;
function persist() { clearTimeout(saveT); saveT = setTimeout(() => { if (!ls.set(storeKey(), store) && !fullWarned) { fullWarned = true; toast('iPad storage is full', 2500); } }, 400); }
const strokes = (i) => (store.boxes[i] = store.boxes[i] || []);
const hasInk = () => (store && store.boxes.some((b) => b && b.length)) || Object.keys(photos).length > 0;

// ---------- analogue: photos of paper drawings, small JPEGs in IndexedDB on this iPad only ----------
let db = null;

  const pr = (s.prompts && s.prompts[box]) || '', offl = fails >= 3 ? '<small>No connection to the board: still counting on this iPad.</small>' : '';
  const m = p.ph === 'idle' ? (hasInk() && !mine ? 'Your last pages are still here.' : 'Get ready!') + '<small>Look at the picture. Your teacher will start the timer.</small>'
    : p.ph === 'lead' ? 'Starting in ' + Math.ceil(p.left / 1000) + '…'
    : p.ph === 'paused' ? 'Pens down'
    : p.ph === 'done' ? 'Finished!<small>Save your page, then upload it to Showbie.</small>'

  if ($('#msg').dataset.k !== m) { $('#msg').dataset.k = m; $('#msg').innerHTML = m; }
  { const sv = !((p.ph === 'done' || p.ph === 'idle') && hasInk()); if ($('#save').hidden !== sv) { $('#save').hidden = sv; layoutKey = ''; layout(); } }
  if (s.collect !== lastCollect) { lastCollect = s.collect; colState = ''; }
  collectCheck();
}
setInterval(() => { if (code && (state || gotOnce || fails)) apply(); }, 250);

// ---------- save all the boxes as one image (made on this iPad; nothing is uploaded) ----------
const loadImg = (u) => new Promise((res) => { if (!u) return res(null); const im = new Image(); im.crossOrigin = 'anonymous'; im.onload = () => res(im); im.onerror = () => res(null); im.src = u; });
let outBlob = null;
async function compose(maxSide) {
  const s = state || {}, n = pages.length || s.n || 6, each = s.mode === 'each', name = myName();
  const list = each ? Array.from({ length: n }, (_, i) => picFor(i)) : [picFor(0)];
  const ims = await Promise.all(list.map((p) => loadImg(p && p.u)));
  const HAND = getComputedStyle(document.body).fontFamily, HEAD = getComputedStyle($('#msg')).fontFamily;
  const W = 2400, M = 70, G = 50, cols = n === 1 ? 1 : n <= 4 ? 2 : 3, rows = Math.ceil(n / cols), cw = (W - 2 * M - G * (cols - 1)) / cols, ch = cw * 0.75, hh = each ? 250 : 70;
  const top = each ? 250 : 640, H = top + rows * (hh + ch + G) + 60;
  const c = document.createElement('canvas'); c.width = W; c.height = H; const x = c.getContext('2d');
  x.fillStyle = '#f6efdc'; x.fillRect(0, 0, W, H);
  x.fillStyle = '#463b30'; for (let y = 40; y < H; y += 70) { x.beginPath(); x.arc(30, y, 9, 0, 7); x.fill(); }
  const fit = (im, bx, by, bw, bh) => { const k = Math.min(bw / im.width, bh / im.height), w = im.width * k, h = im.height * k; x.fillStyle = '#fff'; x.shadowColor = 'rgba(0,0,0,.3)'; x.shadowBlur = 12; x.fillRect(bx - 10, by - 10, w + 20, h + 20); x.shadowBlur = 0; x.drawImage(im, bx, by, w, h); return w; };
  const date = new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
  x.fillStyle = '#3b3a36'; x.textBaseline = 'alphabetic';
  let tx = M + 20;
  if (!each) {
    if (ims[0]) tx = M + 20 + fit(ims[0], M + 20, 60, 760, 500) + 60;
    else if (list[0]) { x.font = '34px ' + HAND; x.fillStyle = '#77736a'; x.fillText('(The starter picture could not be added to this image.)', M + 20, 600); x.fillStyle = '#3b3a36'; }
  }
  x.fillStyle = '#3b3a36'; x.font = '96px ' + HEAD; x.fillText('Design starter', tx, each ? 130 : 190);
  x.font = '52px ' + HAND; x.fillText(date + (name ? '  ·  ' + name : ''), tx, each ? 212 : 290);
  if (!each && list[0] && list[0].c) { x.font = '28px ' + HAND; x.fillStyle = '#77736a'; wrap(x, list[0].c, tx, 350, W - M - tx, 36, 4); x.fillStyle = '#3b3a36'; }
  for (let i = 0; i < n; i++) {
    const last = Math.floor(i / cols) === rows - 1 ? n - (rows - 1) * cols : cols, cx = M + (i % cols) * (cw + G) + (cols - last) * (cw + G) / 2, cy = top + Math.floor(i / cols) * (hh + ch + G);
    let lx = cx;
    if (each && ims[i]) lx = cx + fit(ims[i], cx + 10, cy + 10, 300, 210) + 40;
    x.fillStyle = '#3b3a36'; x.font = '56px ' + HEAD; x.fillText('Box ' + (i + 1), lx, cy + (each ? 80 : 50));
    const pr = (s.prompts && s.prompts[i]) || '';
    x.font = '36px ' + HAND; if (pr) { if (each) wrap(x, pr, lx, cy + 130, cx + cw - lx, 40, 2); else x.fillText(pr, lx + 230, cy + 48, cw - 240); }
    if (each && list[i] && list[i].c) { x.font = '22px ' + HAND; x.fillStyle = '#77736a'; x.fillText(ims[i] ? list[i].c : '(picture not added) ' + list[i].c, lx, cy + 222, cx + cw - lx); }
    x.fillStyle = '#fffdf6'; x.shadowColor = 'rgba(0,0,0,.28)'; x.shadowBlur = 14; x.fillRect(cx, cy + hh, cw, ch); x.shadowBlur = 0;
    const e = extent(i), k = Math.min(cw / (2 * e[0]), ch / (2 * e[1])), ox = cw / 2 - k * LW / 2, oy = ch / 2 - k * LH / 2;
    const t = document.createElement('canvas'); t.width = Math.round(cw); t.height = Math.round(ch); const tc = t.getContext('2d');
    const ph = pages[i] && photos[i] && $('img.ph', pages[i].el); if (ph && ph.naturalWidth) { const f = Math.min(k * LW / ph.naturalWidth, k * LH / ph.naturalHeight), w = ph.naturalWidth * f, h = ph.naturalHeight * f; tc.drawImage(ph, ox + (k * LW - w) / 2, oy + (k * LH - h) / 2, w, h); }
    tc.setTransform(k, 0, 0, k, ox, oy); strokes(i).forEach((o) => paint(tc, o, 1)); x.drawImage(t, cx, cy + hh);
    x.strokeStyle = '#b9b09a'; x.lineWidth = 2; x.strokeRect(cx, cy + hh, cw, ch);
  }
  if (!maxSide || Math.max(W, H) <= maxSide) return c;
  const k = maxSide / Math.max(W, H), d = document.createElement('canvas'); d.width = Math.round(W * k); d.height = Math.round(H * k); d.getContext('2d').drawImage(c, 0, 0, d.width, d.height); return d;
}
const toBlob = (c, q) => new Promise((res) => c.toBlob((b) => res(b), 'image/jpeg', q));

// ---------- teacher collection: only when the board asks, the finished sheet (with the name) is sent once ----------
let colBusy = false, colState = '';
const device = () => { let d = ls.get('device', ''); if (!d) { d = Array.from(crypto.getRandomValues(new Uint8Array(8)), (b) => b.toString(36).padStart(2, '0')).join('').slice(0, 12); ls.set('device', d); } return d; };
function colShow(kind, msg, retry) { const el = $('#col'); el.hidden = !kind; el.className = kind === 'ok' ? 'ok' : kind === 'bad' ? 'bad' : ''; $('#colmsg').textContent = msg || ''; $('#colretry').hidden = !retry; }
function collectCheck() {
  const s = state, want = s && s.st !== 'wait' && s.collect ? s.collect : 0, nn = $('#needname');
  if (!want) { nn.hidden = true; if (colState !== 'ok') colShow(''); return; }
  if (ls.get('col.' + code, 0) === want) { nn.hidden = true; if (colState !== 'ok') { colState = 'ok'; colShow('ok', 'Sent to your teacher ✓'); } return; }
  if (colBusy || colState === 'bad') return;
  if (!myName()) { if (nn.hidden) { nn.hidden = false; $('#nn').value = ''; } return; }
  nn.hidden = true; sendSheet(want);
}
async function sendSheet(want) {
  colBusy = true; colState = 'busy'; colShow('busy', 'Sending your sheet to your teacher…');
  let err = '';
  try {
    const c = await compose(1800); let data = c.toDataURL('image/jpeg', 0.8); if (data.length > 2.0e6) data = c.toDataURL('image/jpeg', 0.6);
    let ok = false;
    for (let i = 0; i < 3 && !ok; i++) {
      try { const j = await (await fetch(BACKEND, { method: 'POST', body: JSON.stringify({ a: 'dsup', session: code, name: myName(), device: device(), data }), headers: { 'Content-Type': 'text/plain;charset=utf-8' } })).json(); ok = !!(j && j.ok); if (!ok) { err = j && j.error === 'not collecting' ? 'Your teacher has stopped collecting.' : ''; if (j && j.error !== 'busy') break; } }
      catch (e) {}
      if (!ok) await new Promise((r) => setTimeout(r, 1500 * (i + 1)));
    }
    if (!ok) throw new Error(err);
    ls.set('col.' + code, want); colState = 'ok'; colShow('ok', 'Sent to your teacher ✓');
  } catch (e) { colState = 'bad'; colShow('bad', 'Not sent. ' + (e.message || 'Check the internet.'), true); }
  colBusy = false;
}
$('#colretry').onclick = () => { colState = ''; collectCheck(); };
$('#nnf').onsubmit = (e) => { e.preventDefault(); const v = $('#nn').value.trim(); if (!v) return $('#nn').focus(); setName(v); collectCheck(); };
function wrap(x, text, px, py, maxW, lh, maxLines) { const words = String(text).split(/\s+/); let line = '', n = 0; for (const w of words) { if (x.measureText(line + ' ' + w).width > maxW && line) { x.fillText(line, px, py + n * lh); line = w; if (++n >= maxLines) return; } else line = line ? line + ' ' + w : w; } x.fillText(line, px, py + n * lh); }
async function refreshOut() { setName($('#nm').value); outBlob = await toBlob(await compose(), 0.92); const im = $('#outimg'); if (im.src) URL.revokeObjectURL(im.src); if (outBlob) im.src = URL.createObjectURL(outBlob); }
const fileName = () => 'design-starter-' + new Date().toISOString().slice(0, 10) + (myName() ? '-' + myName().replace(/[^\w]+/g, '-') : '') + '.jpg';
$('#save').onclick = async () => { $('#nm').value = myName(); $('#d-save').showModal(); $('#nm').blur(); await refreshOut(); };
let nmT = null; $('#nm').oninput = () => { clearTimeout(nmT); nmT = setTimeout(refreshOut, 500); };
function download() { if (!outBlob) return; const a = document.createElement('a'); a.href = URL.createObjectURL(outBlob); a.download = fileName(); document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); }
$('#doshare').onclick = async () => {
  clearTimeout(nmT); await refreshOut(); if (!outBlob) { $('#savenote').textContent = 'Could not make the image. Take a screenshot instead.'; return; }
  const f = new File([outBlob], fileName(), { type: 'image/jpeg' });
  if (navigator.canShare && navigator.canShare({ files: [f] })) { try { await navigator.share({ files: [f] }); } catch (e) { if (e && e.name !== 'AbortError') download(); } }

  $('#savenote').textContent = 'If nothing happened, press and hold the picture above and choose “Save to Photos”.';
};
$('#dodown').onclick = download;
$('#doclose').onclick = () => $('#d-save').close();

function start() {
  if (!BACKEND) return cover('<h1>Not set up yet</h1><p>Tell your teacher.</p>');
  if (!code) return askCode();
  loadStore(); loadPhotos(); state = null; pics = []; gotOnce = false; fails = 0; lastPhase = ''; lastBox = -9;
  apply(); clockOffset().then(poll);
}
window.__ds = { phase, get state() { return state; }, get store() { return store; }, compose, photos };  // for testing
