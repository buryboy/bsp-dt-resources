<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Footprint lesson</title>
<link rel="stylesheet" href="../../../../fonts/lexend.css">
<style>
/* VOICE: clear, calm teaching board, readable from the back row
   IDEA: a finishing workshop's test bench: try a finish, watch what happens
   PICTURE: a live lab test on every section, run after the class predicts
   COLOUR and TYPE: workshop paper white, ink, one colour per material area; Lexend
   LAYOUT: section tabs down the side, finish cards left, lab test right */
:root{color-scheme:light;--bg:#f6f4ef;--card:#fff;--ink:#1b2a33;--mut:#5b6670;--line:#d8d3c7;--ok:#2e8b57;--a:#0f766e}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.45 "Lexend",system-ui,sans-serif;display:grid;grid-template-columns:260px 1fr;overflow:hidden}
nav{background:var(--ink);color:#fff;padding:18px 12px;display:flex;flex-direction:column;gap:6px;overflow:auto}
nav h1{font-size:20px;line-height:1.15;margin:4px 8px 14px;font-weight:700}
nav button{all:unset;cursor:pointer;padding:12px 14px;border-radius:12px;font-size:17px;display:flex;gap:10px;align-items:center;min-height:44px}
nav button:hover{background:#ffffff14}
nav button[aria-current=true]{background:#fff;color:var(--ink);font-weight:700}
nav button:focus-visible{outline:3px solid #ffe14d}
nav .dot{width:14px;height:14px;border-radius:4px;flex:none}
main{overflow:auto;padding:28px 34px}
.head{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap;margin-bottom:6px}
h2{font-size:40px;line-height:1.05;margin:0}
.lead{color:var(--mut);margin:0 0 20px;max-width:70ch;font-size:19px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:28px;align-items:start}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{all:unset;cursor:pointer;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px;min-height:118px;display:flex;flex-direction:column;gap:6px;transition:border-color .2s,transform .2s}
.card:hover{transform:translateY(-2px)}
.card:focus-visible{outline:3px solid var(--a);outline-offset:2px}
.card b{font-size:20px}
.card .hint{color:var(--mut);font-size:14px;margin-top:auto}
.card .back{display:none;font-size:15.5px;line-height:1.4}
.card.open{border-color:var(--c,var(--a))}
.card.open .back{display:block}.card.open .hint{display:none}
.back em{font-style:normal;font-weight:700;color:var(--c,var(--a))}
.lab{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:20px}
.lab h3{margin:0 0 4px;font-size:24px}
.lab .q{font-size:20px;margin:6px 0 12px}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.opt{all:unset;cursor:pointer;border:2px solid var(--line);border-radius:999px;padding:8px 16px;font-size:16px;min-height:28px}
.opt.sel{border-color:var(--ink);background:#1b2a330d;font-weight:700}
.opt.right{border-color:var(--ok);background:#2e8b571a;color:#1d6b40;font-weight:700}
.stage{position:relative;border-radius:14px;background:#efeae0;overflow:hidden}
.stage svg{display:block;width:100%;height:auto}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.go{all:unset;cursor:pointer;background:var(--ink);color:#fff;border-radius:12px;padding:12px 22px;font-weight:700;min-height:20px}
.go.sec{background:transparent;color:var(--ink);border:2px solid var(--line)}
.go:focus-visible,.opt:focus-visible{outline:3px solid var(--a);outline-offset:2px}
.clock{font-size:22px;font-weight:700;margin-left:auto}
input[type=range]{width:220px;accent-color:var(--ink)}
.result{display:none;margin-top:14px;padding:14px 16px;border-radius:12px;background:#2e8b5714;border-left:6px solid var(--ok);font-size:17px}
.result.show{display:block}
.qa{display:grid;gap:10px}
.qa .card{min-height:0}
@media(max-width:1000px){body{grid-template-columns:1fr;overflow:auto}nav{flex-direction:row;flex-wrap:wrap;padding:10px}nav h1{width:100%}.grid{grid-template-columns:1fr}main{overflow:visible;padding:18px}}
@media(prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<nav id="nav"><h1>Ecological and social footprint<br><span style="font-weight:400;font-size:14px;opacity:.75">AQA GCSE D&amp;T 3.2.3, 3.2.4</span></h1></nav>
<main id="main"></main>
<script>
{

const S=[
{t:'Sources and origins',c:'#8B5A2B',lead:'Every material starts somewhere: a forest, a mine, an oil well or a field. Getting it out has a cost to the planet and to people.',
 cards:[['Paper and timber','Trees. Managed forests are replanted (look for FSC); unmanaged logging destroys habitats.'],['Metals','Ores dug from mines, then smelted using huge amounts of energy.'],['Polymers','Mostly crude oil, a finite resource. Bioplastics come from plants such as corn.'],['Textiles','Natural fibres from plants (cotton) and animals (wool); synthetic fibres from oil (polyester).']],
 demo:{type:'origin',title:'Lab test: back to the source',q:'Polyester fleece is made from...',opts:['Sheep\'s wool','Crude oil','Cotton plants'],right:1,ms:5000,
  res:'Polyester is a synthetic fibre made from crude oil, just like most plastics. Recycled polyester can be made from used PET bottles instead.'}},
{t:'Ecological footprint',c:'#2E8B57',lead:'The ecological footprint is the damage a product does to the natural world over its whole life.',
 cards:[['Deforestation','Forests cleared for timber or farmland: habitats lost, less CO₂ absorbed.'],['Mining','Scars landscapes, pollutes water, uses lots of energy.'],['Drilling for oil','Spills and pollution; oil is finite.'],['Recycling helps','Recycled aluminium needs only about 5% of the energy of new aluminium.']],
 demo:{type:'recycle',title:'Lab test: new or recycled aluminium',q:'Compared with making new aluminium, recycling it saves about...',opts:['5% of the energy','50% of the energy','95% of the energy'],right:2,ms:4000,
  res:'Recycled aluminium needs only about 5% of the energy, so it saves about 95%. That is why cans are so worth recycling.'}},
{t:'Carbon footprint and transport',c:'#2478B3',lead:'The carbon footprint is all the CO₂ released over a product\'s life: making, moving, using and disposing of it.',
 cards:[['Transport','Air freight releases far more CO₂ than shipping. Local is usually best.'],['Energy in making','Fossil-fuel energy in factories adds CO₂.'],['Reduce it','Recycled materials, renewable energy, local suppliers, longer-lasting products.']],
 demo:{type:'transport',title:'Lab test: moving 1 tonne 10,000 km',q:'Which transport releases the MOST CO₂?',opts:['Ship','Lorry','Plane'],right:2,ms:4500,
  res:'Flying is the worst by far: roughly 60 times more CO₂ than shipping the same load. Approximate figures: ship 0.1 t, rail 0.25 t, lorry 1 t, plane 6 t.'}},
{t:'Life cycle assessment',c:'#C99A06',lead:'A life cycle assessment (LCA) checks the footprint at every stage, "cradle to grave".',
 cards:[['1 Material','Extracting and processing raw materials.'],['2 Making','Energy, water and chemicals used in manufacture.'],['3 Transport','Moving materials and products around the world.'],['4 Use','Energy and water used while the product works.'],['5 Disposal','Landfill, incineration, recycling or reuse.']],
 demo:{type:'lca',title:'Lab test: the life of a washing machine',q:'Which life-cycle stage uses the most energy for a washing machine?',opts:['Making it','Transport','Using it'],right:2,ms:5000,
  res:'Using it: years of heating water and spinning add up to far more than making or moving it. So an energy-efficient design matters most. (Illustrative split.)'}},
{t:'The 6Rs',c:'#7449B0',lead:'The 6Rs help designers and users cut a product\'s footprint.',
 cards:[['Reduce','Use less material and energy.'],['Reuse','Use again, for the same or a new purpose.'],['Recycle','Break down and remake into new material.'],['Repair','Fix it rather than throw it away.'],['Rethink','Question the design and the need for it.'],['Refuse','Do not accept unsustainable products.']],
 demo:{type:'sixr',title:'Lab test: one reusable bottle, one year',q:'Used every day for a year, how many single-use bottles does one reusable bottle replace?',opts:['About 12','About 52','About 365'],right:2,ms:5000,
  res:'One a day for a year is 365 single-use bottles that never need making, moving or throwing away.'}},
{t:'Social footprint',c:'#BE3F66',lead:'The social footprint is a product\'s effect on people: the workers who make it and the communities around them.',
 cards:[['Working conditions','Safe workplaces, fair hours, no child labour.'],['Fair Trade','Guarantees producers a fair price and supports their community.'],['Conflict minerals','Some metals in electronics fund wars. Ethical companies audit their supply chain.'],['Co-operatives','Businesses owned by their workers, who share the profits.']],
 demo:{type:'fair',title:'Lab test: where does £10 go?',q:'Of a £10 T-shirt, roughly how much goes to the person who sewed it?',opts:['Less than 20p','About £1','About £3'],right:0,ms:4500,
  res:'Campaign groups estimate garment workers receive around 1% or less of the shop price. Most goes to the retailer, brand, materials and transport. (Illustrative breakdown.)'}},
{t:'Quick fire',c:'#14213d',lead:'Say the answer before you tap. Then the exam question.',
 cards:[['Timber from managed forests','<em>FSC</em> label'],['Fix it, don\'t bin it','<em>Repair</em>'],['Worst transport for CO₂','<em>Air</em> freight'],['Fair price for producers','<em>Fair Trade</em>'],['Cradle to grave check','<em>Life cycle assessment</em>'],['Polymers mostly come from','<em>Crude oil</em>']],
 exam:{q:'Explain two ways a designer could reduce the environmental impact of a child\'s toy. (4 marks)',a:'Use FSC timber or recycled plastic (1), so fewer trees are cut or less oil is used (1). Design it to be repaired, e.g. screws not glue (1), so it lasts longer and is not thrown away (1). Accept local manufacture, less packaging, non-toxic finishes.'}}
];
const DEMOS={
origin:(t)=>{const m=[['Paper','Trees','#2478b3'],['Steel','Iron ore','#5b6670'],['Polyester','Crude oil','#7449b0'],['Cotton','Cotton plant','#be3f66']];const src=['Iron ore','Cotton plant','Trees','Crude oil'];let o='';
 m.forEach(([a,b,c],i)=>{const y=40+i*62,j=src.indexOf(b),y2=40+j*62;o+=`<rect x="20" y="${y}" width="150" height="44" rx="8" fill="${c}"/>`+T(95,y+28,a,'text-anchor="middle" fill="#fff" font-weight="700"');
  const k=clamp(t*4-i);if(k>0)o+=`<line x1="170" y1="${y+22}" x2="${lerp(170,420,k)}" y2="${lerp(y+22,y2+22,k)}" stroke="${c}" stroke-width="4"/>`});
 src.forEach((s,j)=>{const y=40+j*62;o+=`<rect x="420" y="${y}" width="160" height="44" rx="8" fill="#fff" stroke="#1b2a33" stroke-width="2"/>`+T(500,y+28,s,'text-anchor="middle"')});return o},
recycle:(t)=>{const k=clamp(t*1.4);return T(20,34,'Energy to make 1 tonne of aluminium','font-size="16" fill="#5b6670"')+`<rect x="80" y="${270-200*k}" width="160" height="${200*k}" fill="#5b6670"/>`+T(160,292,'New (from bauxite)','text-anchor="middle"')+`<rect x="360" y="${270-10*k}" width="160" height="${10*k}" fill="#2e8b57"/>`+T(440,292,'Recycled','text-anchor="middle"')+(t>.75?T(160,60,'100%','text-anchor="middle" font-weight="700" font-size="20"')+T(440,240,'about 5%','text-anchor="middle" font-weight="700" font-size="20" fill="#2e8b57"'):'')},
transport:(t)=>{const d=[['Ship',0.1,'#2478b3'],['Rail',0.25,'#2e8b57'],['Lorry',1,'#c99a06'],['Plane',6,'#c2410c']];let o=T(20,28,'Tonnes of CO₂ (approx.)','font-size="15" fill="#5b6670"');
 d.forEach(([n,v,c],i)=>{const y=50+i*58,w=v/6*430*clamp(t*1.3);o+=T(20,y+26,n)+`<rect x="100" y="${y}" width="${Math.max(2,w)}" height="38" fill="${c}"/>`+(t>.7?T(110+w,y+26,v+' t','font-weight="700"'):'')});return o},
lca:(t)=>{const st=[['Material',8,'#8b5a2b'],['Making',7,'#5b6670'],['Transport',2,'#2478b3'],['Use',80,'#c2410c'],['Disposal',3,'#2e8b57']];let o=T(20,30,'Share of lifetime energy (illustrative)','font-size="15" fill="#5b6670"'),x=20;
 st.forEach(([n,v,c],i)=>{const k=clamp(t*5-i),w=v/100*560*k;o+=`<rect x="${x}" y="70" width="${w}" height="70" fill="${c}"/>`;if(k>=1){o+=`<rect x="${20+i*112}" y="180" width="18" height="18" fill="${c}"/>`+T(44+i*112,195,n,'font-size="14"')+T(44+i*112,220,v+'%','font-size="16" font-weight="700" fill="'+c+'"')}x+=w});return o},
sixr:(t)=>{const n=Math.floor(t*365);let o=T(20,34,`Day ${n}: ${n} single-use bottles avoided`,'font-size="18" font-weight="700"');
 for(let i=0;i<n;i++){const x=24+(i%53)*9,y=275-Math.floor(i/53)*30;o+=`<rect x="${x}" y="${y-20}" width="6" height="20" rx="2" fill="#2478b3" opacity=".7"/>`}
 return o+`<rect x="540" y="60" width="30" height="70" rx="8" fill="#7449b0"/>`+T(555,150,'1 reusable','text-anchor="middle" font-size="13"')},
fair:(t)=>{const d=[['Retailer',5.9,'#5b6670'],['Brand',1.2,'#7449b0'],['Materials',1.3,'#8b5a2b'],['Factory and transport',1.5,'#2478b3'],['Worker',0.1,'#be3f66']];let o='',y=30;
 d.forEach(([n,v,c],i)=>{const k=clamp(t*5.5-i),h=Math.max(v/10*240,3)*k;o+=`<rect x="60" y="${y}" width="180" height="${h}" fill="${c}"/>`;if(k>=1)o+=T(260,y+Math.max(h/2,8)+5,n+': £'+v.toFixed(2),'fill="'+c+'" font-weight="700"');y+=h});return o}
};


const nav=document.getElementById('nav'),main=document.getElementById('main');let cur=0,anim=null;
S.forEach((s,i)=>{const b=document.createElement('button');b.innerHTML=`<span class="dot" style="background:${s.c}"></span>${i+1}. ${s.t}`;b.onclick=()=>show(i);nav.appendChild(b)});
const T=(x,y,t,o='')=>`<text x="${x}" y="${y}" font-family="Lexend" font-size="18" fill="#1b2a33" ${o}>${t}</text>`;
const AR=(x1,y1,x2,y2,c='#c2410c',w=5)=>{const a=Math.atan2(y2-y1,x2-x1),s=12;return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}"/><polygon points="${x2},${y2} ${x2-s*Math.cos(a-.5)},${y2-s*Math.sin(a-.5)} ${x2-s*Math.cos(a+.5)},${y2-s*Math.sin(a+.5)}" fill="${c}"/>`};
const lerp=(a,b,t)=>a+(b-a)*t, clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
function show(i){cur=i;cancelAnimationFrame(anim);[...nav.querySelectorAll('button')].forEach((b,k)=>b.setAttribute('aria-current',k===i));const s=S[i];
 const cards=s.cards.map(([n,b])=>`<button class="card" style="--c:${s.c}"><b>${n}</b><span class="back">${b}</span><span class="hint">Tap to reveal</span></button>`).join('');
 let right='';
 if(s.demo){const d=s.demo;right=`<section class="lab"><h3>${d.title}</h3><p class="q">${d.q}</p><div class="opts">${d.opts.map((o,k)=>`<button class="opt" data-k="${k}">${o}</button>`).join('')}</div><div class="stage" id="stage"></div><div class="row"><button class="go" id="run">${d.run||'Run the test'}</button><button class="go sec" id="reset">Reset</button>${(d.buttons||[]).map(b=>`<button class="opt" data-b="${b}">${b}</button>`).join('')}${d.slider?`<input type="range" id="slider" min="0" max="1000" value="0" aria-label="${d.slider}"><span class="clock" id="clock"></span>`:''}</div><div class="result" id="res">${d.res}</div></section>`}
 if(s.exam)right=`<section class="lab"><h3>Exam question</h3><p class="q">${s.exam.q}</p><button class="go" id="ex">Show a model answer</button><div class="result" id="res">${s.exam.a}</div></section>`;
 main.innerHTML=`<div class="head"><h2 style="color:${s.c}">${s.t}</h2></div><p class="lead">${s.lead}</p><div class="grid"${right?'':' style="grid-template-columns:1fr"'}><div class="cards">${cards}</div>${right}</div>`;
 main.querySelectorAll('.card').forEach(c=>c.onclick=()=>c.classList.toggle('open'));
 main.querySelectorAll('.opt[data-k]').forEach(o=>o.onclick=()=>o.classList.toggle('sel'));
 if(s.exam)document.getElementById('ex').onclick=()=>document.getElementById('res').classList.add('show');
 if(s.demo)setup(s.demo);main.scrollTop=0}
function setup(d){const st=document.getElementById('stage'),res=document.getElementById('res'),run=document.getElementById('run'),sl=document.getElementById('slider'),ck=document.getElementById('clock');
 const D=DEMOS[d.type];let state={mode:d.mode0||(d.buttons||[])[0]};
 const draw=t=>{st.innerHTML=`<svg viewBox="0 0 600 300">${D(t,state,d)}</svg>`;if(sl){sl.value=Math.round(t*1000);if(d.clock)ck.textContent=d.clock(t)}};
 const finish=()=>{res.classList.add('show');main.querySelector(`.opt[data-k="${d.right}"]`).classList.add('right')};
 const play=(ms,done=finish)=>{cancelAnimationFrame(anim);const t0=performance.now();const step=now=>{const t=Math.min(1,(now-t0)/ms);draw(t);if(t<1)anim=requestAnimationFrame(step);else done()};anim=requestAnimationFrame(step)};
 const reset=()=>{cancelAnimationFrame(anim);res.classList.remove('show');main.querySelectorAll('.opt').forEach(o=>o.classList.remove('right'));state.mode=d.mode0||(d.buttons||[])[0];draw(0)};
 run.onclick=()=>{reset();if(d.runMode)state.mode=d.runMode;play(d.ms||3000)};
 document.getElementById('reset').onclick=reset;
 main.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{state.mode=b.dataset.b;play(d.bms||1600,()=>{})});
 if(sl)sl.oninput=()=>{cancelAnimationFrame(anim);draw(sl.value/1000);if(sl.value>=1000)finish()};
 draw(0)}
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='ArrowDown'||e.key==='PageDown')show(Math.min(S.length-1,cur+1));if(e.key==='ArrowUp'||e.key==='PageUp')show(Math.max(0,cur-1))});
show(0);

}
</script>
</body>
</html>
