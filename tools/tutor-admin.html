<!doctype html>
<html lang="en">
<head>
<script src="../gate.js"></script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tutor admin · BSP</title>
<link rel="stylesheet" href="kit/tools.css">

<style>
:root { --bg: #f3f1ea; --card: #ffffff; --ink: #14213d; --ink2: #24408e; --line: #dad6ca; --muted: #5b6377; --gold: #a97a1f; --soft: #eef1f8; --good: #1f8a4c; --bad: #c0392b; --warn: #c98a00; --serif: 'Source Serif 4', Georgia, serif; }
body.dark { --bg: #0e1422; --card: #171f33; --ink: #eef1f8; --ink2: #9db4ff; --line: #2a3554; --muted: #a2abc2; --gold: #e3b860; --soft: #1e2942; --good: #4cc27d; --bad: #ff7b6b; --warn: #f0b83a; }
[hidden] { display: none !important; }
body { font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; min-height: 100vh; }
.tk-top { border-bottom: 1px solid var(--line); padding: 6px 14px; } .tk-top h1 { font: 600 17px Inter, sans-serif; }
.btn { box-shadow: 0 0 0 1.5px var(--line) inset; border-radius: 10px; font-weight: 600; } .btn.blue { background: var(--ink2); color: #fff; box-shadow: none; } .btn.go { background: var(--good); color: #fff; box-shadow: none; } .btn.stop { background: var(--bad); color: #fff; box-shadow: none; }
body.dark .btn.blue, body.dark .btn.go, body.dark .btn.stop { color: #0e1422; }
.btn.sm { min-height: 40px; padding: 6px 12px; font-size: 15px; } .btn[disabled] { opacity: .5; }
main { max-width: 1180px; margin: 0 auto; padding: 14px 14px 40px; display: grid; gap: 16px; }
.narrow { max-width: 460px; margin: 6vh auto 0; }
section.card { padding: 18px; box-shadow: none; border: 1px solid var(--line); border-radius: 14px; min-width: 0; }
h2 { font: 600 24px var(--serif); margin: 0 0 4px; } p.lead { color: var(--muted); margin: 0 0 12px; font-size: 15.5px; line-height: 1.4; }
label { display: block; font-weight: 600; font-size: 15px; margin: 10px 0 4px; } label small { font-weight: 400; color: var(--muted); }
input[type=text], input[type=password], input[type=number], input[type=date], input[type=time], textarea, select { width: 100%; border: 1.5px solid var(--line); border-radius: 10px; padding: 9px 11px; background: var(--card); font-size: 17px; min-height: 46px; }
textarea { min-height: 300px; resize: vertical; line-height: 1.4; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 15.5px; }
input:focus, textarea:focus, button:focus-visible, a:focus-visible, select:focus { outline: 3px solid var(--gold); outline-offset: 1px; }
.r { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; } .r > div { flex: 1; min-width: 140px; } .r > .fix { flex: none; min-width: 0; }
.acts { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 12px; } .st { font-size: 15px; font-weight: 600; color: var(--muted); } .st.ok { color: var(--good); } .st.err { color: var(--bad); } .st.dirty { color: var(--warn); }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; } @media (max-width: 860px) { .two { grid-template-columns: 1fr; } }
.tb { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
.pv { border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 16px; background: var(--bg); min-height: 300px; max-height: 560px; overflow: auto; }
.md { font-size: 18px; line-height: 1.4; overflow-wrap: anywhere; } .md h2 { font: 700 1.3em/1.15 var(--serif); margin: .7em 0 .25em; } .md h3 { font: 700 1.1em/1.2 var(--serif); margin: .7em 0 .2em; color: var(--ink2); } .md h4 { font-size: 1em; margin: .6em 0 .2em; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.md > :first-child { margin-top: .2em; } .md p { margin: .45em 0; } .md ul, .md ol { margin: .35em 0; padding-left: 1.25em; } .md li { margin: .2em 0; } .md li::marker { color: var(--gold); font-weight: 700; } .md hr { border: 0; border-top: 2px solid var(--line); } .md mark { background: color-mix(in srgb, var(--warn) 38%, transparent); color: inherit; } .md a { color: var(--ink2); }
.list { display: grid; gap: 8px; margin-top: 12px; }
.evr { display: grid; grid-template-columns: 120px minmax(0, 1fr) auto; gap: 6px 12px; align-items: center; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; } .evr .d { font-weight: 700; } .evr .d small { display: block; font-weight: 500; color: var(--muted); } .evr .t { font-weight: 600; overflow-wrap: anywhere; } .evr .t small { display: block; font-weight: 400; color: var(--muted); } .evr .b { display: flex; gap: 6px; }
@media (max-width: 560px) { .evr { grid-template-columns: 1fr auto; } .evr .d { grid-column: 1 / -1; } .evr .d small { display: inline; margin-left: 8px; } }
.hr { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 8px; align-items: center; margin-bottom: 8px; } .hr input[type=color] { width: 56px; height: 46px; padding: 2px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--card); }
.pts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 4px; } .pts label { margin: 0 0 4px; display: flex; align-items: center; gap: 8px; } .sw { width: 14px; height: 14px; border-radius: 4px; flex: none; }
.tw { overflow-x: auto; margin-top: 12px; } table { border-collapse: collapse; width: 100%; font-size: 16px; } th, td { padding: 8px 10px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; } th:first-child, td:first-child { text-align: left; } th { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); } tfoot td { font-weight: 700; border-top: 2px solid var(--ink); border-bottom: 0; font-size: 18px; } td small { color: var(--muted); display: block; font-size: 12.5px; }
.note { background: color-mix(in srgb, var(--warn) 18%, transparent); border-radius: 10px; padding: 8px 12px; font-size: 15px; margin-top: 10px; }
.links { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; } .links a { text-decoration: none; display: inline-flex; align-items: center; }
details > summary { cursor: pointer; font-weight: 600; min-height: 44px; display: flex; align-items: center; color: var(--muted); }
.dlg { position: fixed; inset: 0; z-index: 60; background: #0a1024b0; display: grid; place-items: center; padding: 16px; } .dlg .box { background: var(--card); border-radius: 16px; padding: 22px; max-width: 520px; width: 100%; } .dlg h3 { font: 600 24px var(--serif); margin: 0 0 8px; } .dlg p { margin: 0 0 14px; color: var(--muted); line-height: 1.4; }
.spin { display: inline-block; width: 1em; height: 1em; border: .16em solid currentColor; border-right-color: transparent; border-radius: 50%; animation: sp .8s linear infinite; vertical-align: -.12em; margin-right: .4em; } @keyframes sp { to { transform: rotate(360deg); } }
.seg { display: inline-flex; flex-wrap: wrap; border-radius: 10px; overflow: hidden; box-shadow: 0 0 0 1.5px var(--line) inset; } .seg button { border: 0; background: var(--card); padding: 9px 14px; font-weight: 600; font-size: 15.5px; cursor: pointer; min-height: 46px; color: var(--ink); flex: 1 0 auto; } .seg button.on { background: var(--ink2); color: #fff; } body.dark .seg button.on { color: #0e1422; }
.tg { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 12px; }
.tt { border: 2px solid var(--line); border-radius: 12px; background: var(--card); padding: 0 0 8px; cursor: pointer; overflow: hidden; color: var(--ink); text-align: center; } .tt.on { border-color: var(--ink2); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ink2) 30%, transparent); } .tt b { display: block; font-size: 14px; font-weight: 600; padding: 6px 6px 0; line-height: 1.2; }
.mini { display: block; position: relative; height: 74px; background: var(--bg); overflow: hidden; border-bottom: 1px solid var(--line); }
.cal { display: grid; gap: 6px; } .ce { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; align-items: center; border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; } .ce.offd { background: color-mix(in srgb, var(--soft) 55%, transparent); } .ce.offd b { color: var(--muted); }
.ck { display: flex; gap: 10px; align-items: center; margin: 0; cursor: pointer; min-height: 44px; font-weight: 400; } .ck input[type=checkbox] { width: 24px; height: 24px; flex: none; accent-color: var(--ink2); } .ck b { font-weight: 600; } .ck small { display: block; color: var(--muted); font-size: 13px; } .ck input[type=text] { min-height: 38px; padding: 4px 8px; font-size: 15px; }
.cd { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; } .cd input, .cd select { width: auto; min-height: 40px; padding: 4px 8px; font-size: 15px; } .cd .dmi { width: 70px; text-align: center; } .cd select { max-width: 170px; } .cd .st { font-size: 13.5px; }
.pk { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 6px; margin-top: 8px; } .pk button { border: 3px solid transparent; border-radius: 10px; padding: 0; overflow: hidden; cursor: pointer; background: var(--soft); aspect-ratio: 4 / 3; } .pk button.on { border-color: var(--ink2); } .pk img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ipv { position: relative; height: 150px; border-radius: 12px; overflow: hidden; background: var(--bg); border: 1px solid var(--line); margin-top: 12px; display: grid; place-items: center; } .ipv .im { position: absolute; inset: -12px; background-size: cover; background-position: center; } .ipv .pan { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 18px; text-align: center; } .ipv .pan b { display: block; font: 600 18px var(--serif); } .ipv .pan span { color: var(--muted); font-size: 13.5px; }
.hint { color: var(--muted); font-size: 14.5px; margin: 10px 0 0; }
.spw { display: flex; gap: 18px; flex-wrap: wrap; align-items: flex-start; } .spw > div:first-child { flex: 1; min-width: 220px; max-width: 360px; }
.sprev { width: 328px; height: 185px; overflow: hidden; border: 1px solid var(--line); border-radius: 10px; flex: none; background: var(--soft); max-width: 100%; } .sprev iframe { width: 1366px; height: 768px; border: 0; transform: scale(.2402); transform-origin: 0 0; pointer-events: none; display: block; }
@media (max-width: 560px) { .ce { grid-template-columns: 1fr; } .cd { justify-content: flex-start; padding-left: 34px; } .tg { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
footer { font-size: 13px; color: var(--muted); text-align: center; padding: 0 16px 14px; line-height: 1.4; }
#nx.drop { outline: 3px dashed var(--blue, #2b4c9b); outline-offset: 2px; background: color-mix(in srgb, var(--blue, #2b4c9b) 6%, transparent); }
</style>

<body>
<main id="app"></main>
<footer>Notices, events and house points are saved in the school's Google sheet “Tutor console”. Nothing about students is stored.</footer>
<script src="kit/tools.js"></script>
<script src="../workbooks.js"></script>
<script src="tutor-console-content.js?v=202611180802"></script>
<script src="tutor-console-themes.js?v=202611180802"></script>
<script>
'use strict';
TK.top('Tutor admin');
const $ = (s, r) => (r || document).querySelector(s);
const esc = TC.esc;
const params = new URLSearchParams(location.search);
const LOCAL = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
const TEST_BACKEND = LOCAL ? params.get('backend') : null;             // testing on this computer only
const BACKEND = TEST_BACKEND || (window.WORKBOOKS && WORKBOOKS.backend) || '';
const app = $('#app');
const ss = { get(k) { try { return sessionStorage.getItem('bsp-tutor.' + k) || ''; } catch (e) { return ''; } }, set(k, v) { try { sessionStorage.setItem('bsp-tutor.' + k, v); } catch (e) {} }, del(k) { try { sessionStorage.removeItem('bsp-tutor.' + k); } catch (e) {} } };
let pin = ss.get('pin');                    // the admin PIN: kept for this browser tab only
let S = null, noticeDay = '', dirty = false, editEv = null, editRound = null, houseDraft = null;
const NET = 'Could not reach the server. Check the internet and try again.';
const pad = (n) => String(n).padStart(2, '0');
const isoOf = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const dateOf = (iso) => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || ''); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : new Date(NaN); };
const nice = (iso, o) => { const d = dateOf(iso); return isNaN(d) ? String(iso || '') : d.toLocaleDateString('en-GB', o || { weekday: 'short', day: 'numeric', month: 'short' }); };
const addDays = (iso, n) => { const d = dateOf(iso); d.setDate(d.getDate() + n); return isoOf(d); };
const lastWed = (iso) => { const d = dateOf(iso); d.setDate(d.getDate() - ((d.getDay() + 4) % 7)); return isoOf(d); };
const hhmm = (ms) => { const d = new Date(Number(ms)); return isNaN(d) ? '' : pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const withBackend = (href) => href + (TEST_BACKEND ? (href.includes('?') ? '&' : '?') + 'backend=' + encodeURIComponent(TEST_BACKEND) : '');

async function post(body) {
  const ac = new AbortController(), to = setTimeout(() => ac.abort(), 45000);
  try { const r = await fetch(BACKEND, { method: 'POST', body: JSON.stringify(Object.assign({ pin }, body)), headers: { 'Content-Type': 'text/plain;charset=utf-8' }, signal: ac.signal }); if (!r.ok) throw new Error('HTTP ' + r.status); return await r.json(); }
  finally { clearTimeout(to); }
}
const busy = (btn, on, txt) => { if (!btn) return; if (on) { btn.dataset.t = btn.innerHTML; btn.disabled = true; btn.innerHTML = '<span class="spin"></span>' + esc(txt || 'Saving…'); } else { btn.disabled = false; if (btn.dataset.t) btn.innerHTML = btn.dataset.t; } };
function confirmBox(title, text, yes, fn, danger) {
  const d = document.createElement('div'); d.className = 'dlg';
  d.innerHTML = `<div class="box" role="alertdialog" aria-modal="true"><h3>${esc(title)}</h3><p>${esc(text)}</p><div class="acts"><button class="btn" id="dno">Go back</button><button class="btn ${danger ? 'stop' : 'blue'}" id="dyes">${esc(yes)}</button></div></div>`;
  document.body.appendChild(d); $('#dno', d).onclick = () => d.remove(); $('#dyes', d).onclick = () => { d.remove(); fn(); }; $('#dno', d).focus();
  d.addEventListener('keydown', (e) => { if (e.key === 'Escape') d.remove(); });
}
// run one admin action; shows the result in the section's status line
async function act(btn, stEl, body, okText) {
  busy(btn, true); if (stEl) { stEl.className = 'st'; stEl.textContent = ''; }
  try {
    const j = await post(body);
    if (j && j.ok) { busy(btn, false); if (stEl) { stEl.className = 'st ok'; stEl.textContent = okText || 'Saved ✓'; } return j; }
    if (j && j.error === 'Wrong PIN') { pin = ''; ss.del('pin'); stepPin('The PIN has changed. Please type it again.'); return null; }
    if (stEl) { stEl.className = 'st err'; stEl.textContent = j && j.error === 'busy' ? 'The server is busy. Try again in a moment.' : (j && j.error) || 'Could not save.'; }
  } catch (e) { if (stEl) { stEl.className = 'st err'; stEl.textContent = NET; } }
  busy(btn, false); return null;
}

// ---------- PIN ----------
function stepPin(msg) {
  app.innerHTML = `<form class="narrow card" id="f" autocomplete="off" style="border:1px solid var(--line);box-shadow:none"><h2>Tutor admin</h2><p class="lead">Set the banner, the day's notices, upcoming events and the house quiz points for the tutor console.</p>
    <label for="pn">Admin PIN</label><input id="pn" type="password" inputmode="numeric" maxlength="12" autocomplete="off">
    <div class="st err" id="err" style="min-height:1.4em;margin-top:8px">${esc(msg || '')}</div><button class="btn blue" type="submit" style="width:100%;min-height:54px;font-size:19px;margin-top:6px">Continue</button></form>`;
  $('#pn').focus();
  $('#f').onsubmit = async (e) => {
    e.preventDefault(); const v = $('#pn').value.trim(), b = $('#f button');
    if (!v) { $('#err').textContent = 'Type the PIN first.'; return; }
    busy(b, true, 'Checking…'); pin = v;
    try { const j = await post({ a: 'tccheck' }); if (j && j.ok) { ss.set('pin', v); start(); return; } pin = ''; $('#err').textContent = j && /Too many/.test(j.error || '') ? j.error : 'That PIN is not right.'; $('#pn').select(); }
    catch (x) { pin = ''; $('#err').textContent = NET; }
    busy(b, false);
  };
}

// ---------- loading ----------
async function reload(day) {
  const j = await post({ a: 'tcload', day: day || noticeDay || '' });
  if (j && j.error === 'Wrong PIN') { pin = ''; ss.del('pin'); stepPin('Please type the PIN again.'); return false; }
  if (!j || !j.ok) throw new Error((j && j.error) || 'bad');
  S = j; noticeDay = j.day; return true;
}
async function start() {
  app.innerHTML = '<p class="lead" style="text-align:center;margin-top:8vh"><span class="spin"></span>Loading…</p>';
  try { if (!(await reload())) return; } catch (e) { app.innerHTML = `<div class="narrow card" style="box-shadow:none;border:1px solid var(--line)"><h2>Could not load</h2><p class="lead">${NET}</p><button class="btn blue" id="again">Try again</button></div>`; $('#again').onclick = start; return; }
  app.innerHTML = `<section class="card links" id="top"></section><section class="card" id="sAnn"></section><section class="card" id="sBanner"></section><section class="card" id="sNotices"></section><section class="card" id="sEvents"></section><section class="card" id="sScores"></section><section class="card" id="sHouses"></section><section class="card" id="sStyle"></section><section class="card" id="sTheme"></section><section class="card" id="sMore"></section>`;
  // each section draws on its own: one broken section must never blank the whole page
  [['top', drawTop], ['sAnn', drawAnn], ['sBanner', drawBanner], ['sNotices', drawNotices], ['sEvents', drawEvents], ['sScores', drawScores], ['sHouses', drawHouses], ['sStyle', drawStyle], ['sTheme', drawTheme], ['sMore', drawMore]].forEach(([id, f]) => {
    try { f(); } catch (e) { console.error(id, e); const el = document.getElementById(id); if (el) el.innerHTML += `<p class="st err" style="margin:8px 0 0">This section could not be shown (${esc(String(e && e.message || e)).slice(0, 160)}). Refresh the page; if it stays, send this message to Mr Porter.</p>`; }
  });
}
async function refresh(parts) { try { if (!(await reload())) return; } catch (e) { return; } (parts || []).forEach((f) => f()); }
function drawTop() {
  $('#top').innerHTML = `<a class="btn blue" id="pvw" target="_blank" rel="noopener" href="#">Preview the console ↗</a><a class="btn" href="${esc(withBackend('house-quiz-admin.html'))}">Wednesday quiz admin →</a><span class="st" style="margin-left:auto">Today is ${esc(nice(S.today, { weekday: 'long', day: 'numeric', month: 'long' }))}</span>`;
  setPreviewLink();
}
function setPreviewLink() { const a = $('#pvw'); if (a) a.href = withBackend('tutor-console.html?style=' + encodeURIComponent(myStyle()) + (noticeDay && noticeDay !== S.today ? '&day=' + noticeDay : '')); }
// the chosen style: from the server once the script knows about styles; until then from this device (so the preview works straight away)
function myStyle() { const s = (TH && TH.style) || (S && S.theme && S.theme.style) || TK.store('tutor.style', 'classic'); return window.TCT && TCT.byStyle && TCT.byStyle[s] ? s : 'classic'; }

// ---------- banner ----------
function drawBanner() {
  const b = S.banner || { text: '', until: '' }, expired = b.text && b.until && b.until < S.today;
  const lines = String(b.text || '').split(/\s*(?:\n|\s\|\s)\s*/).filter(Boolean);
  $('#sBanner').innerHTML = `<h2>Banner</h2><p class="lead">Scrolls across the top of every board, round and round. Put each message on its own line and they follow one another. Leave it empty to hide it.</p>
    <div class="r"><div style="flex:3;min-width:220px"><label for="bt">Banner messages <small>(one per line)</small></label><textarea id="bt" rows="3" maxlength="900" style="min-height:110px;font-family:inherit;font-size:17px" placeholder="e.g. Fire drill at 10:20 today: line up on the field&#10;Christmas jumper day on Friday">${esc(lines.join('\n'))}</textarea></div>
    <div><label for="bu">Show until <small>(optional)</small></label><input id="bu" type="date" value="${esc(b.until)}"></div></div>
    <div class="acts"><button class="btn blue" id="bs">Save banner</button><button class="btn" id="bc">Clear</button><span class="st${expired ? ' dirty' : ''}" id="bst">${b.text ? (expired ? 'Not showing: it ended on ' + esc(nice(b.until)) : 'Showing now' + (lines.length > 1 ? ' (' + lines.length + ' messages)' : '') + (b.until ? ' until ' + esc(nice(b.until)) : '')) : 'No banner'}</span></div>`;
  // messages travel as "one | two | three" so they survive the server's single-line banner field
  $('#bs').onclick = async () => { const t = $('#bt').value.split('\n').map((x) => x.replace(/\s+/g, ' ').replace(/\s\|\s/g, ' / ').trim()).filter(Boolean).join(' | ');
    if (t.length > 300) { $('#bst').className = 'st err'; $('#bst').textContent = 'That is too long for the banner (' + t.length + ' of 300 characters). Shorten or remove a message.'; return; }
    if (await act($('#bs'), $('#bst'), { a: 'tcbanner', text: t, until: $('#bu').value })) refresh([drawBanner]); };
  $('#bc').onclick = async () => { if (await act($('#bc'), $('#bst'), { a: 'tcbanner', text: '', until: '' }, 'Cleared ✓')) refresh([drawBanner]); };
}

// ---------- the tannoy: record a short message that every open board plays ----------
const ANN_MAX = 60; let rec = null; // { chunks, mr, stream, t0, timer, blob, url, secs, mime }
function annMime() { const M = window.MediaRecorder; if (!M) return ''; return ['audio/webm;codecs=opus', 'audio/mp4', 'audio/webm', 'audio/ogg;codecs=opus'].find((t) => { try { return M.isTypeSupported(t); } catch (e) { return false; } }) || ''; }
function drawAnn() {
  const a = S.announcement, live = a && Date.now() - a.at < 15 * 60 * 1000, can = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
  const state = rec && rec.mr && rec.mr.state === 'recording' ? 'rec' : rec && rec.blob ? 'done' : 'idle';
  $('#sAnn').innerHTML = `<h2>📢 Announcement</h2><p class="lead">Record a short spoken message (up to ${ANN_MAX} seconds). Every open tutor console plays a chime and then your message within about 20 seconds. Boards need their sound on, and someone must have tapped the board once since it was opened. Not for emergencies: use the school's alarm systems for those. Recordings are deleted after 24 hours.</p>
    ${!can ? '<p class="st err">This browser cannot record sound. Try Chrome, Edge or Safari, and allow the microphone.</p>' : `
    <div class="acts" style="align-items:center">

    body = `<p class="lead">A picture shown softly behind the panels. Only its web address and credit are saved. Choose something calm: the notices must stay easy to read.</p>
      <form id="tsf" class="r" autocomplete="off"><div style="flex:3;min-width:200px"><label for="tq">Search Wikimedia Commons</label><input id="tq" type="text" maxlength="80" placeholder="e.g. Paris skyline, autumn forest, snow mountains"></div><div class="fix"><button class="btn" type="submit" id="tsb">Search</button></div></form>
      <div class="st${pickMsg ? '' : ''}" id="tsm" style="margin-top:6px">${esc(pickMsg)}</div><div class="pk" id="tpk">${picks.map((p, i) => `<button type="button" data-p="${i}" class="${p.u === TH.customUrl ? 'on' : ''}" title="${esc(p.c)}"><img src="${esc(p.s)}" alt="" loading="lazy"></button>`).join('')}</div>
      <label for="turl">Or paste the address of a picture or GIF <small>(it must start with https://)</small></label><input id="turl" type="text" inputmode="url" autocapitalize="off" spellcheck="false" maxlength="600" value="${esc(TH.customUrl)}" placeholder="https://…">
      <label for="tatt">Credit shown small in the corner <small>(optional)</small></label><input id="tatt" type="text" maxlength="200" value="${esc(TH.attribution)}">
      <div class="r"><div style="flex:2;min-width:200px"><label for="tstr">Strength: <span id="tsv">${Math.round(TH.strength)}</span>%</label><input id="tstr" type="range" min="5" max="60" step="1" value="${Math.round(TH.strength)}" style="width:100%;min-height:44px"></div>
        <div class="fix"><label class="ck" style="margin:0 0 10px"><input type="checkbox" id="tbl" ${TH.blur ? 'checked' : ''}><span><b>Blur the picture</b></span></label></div><div style="max-width:200px"><label for="thu">Show until <small>(optional)</small></label><input id="thu" type="date" value="${esc(TH.until)}"></div></div>
      <div class="ipv" id="ipv"><div class="im"></div><div class="pan"><b>Notices</b><span>How readable the panels stay</span></div></div>`;
  } else body = '<p class="lead" style="margin:6px 0 0">Plain: the board looks as it always has.</p>';
  $('#sTheme').innerHTML = `<h2>Background</h2><p class="lead">A quiet background behind the panels of the board, for special days. It never covers the notices, there is no sound, and the quiz and activity screens stay plain.</p>
    ${seg('mode', TH.mode, [['plain', 'Plain'], ['theme', 'Choose a theme'], ['auto', 'Automatic'], ['image', 'From the internet']])}
    ${TH.mode === 'theme' || TH.mode === 'auto' ? `<div class="r" style="align-items:center;margin-top:8px"><span class="st fix">How noticeable</span>${seg('intensity', TH.intensity, [['subtle', 'Subtle'], ['normal', 'Normal']])}</div>` : ''}
    ${body}
    <div class="acts"><button class="btn blue" id="tsave">Save background</button><button class="btn" id="tprev">Preview on the console ↗</button><button class="btn" id="toff">Turn off now</button><span class="st" id="thst"></span></div>
    <p class="hint" id="tnow"></p>`;
  const tnow = () => { const n2 = TCT.resolve(TH, S.today); $('#tnow').innerHTML = 'On the boards now: <b>' + esc(nm(saved)) + '</b>' + (JSON.stringify(n2) !== JSON.stringify(saved) ? ' · after saving: <b>' + esc(nm(n2)) + '</b>' : '') + (TH.mode === 'auto' ? ' · today is ' + esc(nice(S.today)) : ''); };
  tnow();
  const root = $('#sTheme'), changed = () => { say('#thst', 'dirty', 'Not saved yet'); tnow(); updatePreview(); const l = $('#spop'); if (l) l.href = withBackend('tutor-console.html?style=' + encodeURIComponent(TH.style) + '&theme=' + encodeURIComponent(JSON.stringify(TH))); };
  function say(sel, cls, t) { const el = $(sel); if (el) { el.className = 'st ' + cls; el.textContent = t; } }
  root.querySelectorAll('[data-seg] button').forEach((b) => b.onclick = () => { TH[b.parentNode.dataset.seg] = b.dataset.v; drawTheme(); changed(); });
  root.querySelectorAll('.tt').forEach((b) => b.onclick = () => { TH.themeId = b.dataset.id; root.querySelectorAll('.tt').forEach((x) => { x.classList.toggle('on', x === b); x.setAttribute('aria-pressed', x === b); }); changed(); });
  if ($('#thu')) $('#thu').onchange = () => { TH.until = $('#thu').value; changed(); };
  miniPreviews(root);
  // calendar
  const setOf = (id) => (TH.calendar.set[id] = TH.calendar.set[id] || {});
  root.querySelectorAll('[data-on]').forEach((c) => c.onchange = () => { const id = c.dataset.on; if (/^own\d+$/.test(id)) TH.calendar.custom[+id.slice(3)].on = c.checked; else setOf(id).on = c.checked; drawTheme(); changed(); });
  root.querySelectorAll('[data-ff],[data-ft]').forEach((i) => i.onchange = () => { const id = i.dataset.ff || i.dataset.ft, v = md(i.value); if (!v) { i.style.borderColor = 'var(--bad)'; say('#thst', 'err', 'Type the date as day/month, for example 5/11.'); return; } const o = setOf(id), e = TCT.entries(TH, year).find((x) => x.id === id); o.from = i.dataset.ff ? v : e.from; o.to = i.dataset.ft ? v : (i.dataset.ff && e.from === e.to ? v : e.to); drawTheme(); changed(); });
  root.querySelectorAll('[data-mf],[data-mt]').forEach((i) => i.onchange = () => { const id = i.dataset.mf || i.dataset.mt, o = setOf(id); if (i.dataset.mf) { o.from = i.value; if (!o.to || o.to < o.from) o.to = i.value; } else o.to = i.value; if (o.from && typeof o.on !== 'boolean') o.on = true; drawTheme(); changed(); });
  root.querySelectorAll('[data-of]').forEach((i) => i.onchange = () => { const c = TH.calendar.custom[+i.dataset.of]; c.from = i.value; if (!c.to || c.to < c.from) c.to = i.value; drawTheme(); changed(); });
  root.querySelectorAll('[data-ot]').forEach((i) => i.onchange = () => { TH.calendar.custom[+i.dataset.ot].to = i.value; drawTheme(); changed(); });
  root.querySelectorAll('[data-oth]').forEach((i) => i.onchange = () => { TH.calendar.custom[+i.dataset.oth].theme = i.value; drawTheme(); changed(); });
  root.querySelectorAll('[data-ol]').forEach((i) => i.onchange = () => { TH.calendar.custom[+i.dataset.ol].label = i.value.trim(); changed(); });
  root.querySelectorAll('[data-ox]').forEach((b) => b.onclick = () => { TH.calendar.custom.splice(+b.dataset.ox, 1); drawTheme(); changed(); });
  if ($('#tadd')) $('#tadd').onclick = () => { TH.calendar.custom.push({ label: 'My own entry', theme: 'confetti', from: S.today, to: S.today, on: true }); drawTheme(); changed(); const r = root.querySelectorAll('[data-ol]'); r[r.length - 1].focus(); r[r.length - 1].select(); };
  // picture
  const ipv = () => { const b = $('#ipv .im'); if (!b) return; const ok = TCT.okUrl(TH.customUrl); b.style.backgroundImage = ok ? 'url("' + TH.customUrl + '")' : 'none'; b.style.opacity = String(TH.strength / 100); b.style.filter = TH.blur ? 'blur(6px)' : 'none'; };
  if (TH.mode === 'image') {
    ipv();
    $('#tsf').onsubmit = async (e) => { e.preventDefault(); const q = $('#tq').value.trim(); if (!q) return; busy($('#tsb'), true, 'Searching…'); try { picks = await commonsSearch(q); pickMsg = picks.length ? 'Tap a picture to use it.' : 'Nothing found for that. Try other words.'; } catch (x) { picks = []; pickMsg = 'Could not search Wikimedia Commons just now. You can still paste a picture address below.'; } const keep = q; drawTheme(); $('#tq').value = keep; };
    root.querySelectorAll('#tpk button').forEach((b) => b.onclick = () => { const p = picks[+b.dataset.p]; TH.customUrl = p.u; TH.attribution = p.c; const q = $('#tq').value; drawTheme(); $('#tq').value = q; changed(); });
    $('#turl').onchange = () => { const v = $('#turl').value.trim(); if (v && !TCT.okUrl(v)) { say('#thst', 'err', 'That address cannot be used: it must start with https:// and have no spaces or quotes.'); return; } if (v !== TH.customUrl) { TH.customUrl = v; if (!picks.some((p) => p.u === v)) { TH.attribution = ''; $('#tatt').value = ''; } } ipv(); changed(); };
    $('#tatt').onchange = () => { TH.attribution = $('#tatt').value.trim(); changed(); };
    $('#tstr').oninput = () => { TH.strength = +$('#tstr').value; $('#tsv').textContent = TH.strength; ipv(); changed(); };
    $('#tbl').onchange = () => { TH.blur = $('#tbl').checked; ipv(); changed(); };
  }
  const ready = () => { if (TH.mode === 'image' && !TCT.okUrl(TH.customUrl)) { say('#thst', 'err', 'Choose a picture or paste its address first.'); return false; } return true; };
  $('#tsave').onclick = () => { if (ready()) saveTheme($('#tsave'), $('#thst')); };
  $('#tprev').onclick = () => { if (!ready()) return; const u = withBackend('tutor-console.html?style=' + encodeURIComponent(TH.style) + '&theme=' + encodeURIComponent(JSON.stringify(TH))); window.__lastPreview = u; window.open(u, '_blank', 'noopener'); };
  $('#toff').onclick = async () => { const keep = Object.assign({}, TH, { mode: 'plain' }); TH = themeDefaults(keep); await saveTheme($('#toff'), $('#thst'), 'Background turned off ✓'); };
}

// ---------- PIN + automatic notices ----------
function drawMore() {
  $('#sMore').innerHTML = `<h2>Settings</h2>
    <details><summary>Change the admin PIN</summary><form id="pf" autocomplete="off"><div class="r"><div style="max-width:220px"><label for="np1">New PIN <small>(4 to 8 digits)</small></label><input id="np1" type="password" inputmode="numeric" maxlength="8" autocomplete="new-password"></div><div style="max-width:220px"><label for="np2">New PIN again</label><input id="np2" type="password" inputmode="numeric" maxlength="8" autocomplete="new-password"></div><div class="fix"><button class="btn blue" type="submit" id="psv">Change PIN</button></div></div><div class="st" id="pst" style="margin-top:8px"></div></form></details>
    <p class="lead" style="margin:10px 0 0">Automatic notices from Teams (Power Automate): ${S.pushOn ? '<b>switched on</b> (a push key is set in the script).' : 'switched off. To use it, set the script property TC_PUSH_KEY: the steps are in the comment at the top of the tutor console section of Code.gs.'}</p>`;
  $('#pf').onsubmit = async (e) => {
    e.preventDefault(); const a = $('#np1').value.trim(), b = $('#np2').value.trim(), st = $('#pst');
    if (!/^\d{4,8}$/.test(a)) { st.className = 'st err'; st.textContent = 'The PIN must be 4 to 8 digits.'; return; }
    if (a !== b) { st.className = 'st err'; st.textContent = 'The two PINs are not the same.'; return; }
    if (await act($('#psv'), st, { a: 'tcsetpin', newPin: a }, 'PIN changed ✓')) { pin = a; ss.set('pin', a); $('#np1').value = $('#np2').value = ''; }
  };
}

if (!BACKEND) app.innerHTML = '<div class="narrow card"><h2>Not set up</h2><p class="lead">The server address is missing (workbooks.js).</p></div>';
else if (pin) start();
else stepPin();
</script>
</body>
