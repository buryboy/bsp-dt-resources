*{box-sizing:border-box}
html,body{margin:0;-webkit-text-size-adjust:100%}
body{font-family:'Nunito',Arial,sans-serif;min-height:100vh;background:#2b2118}
body.e80{background:#0d0618}
#bar{position:sticky;top:0;z-index:50;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;background:#3d2a1a;color:#fbe9c8;box-shadow:0 2px 10px rgba(0,0,0,.4)}
.e80 #bar{background:#160a2a;color:#e9f9ff;border-bottom:2px solid #ff2fb3}
#bar h1{font:600 18px 'Fredoka',sans-serif;margin:0 auto 0 0}
.e80 #bar h1{font:400 11px 'Press Start 2P',monospace;color:#5ef3ff;line-height:1.5}
#bar select,#bar button{font:700 14px 'Nunito',sans-serif}
#bar button{background:#fbe9c8;color:#3d2a1a;border:0;border-radius:20px;padding:8px 14px;cursor:pointer}
#bar button.primary{background:#e8742c;color:#fff}
.e80 #bar button{border-radius:4px;background:#2a1450;color:#e9f9ff;border:1px solid #5ef3ff}
.e80 #bar button.primary{background:#ff2fb3;border-color:#ff2fb3}
#bar select{border-radius:20px;padding:7px 10px;border:0;max-width:220px}
#saved{font:600 12px 'Nunito',sans-serif;opacity:.8;min-width:70px}
main{padding:6px 12px 80px}
.sheettools{margin:20px auto 8px;display:flex;gap:6px;align-items:center;font:700 13px 'Nunito',sans-serif;color:#fbe9c8}
.e80 .sheettools{color:#e9f9ff}
.sheettools button{font:700 13px 'Nunito',sans-serif;background:#fbe9c8;border:0;border-radius:16px;padding:6px 12px;color:#3d2a1a;cursor:pointer}
.e80 .sheettools button{border-radius:4px;background:#2a1450;color:#e9f9ff;border:1px solid #5ef3ff}
.sheettools .nm{margin-right:auto}
.frame{position:relative;overflow:hidden;margin:0 auto;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.sheet{position:absolute;left:0;top:0;width:1680px;height:1188px;transform-origin:0 0;overflow:hidden}
/* ---------- 1960s ---------- */
.e60 .sheet{background-color:#f6ead2;color:#3d2a1a;
 background-image:radial-gradient(circle at 1540px 1090px,rgba(232,116,44,.20) 0 120px,transparent 121px),radial-gradient(circle at 1540px 1090px,rgba(242,183,5,.25) 0 200px,transparent 201px),radial-gradient(circle at 1540px 1090px,rgba(42,140,130,.16) 0 280px,transparent 281px),radial-gradient(circle at 1640px 60px,rgba(42,140,130,.18) 0 90px,transparent 91px),radial-gradient(circle at 1640px 60px,rgba(232,116,44,.16) 0 150px,transparent 151px)}
.e60 .side{background:#e8742c;color:#fff8ec;border-radius:0 60px 60px 0}
.e60 .side .num{font:600 15px 'Fredoka',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#ffe2a8}
.e60 .side h2{font:600 34px/1.05 'Fredoka',sans-serif;color:#fff}
.e60 .hint{background:rgba(255,255,255,.16);border-radius:16px;padding:10px 14px}
.e60 .hint .h{font:600 14px 'Fredoka',sans-serif;color:#ffe2a8}
.e60 .head{font:600 44px 'Fredoka',sans-serif;color:#3d2a1a}
.e60 .chip{background:#2a8c82;color:#fff;border-radius:30px;font:600 17px 'Fredoka',sans-serif}
.e60 .foot{color:#8a6a48}
.e60 .box{background:rgba(255,252,244,.92);border:3px solid #5a3b1e;border-radius:22px}
.e60 .lab{font:600 19px 'Fredoka',sans-serif;color:#5a3b1e}
.e60 .tool{border:2px solid #5a3b1e;background:#fff8ec;color:#5a3b1e;border-radius:14px}
.e60 .tool.on{background:#5a3b1e;color:#fff}
.e60 .rz{background:#e8742c}
.e60 .box.active{border-color:#e8742c}
.e60 textarea,.e60 .tacopy,.e60 input.nm{color:#3d2a1a}
.e60 .empty{color:#b0906c}
/* ---------- 1980s ---------- */
.e80 .sheet{background-color:#140828;color:#e9f9ff;
 background-image:linear-gradient(180deg,transparent 0 860px,rgba(255,47,179,.18) 1188px),linear-gradient(rgba(94,243,255,.10) 1px,transparent 1px),linear-gradient(90deg,rgba(94,243,255,.10) 1px,transparent 1px);
 background-size:100% 100%,40px 40px,40px 40px}
.e80 .side{background:linear-gradient(180deg,#2a0f52,#3a0d4a);color:#e9f9ff;border-right:3px solid #ff2fb3}
.e80 .side .num{font:400 11px/1.6 'Press Start 2P',monospace;color:#5ef3ff}
.e80 .side h2{font:400 30px/1.15 'Monoton',sans-serif;color:#ff8be0;letter-spacing:.02em}
.e80 .hint{border-left:3px solid #5ef3ff;padding:2px 0 2px 12px}
.e80 .hint .h{font:400 10px/1.6 'Press Start 2P',monospace;color:#ffe45e}
.e80 .head{font:400 46px 'Monoton',sans-serif;color:#ff8be0;text-shadow:0 0 12px rgba(255,47,179,.6)}
.e80 .chip{background:#5ef3ff;color:#140828;border-radius:3px;font:400 13px 'Press Start 2P',monospace;text-shadow:none}
.e80 .foot{color:#8f7fb8;font-family:'Press Start 2P',monospace;font-size:10px}
.e80 .box{background:rgba(25,10,50,.86);border:2px solid #5ef3ff;border-radius:6px;box-shadow:0 0 14px rgba(94,243,255,.35)}
.e80 .lab{font:400 12px 'Press Start 2P',monospace;color:#5ef3ff}
.e80 .tool{border:1px solid #5ef3ff;background:#140828;color:#e9f9ff;border-radius:3px}
.e80 .tool.on{background:#ff2fb3;border-color:#ff2fb3}
.e80 .rz{background:#ff2fb3}
.e80 .box.active{border-color:#ff2fb3;box-shadow:0 0 18px rgba(255,47,179,.6)}
.e80 textarea,.e80 .tacopy,.e80 input.nm{color:#f2f8ff}
.e80 textarea::placeholder,.e80 input.nm::placeholder{color:#8f7fb8}
.e80 .empty{color:#8f7fb8}
.e80 .photos img{box-shadow:0 0 0 2px rgba(255,255,255,.15)}
/* ---------- shared layout ---------- */
.side{position:absolute;left:0;top:0;bottom:0;width:370px;padding:30px 28px;overflow:hidden;font:400 16px/1.45 'Nunito',sans-serif}
.side h2{margin:10px 0 8px}
.hints{margin-top:14px}
.hint{margin:0 0 12px}
.hint .h{display:block;margin-bottom:4px}
.hint ul{margin:2px 0 0;padding-left:18px}.hint li{margin:2px 0}
.pdf-nohints .hints{display:none}
.only60,.only80{display:none}
.e60 .only60,.e80 .only80{display:block}
.head{position:absolute;left:410px;right:40px;top:28px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-block;vertical-align:10px;margin-right:16px;padding:6px 14px}
.foot{position:absolute;right:34px;bottom:12px;font:600 13px 'Nunito',sans-serif}
.box{position:absolute;display:flex;flex-direction:column}
.lab{flex:0 0 40px;height:40px;display:flex;align-items:center;gap:6px;padding:0 10px 0 8px;user-select:none;-webkit-user-select:none}
.grip{cursor:move;touch-action:none;padding:4px 6px;opacity:.55;font-size:18px;line-height:1}
.lab .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-right:auto;padding-left:2px}
.lab .t[contenteditable=true]{-webkit-user-select:text;user-select:text;outline:none;border-bottom:1px dashed currentColor}
.tools{display:flex;gap:4px;align-items:center}
.tool{font:700 14px 'Nunito',sans-serif;line-height:1;padding:0 8px;height:28px;touch-action:manipulation;cursor:pointer}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid transparent;padding:0;cursor:pointer}
.sw.on{border-color:#fff;box-shadow:0 0 0 2px #000}
.only-active{display:none}.box.active .only-active{display:inline-flex}
.box.active .not-active{display:none}
.bd{position:relative;flex:1;overflow:hidden;margin:0 4px 4px}
textarea,.tacopy{position:absolute;left:0;top:0;width:100%;height:100%;border:0;resize:none;background:transparent;font:400 19px/1.45 'Nunito',sans-serif;padding:4px 12px 8px;outline:none;white-space:pre-wrap;overflow-wrap:break-word}
input.nm{position:absolute;left:0;top:0;width:100%;height:100%;border:0;background:transparent;font:600 26px 'Nunito',sans-serif;padding:4px 14px;outline:none}
.rz{position:absolute;right:-9px;bottom:-9px;width:24px;height:24px;touch-action:none;cursor:nwse-resize;border:3px solid #fff;border-radius:50%;z-index:3}
.box.active{z-index:5}
.warn{display:none;position:absolute;right:22px;bottom:6px;font:700 12px 'Nunito',sans-serif;background:#c0392b;color:#fff;padding:2px 8px;border-radius:8px;z-index:3}
.box.over .warn{display:block}
.empty{position:absolute;left:0;top:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;text-align:center;font:700 18px 'Nunito',sans-serif;padding:20px;pointer-events:none}
.photos{position:absolute;left:0;top:0;right:0;bottom:0}
.photos img{position:absolute;display:block}
canvas.ink{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.box.active canvas.ink{pointer-events:auto;touch-action:none}
.era .bd{display:flex;gap:18px;padding:6px 10px 12px}
.erabtn{flex:1;border-radius:18px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:4px solid transparent;padding:10px}
.erabtn .big{font-size:54px;line-height:1}
.erabtn.b60{background:#e8742c;color:#fff;font:600 26px 'Fredoka',sans-serif}
.erabtn.b60 .big{font:600 64px 'Fredoka',sans-serif;color:#ffe2a8}
.erabtn.b80{background:#140828;color:#5ef3ff;font:400 13px/1.6 'Press Start 2P',monospace;border-color:#ff2fb3}
.erabtn.b80 .big{font:400 60px 'Monoton',sans-serif;color:#ff8be0}
.erabtn.on{outline:6px solid #2a8c82;outline-offset:3px}
.e80 .erabtn.on{outline-color:#5ef3ff}
.erabtn small{font:700 15px 'Nunito',sans-serif;opacity:.9}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;display:none;align-items:center;justify-content:center}
#overlay div{color:#fff;font:700 18px 'Nunito',sans-serif;text-align:center;max-width:80vw}
</style>

<script>
'use strict';
const W = 1680, H = 1188, X0 = 410, X1 = 1650, Y0 = 100, Y1 = 1160, LAB = 34, RES = 1.6, SNAP = 10;
const STORE = 'tin-can-lamp-y9-v1';

const SHEETS = [
{ id:'cover', chip:'Start', title:'My Upcycled Tin Can Lamp', tag:'Year 9 · Design & Technology', hints:[
  ['Your project','You are turning an old tin can into a working lamp inspired by an era of design: the 1960s or the 1980s.'],
  ['How this workbook works','<ul><li>Tap a box to type.</li><li>Tap 📷 to add photos from your iPad or take one with the camera.</li><li>Tap ✏️ to draw, then <b>Done</b>.</li><li>Drag ⠿ to move a box. Drag the round handle to resize it.</li></ul>'],
  ['A lamp you like','Find a lamp you like, at home, in a shop or online. Take or save a photo, add it with 📷, then explain what you like about it.'],
  ['Saving','Your work saves on this iPad. At the end of each lesson, tap <b>📸 Screenshot page</b> (or <b>Screenshot all pages</b>) and upload the pictures to Showbie.']],
  boxes:[
  {id:'name',type:'name',label:'Your name',x:410,y:120,w:800,h:100},
  {id:'form',type:'text',label:'Class',x:1230,y:120,w:420,h:100,ph:'e.g. 9P'},
  {id:'era',type:'era',label:'Choose your era',x:410,y:240,w:1240,h:380},
  {id:'lamp',type:'draw',label:'A lamp I like',x:410,y:640,w:480,h:500},
  {id:'lampwhy',type:'text',label:'Why I like this lamp',x:910,y:640,w:370,h:500,ph:'Shape, colour, materials, the light it gives, where it would go…'},
  {id:'why',type:'text',label:'Why I chose this era',x:1300,y:640,w:350,h:500,ph:'What do you like about the look of this era? Colours, shapes, objects, music, films…'}]},

{ id:'mood', chip:'Research', title:'Mood board', tag:'Page 2', hints:[
  ['What is a mood board?','A collection of images that captures the look and feel of an era: colours, shapes, patterns, materials and famous designs. It is your inspiration, not something to copy.'],
  ['Look for',{60:'<ul><li>Lava lamps and Space Age lighting</li><li>Designs by Verner Panton and Eero Saarinen</li><li>Op art and flower-power patterns</li><li>Orange, mustard, avocado and teal</li><li>Moulded plastic, chrome and teak</li></ul>',80:'<ul><li>Neon signs and arcade games</li><li>Memphis Group furniture (Ettore Sottsass)</li><li>Geometric shapes, squiggles and grids</li><li>Hot pink, cyan and yellow on black</li><li>Plastic, chrome and laminate</li></ul>'}],
  ['Adding images','Save images to Photos (in Safari, press and hold an image, then Save to Photos). Then tap 📷 in the mood board box. Aim for 6 to 10 images.']],
  boxes:[
  {id:'board',type:'draw',fill:true,label:'My mood board',x:410,y:120,w:820,h:1020},
  {id:'colours',type:'text',label:'Colours',x:1250,y:120,w:400,h:230,ph:'Which colours keep appearing?'},
  {id:'shapes',type:'text',label:'Shapes and patterns',x:1250,y:370,w:400,h:230,ph:'Curves? Circles? Zig-zags? Stripes?'},
  {id:'materials',type:'text',label:'Materials and textures',x:1250,y:620,w:400,h:230,ph:'Shiny, matt, plastic, metal, wood…'},
  {id:'inspired',type:'text',label:'My lamp will be inspired by…',x:1250,y:870,w:400,h:270,ph:'Pick the two or three things from your mood board you will use.'}]},

{ id:'base', chip:'Ideas', title:'Initial base ideas', tag:'Page 3', hints:[
  ['What makes a good base?','<ul><li>Heavy and wide enough not to tip over</li><li>Holds the tin can firmly</li><li>Hides or guides the cable</li><li>Clearly looks like your era</li></ul>'],
  ['How','Sketch in your book or make a quick card model, then photograph it with 📷. Or draw straight into the box with ✏️.'],
  ['Era ideas',{60:'Think curves, domes, mushroom and tulip shapes, circles and flower forms.',80:'Think stacked blocks, triangles, zig-zags, bold stripes and neon edges.'}]],
  boxes:[
  {id:'b1',type:'draw',label:'Base idea 1',x:410,y:120,w:610,h:280},
  {id:'b2',type:'draw',label:'Base idea 2',x:1040,y:120,w:610,h:280},
  {id:'n1',type:'text',label:'Idea 1 notes',x:410,y:410,w:610,h:110,ph:'Materials, size, how it looks like my era'},
  {id:'n2',type:'text',label:'Idea 2 notes',x:1040,y:410,w:610,h:110,ph:'Materials, size, how it looks like my era'},
  {id:'b3',type:'draw',label:'Base idea 3',x:410,y:530,w:610,h:280},
  {id:'b4',type:'draw',label:'Base idea 4',x:1040,y:530,w:610,h:280},
  {id:'n3',type:'text',label:'Idea 3 notes',x:410,y:820,w:610,h:110,ph:'Materials, size, how it looks like my era'},
  {id:'n4',type:'text',label:'Idea 4 notes',x:1040,y:820,w:610,h:110,ph:'Materials, size, how it looks like my era'},
  {id:'choose',type:'text',label:'Which base will I develop, and why?',x:410,y:940,w:1240,h:200,ph:'My best base idea is… because…'}]}
];

/* ---------- state ---------- */
let S = {name:'', era:'', boxes:{}, added:{}};
let dbh = null;
function idb(){ if(dbh) return Promise.resolve(dbh); return new Promise((res,rej)=>{ const r=indexedDB.open(STORE,1); r.onupgradeneeded=()=>r.result.createObjectStore('kv'); r.onsuccess=()=>{dbh=r.result;res(dbh)}; r.onerror=()=>rej(r.error); }); }
async function loadState(){
  try{ const db=await idb(); const v=await new Promise(res=>{const q=db.transaction('kv').objectStore('kv').get('state'); q.onsuccess=()=>res(q.result); q.onerror=()=>res(null);}); if(v) return JSON.parse(v); }catch(e){}
  try{ const v=localStorage.getItem(STORE); if(v) return JSON.parse(v); }catch(e){}
  return null;
}
let saveT=null;
function save(){ clearTimeout(saveT); $('#saved').textContent='Saving…'; saveT=setTimeout(persist,600); }
async function persist(){
  const data=JSON.stringify(S);
  try{ const db=await idb(); await new Promise((res,rej)=>{const t=db.transaction('kv','readwrite'); t.objectStore('kv').put(data,'state'); t.oncomplete=res; t.onerror=()=>rej(t.error);}); $('#saved').textContent='Saved ✓'; return; }catch(e){}
  try{ localStorage.setItem(STORE,data); $('#saved').textContent='Saved ✓'; }catch(e){ $('#saved').textContent='Not saved! Take a screenshot'; }
}

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const el = (tag, cls, html) => { const e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; };
const snap = v => Math.round(v/SNAP)*SNAP;
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const scaleOf = sheetEl => sheetEl.getBoundingClientRect().width / W;
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- build ---------- */
const main = $('#main');
const frames = [];
function build(){
  main.innerHTML='';
  frames.length=0;
  SHEETS.forEach((sh,i)=>{
    const tools=el('div','sheettools');
    tools.innerHTML=`<span class="nm">Page ${i+1} · ${esc(sh.title)}</span>`;
    const addT=el('button',null,'+ Text box'), addD=el('button',null,'+ Sketch / photo');
    addT.onclick=()=>addBox(sh,'text'); addD.onclick=()=>addBox(sh,'draw');
    const savP=el('button',null,'📸 Screenshot page'); savP.onclick=()=>exportPDF([i]);
    tools.append(addT,addD,savP);
    tools.id='s-'+sh.id;
    const frame=el('div','frame');
    const sheet=el('div','sheet');
    sheet.dataset.id=sh.id;
    const side=el('div','side');
    side.innerHTML=`<div class="num">${esc(sh.tag)}</div><h2>${esc(sh.title)}</h2><div class="hints">${sh.hints.map(h=>`<div class="hint"><span class="h">${h[0]}</span>${typeof h[1]==='string'?h[1]:`<div class="only60">${h[1][60]}</div><div class="only80">${h[1][80]}</div>`}</div>`).join('')}</div>`;
    const head=el('div','head',`<span class="chip">${esc(sh.chip||sh.tag)}</span>${esc(sh.title)}`);
    const foot=el('div','foot',`My Upcycled Tin Can Lamp · <span class="hname"></span> · page ${i+1}`);
    sheet.append(side, head, foot);
    frame.append(sheet);
    main.append(tools, frame);
    frames.push({frame, sheet, tools});
    sh.boxes.forEach(def=>makeBox(sh, def, sheet));
    (S.added[sh.id]||[]).forEach(def=>makeBox(sh, def, sheet));
    const o=el('option',null,`${i+1}. ${sh.title}`); o.value=sh.id; $('#jump').append(o);
  });
  updateNames();
  fit();
}
function fit(){
  const avail=Math.min(document.documentElement.clientWidth-24, W);
  const sc=avail/W;
  frames.forEach(f=>{ f.frame.style.width=avail+'px'; f.frame.style.height=(H*sc)+'px'; f.sheet.style.transform=`scale(${sc})`; f.tools.style.maxWidth=avail+'px'; });
}
window.addEventListener('resize', fit);
function setEra(e){ S.era=e; document.body.className='e'+(e||'60'); save(); const y=window.scrollY; $('#jump').innerHTML=''; build(); window.scrollTo(0,y); }
function updateNames(){ document.querySelectorAll('.hname').forEach(n=>n.textContent=S.name||''); }

function addBox(sh, type){
  const list=S.added[sh.id]||(S.added[sh.id]=[]);
  const k=list.length%6;
  const def={id:'a'+Date.now().toString(36), type, label: type==='text'?'Notes':'Sketch or photo', x:X0+40+k*30, y:130+k*30, w:420, h:280, added:true};
  list.push(def);
  const f=frames[SHEETS.indexOf(sh)];
  const b=makeBox(sh, def, f.sheet);
  save();
  b.scrollIntoView({behavior:'smooth', block:'center'});
}

let activeBox=null;
function setActive(b){ if(activeBox && activeBox!==b){ activeBox.classList.remove('active'); } activeBox=b; if(b) b.classList.add('active'); }

function makeBox(sh, def, sheetEl){
  const key=sh.id+'.'+def.id;
  const st=S.boxes[key]||(S.boxes[key]={});
  const g={x:st.x??def.x, y:st.y??def.y, w:st.w??def.w, h:st.h??def.h};
  const box=el('div','box '+def.type);
  box.dataset.k=key;
  const apply=()=>{ box.style.left=g.x+'px'; box.style.top=g.y+'px'; box.style.width=g.w+'px'; box.style.height=g.h+'px'; };
  apply();
  const lab=el('div','lab');
  const fixed = def.type==='info' || def.type==='era';
  const grip=el('span','grip noprint','⠿');
  const t=el('span','t'); t.textContent=st.label||def.label;
  if(def.added){ t.contentEditable='true'; t.oninput=()=>{ st.label=t.textContent; save(); }; }
  const tools=el('span','tools noprint');
  if(!fixed) lab.append(grip);
  lab.append(t, tools);
  const bd=el('div','bd');
  box.append(lab, bd);
  const warn=el('div','warn noprint','Text hidden: make the box bigger');
  box.append(warn);
  if(!fixed){ const rz=el('div','rz noprint'); box.append(rz); dragger(rz, sheetEl, (dx,dy,o)=>{ g.w=clamp(snap(o.w+dx),160,X1-g.x); g.h=clamp(snap(o.h+dy),90,Y1-g.y); apply(); onResize(); }, ()=>({w:g.w,h:g.h}), ()=>{ Object.assign(st,{w:g.w,h:g.h}); save(); }); }
  if(!fixed) dragger(grip, sheetEl, (dx,dy,o)=>{ g.x=clamp(snap(o.x+dx),X0-20,X1-g.w); g.y=clamp(snap(o.y+dy),Y0,Y1-g.h); apply(); }, ()=>({x:g.x,y:g.y}), ()=>{ Object.assign(st,{x:g.x,y:g.y}); save(); });
  if(def.added){ const del=el('button','tool','✕'); del.title='Delete box'; del.onclick=()=>{ if(!confirm('Delete this box and everything in it?')) return; S.added[sh.id]=S.added[sh.id].filter(d=>d.id!==def.id); delete S.boxes[key]; box.remove(); save(); }; tools.append(del); }

  let onResize=()=>{};
  const grow=(scrollEl)=>{
    const over=()=>scrollEl.scrollHeight>scrollEl.clientHeight+2;
    if(over()){ const need=scrollEl.scrollHeight-scrollEl.clientHeight+6; const nh=Math.min(snap(g.h+need+SNAP/2), Y1-g.y); if(nh>g.h){ g.h=nh; apply(); st.h=g.h; } }
    box.classList.toggle('over', over());
  };

  if(def.type==='info'){ bd.innerHTML=def.html; }
  else if(def.type==='era'){
    const b6=el('div','erabtn b60','<span class="big">60s</span>The Swinging Sixties<small>Space Age, flower power, pop and op art</small>');
    const b8=el('div','erabtn b80','<span class="big">80s</span>THE EIGHTIES<small>Neon, arcades, Memphis design</small>');
    const mark=()=>{ b6.classList.toggle('on',S.era==='60'); b8.classList.toggle('on',S.era==='80'); };
    b6.onclick=()=>{ setEra('60'); mark(); }; b8.onclick=()=>{ setEra('80'); mark(); };
    bd.append(b6,b8); mark();
  }
  else if(def.type==='name'){
    const inp=el('input','nm'); inp.type='text'; inp.placeholder='First name and surname'; inp.value=S.name||'';
    inp.oninput=()=>{ S.name=inp.value; updateNames(); save(); };
    bd.append(inp);
  }
  else if(def.type==='text'){
    const ta=el('textarea'); ta.dataset.k=key; ta.value=st.text||''; if(def.ph) ta.placeholder=def.ph;
    ta.oninput=()=>{ st.text=ta.value; grow(ta); save(); };
    bd.append(ta);
    onResize=()=>box.classList.toggle('over', ta.scrollHeight>ta.clientHeight+2);
    requestAnimationFrame(()=>grow(ta));
  }
  else if(def.type==='table'){
    if(!st.rows) st.rows=def.rows.map(r=>[r, ...Array(def.cols.length-1).fill('')]);
    const tb=el('table','tb');
    const render=()=>{
      tb.innerHTML=`<colgroup>${def.widths.map(w=>`<col style="width:${w}%">`).join('')}</colgroup><tr>${def.cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr>`;
      st.rows.forEach((row,r)=>{ const tr=el('tr'); row.forEach((v,c)=>{ const td=el('td'); const d=el('div'); d.contentEditable='true'; d.textContent=v; d.oninput=()=>{ st.rows[r][c]=d.innerText; grow(bd); save(); }; td.append(d); tr.append(td); }); tb.append(tr); });
    };
    render(); bd.append(tb);
    const add=el('button','tool','+ row'), rem=el('button','tool','− row');
    add.onclick=()=>{ st.rows.push(Array(def.cols.length).fill('')); render(); grow(bd); save(); };
    rem.onclick=()=>{ if(st.rows.length<=1) return; const last=st.rows[st.rows.length-1]; if(last.some(v=>v.trim()) && !confirm('Remove the last row and its text?')) return; st.rows.pop(); render(); box.classList.toggle('over', bd.scrollHeight>bd.clientHeight+2); save(); };
    tools.append(add, rem);
    onResize=()=>box.classList.toggle('over', bd.scrollHeight>bd.clientHeight+2);
    requestAnimationFrame(()=>grow(bd));
  }
  else if(def.type==='draw'){
    st.strokes=st.strokes||[]; st.photos=st.photos||[]; st.hist=st.hist||[];
    const ph=el('div','photos'); const cv=el('canvas','ink'); const empty=el('div','empty noprint','Tap ✏️ to draw or 📷 to add a photo');
    bd.append(ph, cv, empty);
    const ctx=cv.getContext('2d');
    const inner=()=>({w:g.w-3, h:g.h-LAB-3});
    const drawStroke=(s, from)=>{
      const p=s.p; if(!p.length) return;
      ctx.save(); ctx.scale(RES,RES);
      ctx.globalCompositeOperation=s.e?'destination-out':'source-over';
      ctx.strokeStyle=s.c; ctx.fillStyle=s.c; ctx.lineWidth=s.w; ctx.lineCap='round'; ctx.lineJoin='round';
      const i0=Math.max(0,(from??0)-1);
      if(p.length===1){ ctx.beginPath(); ctx.arc(p[0][0],p[0][1],s.w/2,0,7); ctx.fill(); }
      else { ctx.beginPath(); ctx.moveTo(p[i0][0],p[i0][1]); for(let i=i0+1;i<p.length;i++) ctx.lineTo(p[i][0],p[i][1]); ctx.stroke(); }
      ctx.restore();
    };
    const redraw=()=>{ const d=inner(); cv.width=Math.round(d.w*RES); cv.height=Math.round(d.h*RES); ctx.clearRect(0,0,cv.width,cv.height); st.strokes.forEach(s=>drawStroke(s)); };
    const layoutPhotos=()=>{
      ph.innerHTML=''; const n=st.photos.length; const d=inner();
      empty.style.display=(n||st.strokes.length)?'none':'flex';
      if(!n) return;
      const cols=Math.ceil(Math.sqrt(n*(d.w/d.h))), rows=Math.ceil(n/cols); const gap=def.fill?6:4;
      const cw=(d.w-gap*(cols+1))/cols, chh=(d.h-gap*(rows+1))/rows;
      st.photos.forEach((p,i)=>{ const c=i%cols, r=Math.floor(i/cols); const sc=Math.min(cw/p.w, chh/p.h); const iw=p.w*sc, ih=p.h*sc;
        const im=new Image(); im.src=p.src;
        if(def.fill){ const fs=Math.max(cw/p.w, chh/p.h), fw=p.w*fs, fh=p.h*fs; const cell=document.createElement('div'); cell.style.cssText=`position:absolute;overflow:hidden;border-radius:6px;left:${gap+c*(cw+gap)}px;top:${gap+r*(chh+gap)}px;width:${cw}px;height:${chh}px`; im.style.width=fw+'px'; im.style.height=fh+'px'; im.style.left=((cw-fw)/2)+'px'; im.style.top=((chh-fh)/2)+'px'; cell.append(im); ph.append(cell); return; }
        im.style.width=iw+'px'; im.style.height=ih+'px'; im.style.left=(gap+c*(cw+gap)+(cw-iw)/2)+'px'; im.style.top=(gap+r*(chh+gap)+(chh-ih)/2)+'px'; ph.append(im); });
    };
    onResize=()=>{ redraw(); layoutPhotos(); };
    let col=sws0(), eraser=false, penSeen=false, cur=null;
    const pen=el('button','tool not-active','✏️'); pen.title='Draw';
    const done=el('button','tool only-active on','Done');
    const sws=(document.body.classList.contains('e80')?[['#ffffff','White'],['#5ef3ff','Cyan'],['#ff2fb3','Pink']]:[['#3d2a1a','Pencil'],['#2a8c82','Teal'],['#e8742c','Orange']]).map(([c,n])=>{ const b=el('button','sw only-active'+(c===col?' on':'')); b.style.background=c; b.dataset.c=c; b.title=n; b.onclick=()=>{ col=c; eraser=false; er.classList.remove('on'); sws.forEach(x=>x.classList.toggle('on',x===b)); }; return b; });
    const er=el('button','tool only-active','Rubber');
    er.onclick=()=>{ eraser=!eraser; er.classList.toggle('on',eraser); sws.forEach(x=>x.classList.toggle('on',!eraser&&x.dataset.c===col)); };
    const undo=el('button','tool','↶'); undo.title='Undo';
    const cam=el('button','tool','📷'); cam.title='Add photo';
    const clr=el('button','tool','🗑'); clr.title='Clear box';
    const file=el('input'); file.type='file'; file.accept='image/*'; file.multiple=true; file.style.display='none';
    tools.prepend(pen, ...sws, er, done, undo, cam, clr); box.append(file);
    pen.onclick=()=>setActive(box);
    done.onclick=()=>setActive(null);
    undo.onclick=()=>{ const h=st.hist.pop(); if(h==='s') st.strokes.pop(); else if(h==='p') st.photos.pop(); else return; redraw(); layoutPhotos(); save(); };
    clr.onclick=()=>{ if(!st.strokes.length&&!st.photos.length) return; if(!confirm('Clear all drawing and photos in this box?')) return; st.strokes=[]; st.photos=[]; st.hist=[]; redraw(); layoutPhotos(); save(); };
    cam.onclick=()=>file.click();
    file.onchange=async()=>{ for(const f of file.files){ try{ const p=await shrink(f); st.photos.push(p); st.hist.push('p'); }catch(e){ alert('Sorry, that photo could not be added.'); } } file.value=''; layoutPhotos(); save(); };
    const pt=e=>{ const r=cv.getBoundingClientRect(); const sc=r.width/inner().w; return [Math.round((e.clientX-r.left)/sc*10)/10, Math.round((e.clientY-r.top)/sc*10)/10]; };
    cv.addEventListener('pointerdown',e=>{
      if(activeBox!==box) return;
      if(e.pointerType==='pen') penSeen=true;
      if(e.pointerType==='touch' && penSeen) return;
      e.preventDefault(); cv.setPointerCapture(e.pointerId);
      cur={c:col, w:eraser?22:(e.pointerType==='pen'?2.6:3.2), e:eraser, p:[pt(e)]};
      st.strokes.push(cur); st.hist.push('s'); drawStroke(cur); empty.style.display='none';
    });
    cv.addEventListener('pointermove',e=>{ if(!cur) return; e.preventDefault(); const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e]; const n=cur.p.length; evs.forEach(ev=>cur.p.push(pt(ev))); drawStroke(cur, n); });
    const end=()=>{ if(cur){ cur=null; save(); } };
    cv.addEventListener('pointerup',end); cv.addEventListener('pointercancel',end);
    requestAnimationFrame(()=>{ redraw(); layoutPhotos(); });
  }
  sheetEl.append(box);
  return box;
}

function sws0(){ return document.body.classList.contains('e80')?'#ffffff':'#3d2a1a'; }
function dragger(handle, sheetEl, move, origin, done){
  handle.addEventListener('pointerdown',e=>{
    e.preventDefault(); e.stopPropagation();
    const sc=scaleOf(sheetEl), sx=e.clientX, sy=e.clientY, o=origin();
    handle.setPointerCapture(e.pointerId);
    const mv=ev=>move((ev.clientX-sx)/sc,(ev.clientY-sy)/sc,o);
    const up=()=>{ handle.removeEventListener('pointermove',mv); handle.removeEventListener('pointerup',up); handle.removeEventListener('pointercancel',up); done(); };
    handle.addEventListener('pointermove',mv); handle.addEventListener('pointerup',up); handle.addEventListener('pointercancel',up);
  });
}

function shrink(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file); const im=new Image();
    im.onload=()=>{ const max=1600; const sc=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight)); const w=Math.round(im.naturalWidth*sc), h=Math.round(im.naturalHeight*sc);
      const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(im,0,0,w,h); URL.revokeObjectURL(url);
      res({src:c.toDataURL('image/jpeg',0.82), w, h}); };
    im.onerror=()=>{ URL.revokeObjectURL(url); rej(); };
    im.src=url;
  });
}

/* ---------- screenshots (one JPEG per page) ---------- */
async function exportPDF(only){
  setActive(null);
  const ov=$('#overlay'), msg=$('#ovmsg'); ov.style.display='flex';
  const withHints=$('#hintsPdf').checked;
  try{
    const nm=((S.name||'My').trim().replace(/[^\w\- ]+/g,'')||'My');
    const list=only||frames.map((_,k)=>k); const files=[];
    for(const i of list){
      msg.textContent=`Taking your screenshot… page ${i+1}`;
      await new Promise(r=>setTimeout(r,30));
      const sh=frames[i].sheet; const prev=sh.style.transform; sh.style.transform='none';
      let cv;
      try{
        cv=await html2canvas(sh,{scale:1.25, backgroundColor:null, logging:false, width:W, height:H, windowWidth:W+100, windowHeight:H+100, scrollX:0, scrollY:0,
          onclone:(doc,c)=>{
            c.style.transform='none';
            let p=c.parentElement; while(p&&p!==doc.body){ p.style.overflow='visible'; p=p.parentElement; }
            if(!withHints) c.classList.add('pdf-nohints');
            c.querySelectorAll('.noprint').forEach(n=>n.style.display='none');
            c.querySelectorAll('.box.active').forEach(b=>b.classList.remove('active'));
            c.querySelectorAll('textarea').forEach(ta=>{ const o=document.querySelector(`textarea[data-k="${ta.dataset.k}"]`); const d=doc.createElement('div'); d.className='tacopy'; d.textContent=o?o.value:''; ta.replaceWith(d); });
            c.querySelectorAll('input.nm').forEach(inp=>{ const d=doc.createElement('div'); d.className='tacopy'; d.style.fontSize='26px'; d.style.fontWeight='600'; d.style.padding='4px 14px'; d.textContent=S.name||''; inp.replaceWith(d); });
          }});
      } finally { sh.style.transform=prev; }
      const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.9));
      files.push(new File([blob], `${nm} - Tin Can Lamp - page ${i+1}.jpg`, {type:'image/jpeg'}));
    }
    const touch=navigator.maxTouchPoints>1;
    let shared=false;
    if(touch && navigator.canShare && navigator.canShare({files})){
      try{ ov.style.display='none'; await navigator.share({files, title:'Tin Can Lamp'}); shared=true; }
      catch(e){ if(e && e.name==='AbortError') shared=true; }
    }
    if(!shared){
      for(const f of files){ const a=document.createElement('a'); a.href=URL.createObjectURL(f); a.download=f.name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000); await new Promise(r=>setTimeout(r,350)); }
    }
  }catch(e){ alert('Sorry, the screenshot could not be made: '+e.message); console.error(e); }
  finally{ ov.style.display='none'; fit(); }
}
