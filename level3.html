/* Shared helpers for the Woods & Timbers workbook */
window.G=(function(){

function hash(s){let h=2166136261;for(const c of s)h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0;}

/* Drag an element and drop it on anything matching opts.targets. onDrop(el,target,x,y) returns false to send it back. */
function drag(el,opts){
  el.style.touchAction='none';
  el.addEventListener('pointerdown',e=>{
    if(el.dataset.locked==='1'||e.button>0)return;e.preventDefault();
    const r=el.getBoundingClientRect(),ox=e.clientX-r.left,oy=e.clientY-r.top,sx=e.clientX,sy=e.clientY;
    let moved=false,ph=null;
    const start=()=>{moved=true;ph=el.cloneNode(true);ph.classList.add('ph');el.parentNode.insertBefore(ph,el);
      el.style.width=r.width+'px';el.style.height=r.height+'px';el.style.left=r.left+'px';el.style.top=r.top+'px';el.classList.add('dragging');opts.onStart&&opts.onStart(el);};
    const mv=ev=>{if(!moved){if(Math.hypot(ev.clientX-sx,ev.clientY-sy)<6)return;start();}
      el.style.left=(ev.clientX-ox)+'px';el.style.top=(ev.clientY-oy)+'px';
      const t=document.elementFromPoint(ev.clientX,ev.clientY);$$(opts.targets).forEach(x=>x.classList.toggle('over',!!t&&x.contains(t)));};
    const up=ev=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);
      $$(opts.targets).forEach(x=>x.classList.remove('over'));
      if(!moved){opts.onTap&&opts.onTap(el);return;}
      const t=document.elementFromPoint(ev.clientX,ev.clientY);const target=t&&t.closest(opts.targets);
      el.classList.remove('dragging');['width','height','left','top'].forEach(p=>el.style[p]='');
      ph.parentNode.insertBefore(el,ph);ph.remove();
      if(target){const ok=opts.onDrop(el,target,ev.clientX,ev.clientY);if(ok===false){el.classList.add('shake');setTimeout(()=>el.classList.remove('shake'),400);}}
      else if(opts.onMiss)opts.onMiss(el);};
    addEventListener('pointermove',mv);addEventListener('pointerup',up);addEventListener('pointercancel',up);
  });
}
/* Procedural wood swatch */
function swatch(canvas,spec,seed){
  const ctx=canvas.getContext('2d'),w=canvas.width,h=canvas.height,r=mulberry32(seed||hash(spec.base+spec.dark));
  ctx.fillStyle=spec.base;ctx.fillRect(0,0,w,h);
  const lines=spec.fine?70:spec.bold?26:44;
  for(let i=0;i<lines;i++){const y0=r()*h,amp=(spec.wavy?10:3)+r()*4,fq=0.006+r()*0.01,ph=r()*6;
    ctx.strokeStyle=spec.dark;ctx.globalAlpha=(spec.bold?0.35:0.18)+r()*0.2;ctx.lineWidth=(spec.bold?2.5:1)+r()*(spec.fine?0.6:2);
    ctx.beginPath();for(let x=0;x<=w;x+=6){const y=y0+Math.sin(x*fq+ph)*amp+Math.sin(x*0.03+ph*2)*1.2;x?ctx.lineTo(x,y):ctx.moveTo(x,y);}ctx.stroke();}
  if(spec.rays){for(let i=0;i<60;i++){ctx.globalAlpha=0.25;ctx.fillStyle=spec.ray||'#f3dfb8';ctx.fillRect(r()*w,r()*h,6+r()*14,1.5+r()*1.5);}}
  if(spec.flecks){for(let i=0;i<180;i++){ctx.globalAlpha=0.3;ctx.fillStyle=spec.dark;ctx.fillRect(r()*w,r()*h,1.5,2.5);}}
  if(spec.knots){const n=spec.knots;for(let k=0;k<n;k++){const cx=w*(0.2+0.6*r()),cy=h*(0.2+0.6*r()),rx=8+r()*10;
    for(let j=6;j>=0;j--){ctx.globalAlpha=j?0.22:0.85;ctx.strokeStyle=spec.dark;ctx.fillStyle=spec.knot||'#7a4a22';ctx.beginPath();ctx.ellipse(cx,cy,rx+j*5,(rx+j*5)*0.6,0,0,Math.PI*2);j?ctx.stroke():ctx.fill();}}}
  ctx.globalAlpha=1;
  const g=ctx.createLinearGradient(0,0,w,h);g.addColorStop(0,'rgba(255,255,255,0.12)');g.addColorStop(1,'rgba(0,0,0,0.1)');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
}

/* ---------- tweens / camera ---------- */
const tweens=[];const ease=p=>p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
function tween(dur,fn,done){tweens.push({t0:performance.now(),dur,fn,done});}
const camTgt=new THREE.Vector3();
function moveCam(pos,tgt,dur,done){const p0=camera.position.clone(),t0=camTgt.clone();tween(dur||1200,p=>{camera.position.lerpVectors(p0,pos,p);camTgt.lerpVectors(t0,tgt,p);},done);}
function fitK(){return Math.max(1,0.95/(innerWidth/innerHeight));}
camera.position.set(3.4,2.2,6.2);camTgt.set(0,0,0.4);

/* ---------- sawing ---------- */
let saw=null; // {axis:'h'|'v', at, p, onDone}
let rubbing=false,lastP=null,rubV=0;
canvas.addEventListener('pointerdown',e=>{rubbing=true;lastP=[e.clientX,e.clientY];});
addEventListener('pointerup',()=>{rubbing=false;lastP=null;});addEventListener('pointercancel',()=>{rubbing=false;lastP=null;});
canvas.addEventListener('pointermove',e=>{if(!rubbing||!lastP)return;const d=Math.abs(e.clientX-lastP[0])+Math.abs(e.clientY-lastP[1]);lastP=[e.clientX,e.clientY];
  if(saw&&!saw.done){saw.p=Math.min(1,saw.p+d/1100);rubV=Math.min(40,rubV+d*0.15);}});
function startCut(axis,at,onDone){saw={axis,at,p:0,onDone,done:false};blade.visible=true;kerf.visible=true;
  blade.rotation.set(0,0,0);if(axis==='h'){blade.rotation.x=-Math.PI/2;}else{blade.rotation.y=Math.PI/2;}
  placeBlade();}
function placeBlade(){const front=Math.min(R,-2.9+BR+saw.p*(R-(-2.9+BR)));const cen=front-BR;
  if(saw.axis==='h'){blade.position.set(cen,saw.at,L/2-0.3);const w=Math.max(0.001,front+R);kerf.scale.set(w,0.03,1);kerf.position.set(-R+w/2,saw.at,L/2+0.012);}
  else{blade.position.set(saw.at,-cen,L/2-0.3);const w=Math.max(0.001,front+R);kerf.scale.set(0.03,w,1);kerf.position.set(saw.at,R-w/2,L/2+0.012);}
  return front;}
function finishCut(){saw.done=true;kerf.visible=false;const s=saw;const st=blade.position.clone();
  tween(500,p=>{if(s.axis==='h')blade.position.x=st.x-p*2.5;else blade.position.y=st.y+p*2.5;},()=>{blade.visible=false;s.onDone();});}

/* ---------- STEP A: through and through ---------- */
let cutsDone=[];
function cutPanel(title,body,i,n){panel.innerHTML=`<h2>${title}</h2><p>${body}</p><div class="cutlbl"><span>Cut ${i} of ${n}</span><span><span class="rub">👆</span> Rub back and forth to saw</span></div><div class="bar"><i id="pb"></i></div>`;}
function stepA(){G.setStep(0);plainG.visible=true;
  const k=fitK();moveCam(new THREE.Vector3(2.6*k,1.7*k,4.6*k),new THREE.Vector3(0,0,0.7),1500);
  G.prompt('🪚 Saw the log into boards');setTimeout(()=>G.prompt(''),2400);nextPlainCut();}
function plainOffsets(){const n=cutsDone.length;plainBoards.forEach(m=>{const j=m.userData.band;const above=cutsDone.filter(i=>i>=j).length;m.userData.ty=0.09*above-0.045*n;});
  const from=plainBoards.map(m=>m.position.y);tween(450,p=>plainBoards.forEach((m,i)=>m.position.y=from[i]+(m.userData.ty-from[i])*ease(p)));}
function nextPlainCut(){const i=cutsDone.length;if(i>=BANDS-1){return plainDone();}
  cutPanel('Through-and-through','Also called <b>plain sawn</b>. The log is sawn into parallel boards, straight through from one side to the other.',i+1,BANDS-1);
  const at=1-(i+1)*TH+(plainBoards[i].userData.ty||0);startCut('h',at,()=>{cutsDone.push(i);plainOffsets();setTimeout(nextPlainCut,500);});}
function plainDone(){G.toast('All boards cut! 🪵','good');
  panel.innerHTML=`<span class="tag">✓ Plain sawn</span><h2>Quick, cheap and little waste</h2><p>Through-and-through is the <b>fastest and cheapest</b> way to convert a log, and very little is wasted. In this model about <b>${plainWaste}%</b> of the wood is lost when the boards are trimmed square. Look at the boards’ ends, though. Most have growth rings running <b>across their width</b>. Remember that for later…</p><button class="cta" id="nx">Next: quarter sawing →</button>`;
  $('#nx').onclick=stepB;}

/* ---------- STEP B: quarter sawn ---------- */
let qCuts=0;
function qOffsets(){quarterG.children.forEach(m=>{const q=m.userData.q;const sx=(q===0||q===3)?1:-1,sy=(q<2)?1:-1;m.userData.tx=(qCuts>=1?0.06*sx:0);m.userData.ty=(qCuts>=2?0.06*sy:0);});
  const f=quarterG.children.map(m=>[m.position.x,m.position.y]);tween(450,p=>quarterG.children.forEach((m,i)=>{m.position.x=f[i][0]+(m.userData.tx-f[i][0])*ease(p);m.position.y=f[i][1]+(m.userData.ty-f[i][1])*ease(p);}));}
function stepB(){G.setStep(1);
  tween(700,p=>{plainG.position.x=-p*6;},()=>{plainG.visible=false;});
  quarterG.visible=true;quarterG.position.x=6;tween(900,p=>quarterG.position.x=6*(1-ease(p)),()=>{nextQ();});
  panel.innerHTML=`<h2>Quarter sawn</h2><p>Here comes a fresh log…</p>`;}
function nextQ(){if(qCuts>=2)return millQuarter();
  cutPanel('Quarter sawn','First, saw the log into <b>four quarters</b>. Then the boards are cut <b>radially</b>, from the outside towards the centre, like spokes of a wheel.',qCuts+1,2);
  if(qCuts===0)startCut('v',0,()=>{qCuts=1;qOffsets();setTimeout(nextQ,500);});
  else startCut('h',0,()=>{qCuts=2;qOffsets();setTimeout(nextQ,500);});}
function millQuarter(){
  panel.innerHTML=`<h2>The mill cuts each quarter…</h2><p>Each quarter is turned and re-cut so every board is sawn along a radius. Watch the offcuts fall away.</p>`;
  G.prompt('⚙️ Cutting radial boards');
  qWaste.forEach(w=>{const f=w.position.clone(),q=w.userData.q;const sx=(q===0||q===3)?1:-1,sy=(q<2)?1:-1;
    tween(1600,p=>{w.position.set(f.x+sx*0.5*p,f.y-p*p*2.2+sy*0.3*p,f.z+p*0.6);w.rotation.z=p*0.5*sx;},()=>{w.visible=false;});});
  tween(1600,p=>wasteMats.forEach(m=>m.opacity=1-p*0.95));
  qBoards.forEach(b=>{const f=b.position.clone(),d=[Math.cos(b.userData.t),Math.sin(b.userData.t)];tween(1400,p=>{b.position.x=f.x+d[0]*0.28*ease(p);b.position.y=f.y+d[1]*0.28*ease(p);});});
  setTimeout(()=>{G.prompt('');panel.innerHTML=`<span class="tag">✓ Quarter sawn</span><h2>Quick question</h2><p>Which method <b>wasted more wood</b>?</p><div class="qbtns"><button class="ghost" data-a="plain">🪵 Through-and-through</button><button class="ghost" data-a="quarter">✳️ Quarter sawn</button></div>`;
    $$('[data-a]').forEach(b=>b.onclick=()=>{const ok=b.dataset.a==='quarter';if(ok)G.addScore(1);G.toast(ok?'✓ Correct! +1':'It was quarter sawing',ok?'good':'bad');
      panel.innerHTML=`<span class="tag ${ok?'':'bad'}">${ok?'✓ Correct':'✗ Not quite'}</span><h2>Quarter sawing wastes more</h2><p>In this model about <b>${quarterWaste}%</b> of the wood is lost (through-and-through lost about ${plainWaste}%). The extra cutting and waste make quarter-sawn timber <b>more expensive</b>, so why bother? Let’s find out.</p><button class="cta" id="nx">Next: fast-forward 2 years ⏩</button>`;
      $('#nx').onclick=stepC;});},1800);}

/* ---------- STEP C: time-lapse ---------- */
let flatAsked=false;
function stepC(){G.setStep(2);plainG.visible=true;
  tween(1200,p=>{const e=ease(p);plainG.position.set(-1.9*e+(-6)*(1-e),0,0);plainG.scale.set(1-0.25*e,1-0.25*e,1-0.75*e);quarterG.position.set(1.9*e,0,0);quarterG.scale.set(1-0.25*e,1-0.25*e,1-0.75*e);});
  const k=fitK();moveCam(new THREE.Vector3(0,0.9*k,6.6*k),new THREE.Vector3(0,-0.1,0),1400);
  panel.innerHTML=`<h2>Two years later…</h2><p>Freshly sawn boards keep drying out and <b>shrinking</b>. Wood shrinks about <b>twice as much along the growth rings</b> as across them. Press fast-forward to see what that does to each board.</p><button class="cta alt" id="ff">⏩ Fast-forward 2 years</button>`;
  $('#ff').onclick=()=>{$('#ff').disabled=true;timeLapse();};}
function deform(m,p,amt){const pos=m.geometry.attributes.position,a=pos.array,p0=m.userData.p0;
  for(let i=0;i<a.length;i+=3){const x=p0[i],y=p0[i+1];a[i]=x*(1-0.03*p);a[i+1]=y+amt(x,y)*p;a[i+2]=p0[i+2];}pos.needsUpdate=true;m.geometry.computeVertexNormals();}
function timeLapse(){
  tween(2600,p=>{G.prompt(`⏩ Year <em>${(p*2).toFixed(1)}</em>`);
    plainBoards.forEach(m=>{const yc=m.userData.yc,hw=Math.max(0.2,m.userData.hw),s=Math.sign(Math.round(yc*100)/100);const k=0.34*Math.min(1,Math.abs(yc)/0.6);deform(m,p,(x)=>s*k*(x/hw)*(x/hw));});
    qBoards.forEach(m=>deform(m,p,()=>0));},()=>{
    G.prompt('👆 Tap the boards that stayed <em>flattest</em>');flatAsked=true;
    panel.innerHTML=`<h2>What happened?</h2><p>Look closely at both sets of boards. Then <b>tap the set that stayed flattest</b>.</p>`;});}
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();let downAt=null;
canvas.addEventListener('pointerdown',e=>{downAt=[e.clientX,e.clientY,performance.now()];});
canvas.addEventListener('pointerup',e=>{if(!downAt||!flatAsked)return;if(Math.hypot(e.clientX-downAt[0],e.clientY-downAt[1])>12)return;
  const r=canvas.getBoundingClientRect();ndc.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1);ray.setFromCamera(ndc,camera);
  const hit=ray.intersectObjects([...plainBoards,...qBoards],false)[0];if(!hit)return;flatAsked=false;const ok=qBoards.includes(hit.object);
  if(ok)G.addScore(1);G.toast(ok?'✓ Yes! The quarter-sawn boards +1':'Look again: the plain-sawn boards curled up',ok?'good':'bad',1800);G.prompt('');
  panel.innerHTML=`<span class="tag ${ok?'':'bad'}">${ok?'✓ Correct':'✗ Not quite'}: quarter sawn stayed flat</span><h2>Why?</h2><p>Plain-sawn boards have rings running <b>across their width</b>. They shrink more along the rings, so they <b>cup</b> (curl away from the heart). Quarter-sawn boards have rings running <b>through their thickness</b>, so they stay <b>stable</b>. That is why they are used for quality furniture and flooring, and why oak shows off its beautiful <b>ray figure</b>.</p><button class="cta" id="nx">Next: sort the facts →</button>`;
  $('#nx').onclick=stepD;});

/* ---------- STEP D: sort facts ---------- */
const FACTS=[{t:'Quick and cheap to cut',b:'plain'},{t:'Very little waste',b:'plain'},{t:'Boards can cup and warp as they dry',b:'plain'},{t:'Leaves waney (bark) edges on the boards',b:'plain'},
 {t:'More waste, so more expensive',b:'quarter'},{t:'Boards stay stable and resist warping',b:'quarter'},{t:'Shows attractive figure, e.g. rays in oak',b:'quarter'},{t:'Slower: the log must be turned and re-cut',b:'quarter'}];
let placed=0;
function stepD(){G.setStep(3);$('#sorter').classList.add('on');canvas.style.filter='blur(3px) brightness(1.05)';
  const deck=$('.deck');G.shuffle(FACTS.slice()).forEach(f=>{const el=document.createElement('div');el.className='st';el.textContent=f.t;el.dataset.b=f.b;deck.appendChild(el);let tries=0;
    G.drag(el,{targets:'.bin',onDrop:(el,bin)=>{tries++;if(bin.dataset.b===el.dataset.b){el.dataset.locked='1';el.classList.add(tries===1?'ok':'meh');bin.appendChild(el);if(tries===1)G.addScore(1);placed++;
        G.toast(tries===1?'✓ +1':'✓','good',700);if(placed===FACTS.length)setTimeout(()=>{$('#sorter').classList.remove('on');canvas.style.filter='';G.finish(3,MAX,'You can explain the two main ways of converting a log.','level4.html','Next level: Timber sort rush →');},700);return true;}
      G.toast('Not that one!','bad',800);return false;}});});
  panel.innerHTML=`<h2>Sort the facts</h2><p>Drag each statement into the box for the conversion method it describes.</p>`;}

/* ---------- loop ---------- */
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();
let last=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min(0.05,(now-last)/1000);last=now;
  for(let i=tweens.length-1;i>=0;i--){const tw=tweens[i];const p=Math.min(1,(now-tw.t0)/tw.dur);tw.fn(p<1?ease(p):1);if(p>=1){tweens.splice(i,1);tw.done&&tw.done();}}
  if(saw&&!saw.done){const front=placeBlade();bladeDisc.rotation.z-=dt*(2+rubV);rubV*=0.9;const pb=$('#pb');if(pb)pb.style.width=(saw.p*100)+'%';
    if(rubV>3){if(saw.axis==='h')spawnDust(Math.min(front,R),saw.at,L/2,2);else spawnDust(saw.at,R-(front+R),L/2,2);}
    if(saw.p>=1)finishCut();}
  for(let i=0;i<DUST;i++){const v=dustVel[i];if(v[3]<=0)continue;v[1]-=dt*4;dustPos[i*3]+=v[0]*dt;dustPos[i*3+1]+=v[1]*dt;dustPos[i*3+2]+=v[2]*dt;v[3]-=dt*0.7;if(dustPos[i*3+1]<-1.33){dustPos[i*3+1]=-1.33;v[0]=v[1]=v[2]=0;}}
  dustGeo.attributes.position.needsUpdate=true;
  camera.lookAt(camTgt);renderer.render(scene,camera);}
requestAnimationFrame(loop);
panel.innerHTML=`<h2>Converting a log</h2><p><b>Conversion</b> means sawing a log into usable boards. You’ll try the two main methods and compare them. You are the sawyer!</p><button class="cta" id="go">🪚 Start sawing</button>`;
$('#go').onclick=stepA;
})();
</script>
</body>
</html>
