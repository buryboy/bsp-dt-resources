<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Sound Circuit Build Guide</title>
<link rel="stylesheet" href="../../fonts/lexend.css">
<link rel="manifest" href="app.webmanifest">
<link rel="apple-touch-icon" href="../../book-kit/icons/circuit-build-180.png">
<meta name="robots" content="noindex">
<style>
/*
VOICE: calm workshop teacher, short sentences for Year 8.
IDEA: the student's own pad board on the bench, one step at a time.
PICTURE: a drawn 7x9cm board, exact holes lit up; flips over to show the copper side.
COLOUR and TYPE: copper-brown board, solder silver, hot yellow highlight; Atkinson Hyperlegible.
LAYOUT: iPad landscape = board left, step card right; portrait/phone = board on top.
*/
:root{color-scheme:light dark;--bg:light-dark(#eceef0,#101418);--panel:light-dark(#ffffff,#1a2027);--ink:light-dark(#141b22,#e9eef3);--mute:light-dark(#5a6670,#9aa7b2);--line:light-dark(#d5dade,#2b333c);--hi:#ffc21a;--red:#e0262b;--grn:#3fae2a;--btn:light-dark(#141b22,#ffc21a);--btnink:light-dark(#fff,#141b22)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 Lexend,system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
.app{display:grid;grid-template-rows:auto 1fr;height:100dvh}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:19px;margin:0;white-space:nowrap}
.prog{flex:1;display:flex;gap:3px;align-items:center}
.prog i{flex:1;height:8px;border-radius:4px;background:var(--line)}
.prog i.d{background:var(--grn)}.prog i.c{background:var(--hi)}
.ib{min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:transparent;font-weight:700;white-space:nowrap}
main{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(320px,1fr);min-height:0}
.stage{position:relative;padding:12px;display:flex;flex-direction:column;min-height:0}
.flipwrap{flex:1;perspective:1600px;min-height:0;display:flex}
#board{flex:1;width:100%;height:100%;transition:transform .45s ease;transform-style:preserve-3d}
#board.spin{transform:rotateY(90deg)}
.viewbar{display:flex;gap:8px;justify-content:center;padding-top:8px;flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}
.seg button{min-height:46px;padding:0 16px;border:0;background:transparent;font-weight:700}
.seg button.on{background:var(--btn);color:var(--btnink)}
.card{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.cardbody{flex:1;overflow-y:auto;padding:20px 22px}
.kicker{color:var(--mute);font-size:15px;margin:0 0 4px}
.card h2{font-size:30px;line-height:1.1;margin:0 0 14px;text-wrap:balance}
.holes{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.hole{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:#141b22;color:#fff;font-weight:700;font-size:20px}
.hole b{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--hi)}
.hole small{font-weight:400;font-size:14px;opacity:.8}
.tip{border-radius:12px;padding:12px 14px;margin:14px 0;background:light-dark(#fff6d6,#3a3112);border:1px solid light-dark(#f0d675,#6b5a1f)}
.tip strong{display:block}
.why{color:var(--mute);font-size:15px}
.photos{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin:12px 0}
.photos img{width:100%;border-radius:10px;display:block;cursor:zoom-in}
.parts{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;padding:0;margin:8px 0;list-style:none}
.parts button{width:100%;min-height:96px;border:2px solid var(--line);border-radius:12px;background:transparent;padding:8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:15px;line-height:1.2;text-align:center}
.parts button.on{border-color:var(--grn);background:light-dark(#eaf7e6,#16301a)}
.parts svg{width:64px;height:40px}
.chk{list-style:none;padding:0;margin:8px 0}
.chk button{width:100%;text-align:left;display:flex;gap:12px;align-items:flex-start;min-height:48px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:transparent;margin-bottom:8px}
.chk button::before{content:"";flex:none;width:22px;height:22px;border-radius:6px;border:2px solid var(--mute);margin-top:1px}
.chk button.on::before{background:var(--grn);border-color:var(--grn);box-shadow:inset 0 0 0 3px var(--panel)}
.practice{font-size:20px;font-weight:700;padding:12px 14px;border-radius:12px;background:#141b22;color:#fff;margin:10px 0}
.practice.ok{background:#1d6b27}
.nav{display:grid;grid-template-columns:1fr 1.6fr;gap:10px;padding:12px 16px;border-top:1px solid var(--line)}
.nav button{min-height:58px;border-radius:14px;font-weight:700;font-size:19px;border:1px solid var(--line);background:transparent}
.nav .go{background:var(--btn);color:var(--btnink);border:0}
.nav button:disabled{opacity:.35}
button:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
/* drawer */
.drawer{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:10}
.drawer.open{display:block}
.drawer nav{position:absolute;top:0;right:0;bottom:0;width:min(420px,92vw);background:var(--panel);overflow-y:auto;padding:16px}
.drawer h3{margin:16px 0 6px;font-size:15px;color:var(--mute)}
.drawer button.st{display:flex;gap:10px;width:100%;text-align:left;min-height:46px;align-items:center;padding:6px 10px;border:0;border-radius:10px;background:transparent}
.drawer button.st.cur{background:light-dark(#fff1c2,#3a3112)}
.drawer .n{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--line)}
.drawer .done .n{background:var(--grn);color:#fff}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;place-items:center;z-index:11;padding:16px}
.zoom.open{display:grid}.zoom img{max-width:100%;max-height:100%;border-radius:10px}
/* svg */
.pulse{animation:p 1.3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes p{50%{transform:scale(1.35);opacity:.55}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}#board{transition:none}}
.old{opacity:.65}
@media (max-width:900px) and (orientation:portrait),(max-width:700px){
 main{grid-template-columns:1fr;grid-template-rows:minmax(300px,52vh) 1fr}
 .card{border-left:0;border-top:1px solid var(--line)}
 header h1{font-size:16px}
 .card h2{font-size:25px}
}
@media (max-width:520px){.prog{display:none}header{justify-content:space-between}}
</style>
</head>
<body>
<div class="app">
<header>
 <h1>Sound circuit</h1>
 <div class="prog" id="prog" aria-hidden="true"></div>
 <button class="ib" id="menuBtn" aria-label="All steps">All steps</button>
</header>
<main>
 <section class="stage">
  <div class="flipwrap"><svg id="board" viewBox="0 0 1135 600" role="img" aria-label="Circuit board diagram"></svg></div>
  <div class="viewbar">
   <div class="seg" role="group" aria-label="Board side">
    <button id="vTop" class="on">Top (parts side)</button><button id="vUnder">Underneath</button>
   </div>
   <div class="seg"><button id="vAll">Show all steps</button></div>
  </div>
 </section>
 <section class="card">
  <div class="cardbody" id="cardbody"></div>
  <div class="nav"><button id="back">Back</button><button class="go" id="next">Done, next step</button></div>
 </section>
</main>
</div>
<div class="drawer" id="drawer"><nav id="steplist" aria-label="Steps"></nav></div>
<div class="zoom" id="zoom"><img alt="" id="zoomImg"></div>

function card(){

$('next').onclick=()=>{if(!st.done.includes(st.i))st.done.push(st.i);if(st.i<STEPS.length-1)goTo(st.i+1);else{save();card()}};
$('back').onclick=()=>goTo(st.i-1);
$('vTop').onclick=()=>setView('top');$('vUnder').onclick=()=>setView('under');
$('vAll').onclick=()=>{showAll=!showAll;render()};
$('menuBtn').onclick=()=>$('drawer').classList.add('open');
$('drawer').onclick=e=>{const g=e.target.closest('[data-go]');if(g){$('drawer').classList.remove('open');goTo(+g.dataset.go);return}
 if(e.target.id==='drawer'||e.target.id==='closeDr')$('drawer').classList.remove('open')};
$('cardbody').onclick=e=>{const p=e.target.closest('[data-part]'),c=e.target.closest('[data-chk]'),im=e.target.closest('img');
 if(p){const i=+p.dataset.part;st.parts=st.parts.includes(i)?st.parts.filter(x=>x!==i):[...st.parts,i];save();card()}
 if(c){const i=+c.dataset.chk;st.chk=st.chk.includes(i)?st.chk.filter(x=>x!==i):[...st.chk,i];save();card()}
 if(im){$('zoomImg').src=im.src;$('zoom').classList.add('open')}};
$('zoom').onclick=()=>$('zoom').classList.remove('open');
let ft;
$('board').addEventListener('click',e=>{const t=e.target.closest('[data-h]');if(!t)return;const h=t.dataset.h;
 let ok=null;const s=STEPS[st.i];
 if(s.kind==='practice'){practice=practice||{k:0};if(practice.k<PRACT.length){ok=h===PRACT[practice.k];if(ok)practice.k++;card()}}
 flash={h,ok};render();clearTimeout(ft);ft=setTimeout(()=>{flash=null;render()},1600)});
// swipe on card
let sx=null,sy=null;
$('cardbody').addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
$('cardbody').addEventListener('touchend',e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
 if(Math.abs(dx)>80&&Math.abs(dx)>Math.abs(dy)*2){dx<0?$('next').click():goTo(st.i-1)}sx=null},{passive:true});
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')goTo(st.i-1);if(e.key==='Escape'){$('drawer').classList.remove('open');$('zoom').classList.remove('open')}});

card();render();
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}
}
</script>
</body>
</html>
