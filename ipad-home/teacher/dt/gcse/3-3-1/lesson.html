<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Research lesson</title>
<link rel="stylesheet" href="../../../../fonts/lexend.css">
<style>
/* VOICE: clear, calm teaching board, readable from the back row
   IDEA: a finishing workshop's test bench: try a finish, watch what happens
   PICTURE: a live lab test on every section, run after the class predicts
   COLOUR and TYPE: workshop paper white, ink, one colour per material area; Lexend
   LAYOUT: section tabs down the side, finish cards left, lab test right */
:root{color-scheme:light;--bg:#f6f4ef;--card:#fff;--ink:#1b2a33;--mut:#5b6670;--line:#d8d3c7;--ok:#2e8b57;--a:#0f766e}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.45 "Lexend",system-ui,sans-serif;display:grid;grid-template-columns:260px 1fr;overflow:hidden}
nav{background:var(--ink);color:#fff;padding:18px 12px;display:flex;flex-direction:column;gap:6px;overflow:auto}
nav h1{font-size:20px;line-height:1.15;margin:4px 8px 14px;font-weight:700}
nav button{all:unset;cursor:pointer;padding:12px 14px;border-radius:12px;font-size:17px;display:flex;gap:10px;align-items:center;min-height:44px}
nav button:hover{background:#ffffff14}
nav button[aria-current=true]{background:#fff;color:var(--ink);font-weight:700}
nav button:focus-visible{outline:3px solid #ffe14d}
nav .dot{width:14px;height:14px;border-radius:4px;flex:none}
main{overflow:auto;padding:28px 34px}
.head{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap;margin-bottom:6px}
h2{font-size:40px;line-height:1.05;margin:0}
.lead{color:var(--mut);margin:0 0 20px;max-width:70ch;font-size:19px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:28px;align-items:start}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{all:unset;cursor:pointer;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px;min-height:118px;display:flex;flex-direction:column;gap:6px;transition:border-color .2s,transform .2s}
.card:hover{transform:translateY(-2px)}
.card:focus-visible{outline:3px solid var(--a);outline-offset:2px}
.card b{font-size:20px}
.card .hint{color:var(--mut);font-size:14px;margin-top:auto}
.card .back{display:none;font-size:15.5px;line-height:1.4}
.card.open{border-color:var(--c,var(--a))}
.card.open .back{display:block}.card.open .hint{display:none}
.back em{font-style:normal;font-weight:700;color:var(--c,var(--a))}
.lab{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:20px}
.lab h3{margin:0 0 4px;font-size:24px}
.lab .q{font-size:20px;margin:6px 0 12px}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.opt{all:unset;cursor:pointer;border:2px solid var(--line);border-radius:999px;padding:8px 16px;font-size:16px;min-height:28px}
.opt.sel{border-color:var(--ink);background:#1b2a330d;font-weight:700}
.opt.right{border-color:var(--ok);background:#2e8b571a;color:#1d6b40;font-weight:700}
.stage{position:relative;border-radius:14px;background:#efeae0;overflow:hidden}
.stage svg{display:block;width:100%;height:auto}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.go{all:unset;cursor:pointer;background:var(--ink);color:#fff;border-radius:12px;padding:12px 22px;font-weight:700;min-height:20px}
.go.sec{background:transparent;color:var(--ink);border:2px solid var(--line)}
.go:focus-visible,.opt:focus-visible{outline:3px solid var(--a);outline-offset:2px}
.clock{font-size:22px;font-weight:700;margin-left:auto}
input[type=range]{width:220px;accent-color:var(--ink)}
.result{display:none;margin-top:14px;padding:14px 16px;border-radius:12px;background:#2e8b5714;border-left:6px solid var(--ok);font-size:17px}
.result.show{display:block}
.qa{display:grid;gap:10px}
.qa .card{min-height:0}
@media(max-width:1000px){body{grid-template-columns:1fr;overflow:auto}nav{flex-direction:row;flex-wrap:wrap;padding:10px}nav h1{width:100%}.grid{grid-template-columns:1fr}main{overflow:visible;padding:18px}}
@media(prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<nav id="nav"><h1>Investigation and the work of others<br><span style="font-weight:400;font-size:14px;opacity:.75">AQA GCSE D&amp;T 3.3.1 to 3.3.3</span></h1></nav>
<main id="main"></main>
<script>
{

const S=[
{t:'Research methods',c:'#2478B3',lead:'Good design starts with finding out about the user. Primary research you do yourself; secondary research uses what others have found.',
 cards:[['Primary','Interviews, questionnaires, observation, user testing, handling products.'],['Secondary','Books, websites, anthropometric data, reports.'],['Questionnaire','Many people, easy to compare, but answers can be shallow.'],['Observation','Shows what users really do, not what they say they do.']],
 demo:{type:'saydo',title:'Lab test: say vs do',q:'Which method shows what users ACTUALLY do with a product?',opts:['Questionnaire','Observation','Internet search'],right:1,ms:5000,
  res:'People often say one thing and do another. In this illustrative example most people say they read the instructions, but watching them shows few really do. Observation reveals the truth.'}},
{t:'User-centred and inclusive design',c:'#BE3F66',lead:'User-centred design puts the user at the heart of every stage. Inclusive design makes products work for as many people as possible.',
 cards:[['User-centred','Users are involved in research, testing and feedback throughout.'],['Inclusive','Designs for older users, disabled users, children, left-handers…'],['Benefit','Inclusive products often work better for everyone.'],['Example','OXO Good Grips: thick, soft handles first designed for arthritis, now used by everyone.']],
 demo:{type:'ramp',title:'Lab test: steps or a ramp?',q:'A shop entrance changes from steps to a ramp. Who benefits?',opts:['Only wheelchair users','Lots of different users','Nobody'],right:1,ms:6000,
  res:'Wheelchair users, parents with buggies, people with suitcases or trolleys, delivery drivers and older users all benefit. Design for the hardest case and many others gain too.'}},
{t:'Ergonomics and anthropometrics',c:'#2E8B57',lead:'Ergonomics is how well a product fits the human body. Anthropometrics is the body-size data used to do it.',
 cards:[['Percentiles','Designers usually cater for the 5th to 95th percentile: 90% of users.'],['Clearance','Doorways and headroom: design for the TALLEST (95th).'],['Reach','Controls and shelves: design for the SHORTEST reach (5th).'],['Adjustable','Car seats and office chairs adjust to fit a wider range.']],
 demo:{type:'pct',title:'Lab test: designing a doorway',q:'When designing a doorway height, which percentile should you use?',opts:['5th (shortest)','50th (average)','95th (tallest)'],right:2,ms:5000,
  res:'Use the 95th percentile (and add some) so nearly everyone can walk through. If tall people fit, shorter people fit too. For reach, it is the opposite: use the 5th.'}},
{t:'Product analysis and specifications',c:'#C99A06',lead:'Analysing existing products shows what works. A specification turns findings into measurable targets.',
 cards:[['ACCESS FM','Aesthetics, Cost, Customer, Environment, Safety, Size, Function, Materials.'],['Specification','A list of measurable requirements the design must meet.'],['Measurable','Weak: "easy to hold". Strong: "handle 30 mm diameter, soft grip".'],['Testable','Every spec point should be checkable at the end.']],
 demo:{type:'spec',title:'Lab test: make it measurable',q:'Which is a good specification point?',opts:['It should look nice','It must be light','It must weigh less than 500 g'],right:2,ms:5000,
  res:'"Less than 500 g" can be tested with scales. "Light" and "look nice" mean different things to different people, so they cannot be tested.'}},
{t:'The work of others',c:'#7449B0',lead:'Designers learn from past designers and companies. Each has key features that make their style recognisable.',
 cards:[['William Morris','Arts and Crafts. Hand-crafted, patterns from nature.'],['Gerrit Rietveld','De Stijl. Primary colours, straight lines: Red Blue Chair.'],['Marcel Breuer','Bauhaus. Tubular steel; form follows function.'],['Ettore Sottsass','Memphis. Bold colours, clashing patterns, playful.'],['Philippe Starck','Witty, sculptural everyday objects: Juicy Salif.'],['Dyson','Thousands of prototypes: iterative design.']],
 demo:{type:'timeline',title:'Lab test: design through time',q:'Which design movement did Gerrit Rietveld belong to?',opts:['Arts and Crafts','De Stijl','Memphis'],right:1,ms:6000,
  res:'Rietveld was part of De Stijl (around 1917 to 1931): primary colours, black lines and flat planes, as in the Red Blue Chair.'}},
{t:'Quick fire',c:'#14213d',lead:'Say the answer before you tap. Then the exam question.',
 cards:[['Watching users','<em>Observation</em> (primary)'],['Body-size data','<em>Anthropometrics</em>'],['Doorway height','<em>95th</em> percentile'],['Red Blue Chair','<em>Rietveld</em>, De Stijl'],['5,127 prototypes','<em>Dyson</em>'],['"Less than 2 kg"','<em>Measurable</em> spec point']],
 exam:{q:'Explain why designers use anthropometric data when designing a chair for a school. (3 marks)',a:'Anthropometric data gives the body sizes of the users (1), e.g. seat height from knee-to-floor height (1), so the chair fits most students (5th to 95th percentile) and is comfortable and safe to use (1).'}}
];
const DEMOS={
saydo:(t)=>{const k=clamp(t*1.3);return T(20,30,'"Do you read the instructions?" (illustrative)','font-size="15" fill="#5b6670"')+`<rect x="80" y="${260-190*0.8*k}" width="160" height="${190*0.8*k}" fill="#2478b3"/>`+T(160,285,'Say they do','text-anchor="middle"')+`<rect x="360" y="${260-190*0.2*k}" width="160" height="${190*0.2*k}" fill="#be3f66"/>`+T(440,285,'Seen doing it','text-anchor="middle"')+(t>.75?T(160,255-152,'80%','text-anchor="middle" font-weight="700" font-size="20"')+T(440,255-38,'20%','text-anchor="middle" font-weight="700" font-size="20"'):'')},
ramp:(t)=>{const users=['Wheelchair','Buggy','Suitcase','Trolley','Stick','Delivery'];let o=`<polygon points="40,260 300,260 300,200" fill="#cdbfa4"/>`+`<path d="M330 260 L330 240 L370 240 L370 220 L410 220 L410 200 L450 200 L450 260Z" fill="#ddd" opacity=".6"/>`+T(170,285,'Ramp','text-anchor="middle" font-weight="700"')+T(390,285,'Steps','text-anchor="middle" fill="#999"');
 const k=Math.floor(t*6.5);users.forEach((u,i)=>{const on=i<k;o+=`<rect x="${30+i*95}" y="40" width="86" height="40" rx="8" fill="${on?'#be3f66':'#fff'}" stroke="#be3f66"/>`+T(73+i*95,65,u,'text-anchor="middle" font-size="12" fill="'+(on?'#fff':'#be3f66')+'"')});
 return o+T(300,130,`${Math.min(k,6)} kinds of user helped`,'text-anchor="middle" font-weight="700" font-size="20"')},
pct:(t)=>{let p='';for(let i=0;i<=100;i++){const x=40+i*5.2,z=(i-50)/16;p+=`${x},${250-180*Math.exp(-z*z/2)} `}
 const k=clamp(t*1.4),x5=40+24*5.2,x95=40+76*5.2;return `<polyline points="${p}" fill="none" stroke="#2e8b57" stroke-width="4"/><rect x="${x5}" y="60" width="${(x95-x5)*k}" height="190" fill="#2e8b57" opacity=".15"/><line x1="${x5}" y1="60" x2="${x5}" y2="250" stroke="#999" stroke-dasharray="4 4"/><line x1="${x95}" y1="60" x2="${x95}" y2="250" stroke="#c2410c" stroke-width="${t>.7?4:1}" stroke-dasharray="4 4"/>`+T(x5,280,'5th','text-anchor="middle"')+T(x95,280,'95th','text-anchor="middle" font-weight="700" fill="#c2410c"')+T(300,280,'height →','text-anchor="middle" font-size="13"')+(t>.7?T(x95-8,50,'doorway: design here','text-anchor="end" font-weight="700" fill="#c2410c" font-size="14"'):'')},
spec:(t)=>{const r=[['It should look nice','Colour scheme chosen by 3 of 5 users in testing'],['It must be light','Weighs less than 500 g'],['Easy to hold','Handle 30 mm diameter, soft grip']];let o='';
 r.forEach(([a,b],i)=>{const k=clamp(t*3.3-i),y=40+i*80;o+=`<rect x="20" y="${y}" width="250" height="56" rx="8" fill="#fff" stroke="#c2410c"/>`+T(145,y+33,a,'text-anchor="middle" fill="#c2410c"');if(k>0)o+=AR(275,y+28,305,y+28,'#1b2a33',3)+`<rect x="310" y="${y}" width="270" height="56" rx="8" fill="#e5f4e4" stroke="#2e8b57" opacity="${k}"/>`+`<foreignObject x="316" y="${y+4}" width="258" height="50" opacity="${k}"><div xmlns="http://www.w3.org/1999/xhtml" style="font:600 13px Lexend,sans-serif;color:#2e8b57;display:flex;align-items:center;height:48px">${b}</div></foreignObject>`});
 return T(145,25,'Vague','text-anchor="middle" font-weight="700" fill="#c2410c"')+T(445,25,'Measurable','text-anchor="middle" font-weight="700" fill="#2e8b57"')+o},
timeline:(t)=>{const d=[[1861,'Morris','Arts and Crafts','#8b5a2b'],[1918,'Rietveld','De Stijl','#c2410c'],[1925,'Breuer','Bauhaus','#5b6670'],[1931,'Beck','Tube map','#2478b3'],[1981,'Sottsass','Memphis','#7449b0'],[1990,'Starck','Juicy Salif','#c99a06'],[1993,'Dyson','DC01','#2e8b57']];
 let o=`<line x1="30" y1="160" x2="570" y2="160" stroke="#1b2a33" stroke-width="3"/>`;const k=Math.floor(t*7.5);
 d.forEach(([y,n,m,c],i)=>{if(i>=k)return;const x=30+(y-1850)/(2000-1850)*540,up=i%2===0,lx=60+i*80;o+=`<circle cx="${x}" cy="160" r="8" fill="${c}"/><line x1="${x}" y1="160" x2="${lx}" y2="${up?100:220}" stroke="${c}"/>`+T(lx,up?70:240,n,'text-anchor="middle" font-weight="700" font-size="14" fill="'+c+'"')+T(lx,up?88:258,m+' '+y,'text-anchor="middle" font-size="11"')});return o}
};


const nav=document.getElementById('nav'),main=document.getElementById('main');let cur=0,anim=null;
S.forEach((s,i)=>{const b=document.createElement('button');b.innerHTML=`<span class="dot" style="background:${s.c}"></span>${i+1}. ${s.t}`;b.onclick=()=>show(i);nav.appendChild(b)});
const T=(x,y,t,o='')=>`<text x="${x}" y="${y}" font-family="Lexend" font-size="18" fill="#1b2a33" ${o}>${t}</text>`;
const AR=(x1,y1,x2,y2,c='#c2410c',w=5)=>{const a=Math.atan2(y2-y1,x2-x1),s=12;return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}"/><polygon points="${x2},${y2} ${x2-s*Math.cos(a-.5)},${y2-s*Math.sin(a-.5)} ${x2-s*Math.cos(a+.5)},${y2-s*Math.sin(a+.5)}" fill="${c}"/>`};
const lerp=(a,b,t)=>a+(b-a)*t, clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
function show(i){cur=i;cancelAnimationFrame(anim);[...nav.querySelectorAll('button')].forEach((b,k)=>b.setAttribute('aria-current',k===i));const s=S[i];
 const cards=s.cards.map(([n,b])=>`<button class="card" style="--c:${s.c}"><b>${n}</b><span class="back">${b}</span><span class="hint">Tap to reveal</span></button>`).join('');
 let right='';
 if(s.demo){const d=s.demo;right=`<section class="lab"><h3>${d.title}</h3><p class="q">${d.q}</p><div class="opts">${d.opts.map((o,k)=>`<button class="opt" data-k="${k}">${o}</button>`).join('')}</div><div class="stage" id="stage"></div><div class="row"><button class="go" id="run">${d.run||'Run the test'}</button><button class="go sec" id="reset">Reset</button>${(d.buttons||[]).map(b=>`<button class="opt" data-b="${b}">${b}</button>`).join('')}${d.slider?`<input type="range" id="slider" min="0" max="1000" value="0" aria-label="${d.slider}"><span class="clock" id="clock"></span>`:''}</div><div class="result" id="res">${d.res}</div></section>`}
 if(s.exam)right=`<section class="lab"><h3>Exam question</h3><p class="q">${s.exam.q}</p><button class="go" id="ex">Show a model answer</button><div class="result" id="res">${s.exam.a}</div></section>`;
 main.innerHTML=`<div class="head"><h2 style="color:${s.c}">${s.t}</h2></div><p class="lead">${s.lead}</p><div class="grid"${right?'':' style="grid-template-columns:1fr"'}><div class="cards">${cards}</div>${right}</div>`;
 main.querySelectorAll('.card').forEach(c=>c.onclick=()=>c.classList.toggle('open'));
 main.querySelectorAll('.opt[data-k]').forEach(o=>o.onclick=()=>o.classList.toggle('sel'));
 if(s.exam)document.getElementById('ex').onclick=()=>document.getElementById('res').classList.add('show');
 if(s.demo)setup(s.demo);main.scrollTop=0}
function setup(d){const st=document.getElementById('stage'),res=document.getElementById('res'),run=document.getElementById('run'),sl=document.getElementById('slider'),ck=document.getElementById('clock');
 const D=DEMOS[d.type];let state={mode:d.mode0||(d.buttons||[])[0]};
 const draw=t=>{st.innerHTML=`<svg viewBox="0 0 600 300">${D(t,state,d)}</svg>`;if(sl){sl.value=Math.round(t*1000);if(d.clock)ck.textContent=d.clock(t)}};
 const finish=()=>{res.classList.add('show');main.querySelector(`.opt[data-k="${d.right}"]`).classList.add('right')};
 const play=(ms,done=finish)=>{cancelAnimationFrame(anim);const t0=performance.now();const step=now=>{const t=Math.min(1,(now-t0)/ms);draw(t);if(t<1)anim=requestAnimationFrame(step);else done()};anim=requestAnimationFrame(step)};
 const reset=()=>{cancelAnimationFrame(anim);res.classList.remove('show');main.querySelectorAll('.opt').forEach(o=>o.classList.remove('right'));state.mode=d.mode0||(d.buttons||[])[0];draw(0)};
 run.onclick=()=>{reset();if(d.runMode)state.mode=d.runMode;play(d.ms||3000)};
 document.getElementById('reset').onclick=reset;
 main.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{state.mode=b.dataset.b;play(d.bms||1600,()=>{})});
 if(sl)sl.oninput=()=>{cancelAnimationFrame(anim);draw(sl.value/1000);if(sl.value>=1000)finish()};
 draw(0)}
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='ArrowDown'||e.key==='PageDown')show(Math.min(S.length-1,cur+1));if(e.key==='ArrowUp'||e.key==='PageUp')show(Math.max(0,cur-1))});
show(0);

}
</script>
</body>
</html>
