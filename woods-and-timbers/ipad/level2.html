<body class="flow">
<header>
  <div class="brand"><span class="lvl">WOODS &amp; TIMBERS · LEVEL 2</span><h1>Forest to timber yard</h1></div>
  <ol id="steps"></ol>
  <div class="hbtns"><a class="hbtn" href="index.html">🗺️</a><div id="score">⭐ 0</div></div>

<script>
/* Shared helpers for the Woods & Timbers workbook */
window.G=(function(){
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function hash(s){let h=2166136261;for(const c of s)h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0;}

let score=0;
function addScore(d){score+=d;const el=$('#score');if(!el)return;el.textContent='⭐ '+score;if(d>0){el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump');}}
let toastT;
function toast(html,kind,ms){const t=$('#toast');t.innerHTML=html;t.className='show '+(kind||'');clearTimeout(toastT);toastT=setTimeout(()=>t.className='',ms||1500);}
function prompt(html){const p=$('#prompt');if(!html){p.classList.remove('show');return;}p.innerHTML=html;p.classList.remove('show');void p.offsetWidth;p.classList.add('show');}
function leaves(){const e=['🍂','🍃','🍁','⭐','🪵'];for(let i=0;i<40;i++){const s=document.createElement('div');s.className='leafc';s.textContent=e[i%e.length];s.style.left=Math.random()*100+'vw';s.style.animationDuration=(2.4+Math.random()*2)+'s';s.style.animationDelay=(Math.random()*0.8)+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),5500);}}
function steps(names){$('#steps').innerHTML=names.map((n,i)=>`<li>${i+1} ${n}</li>`).join('');}
function setStep(i){$$('#steps li').forEach((li,k)=>{li.classList.toggle('on',k===i);li.classList.toggle('done',k<i);});}
function starsFor(pct){return pct>=0.85?3:pct>=0.6?2:1;}
function saveStars(level,stars){try{const k='wt-stars-'+level;const old=+localStorage.getItem(k)||0;if(stars>old)localStorage.setItem(k,String(stars));}catch(e){}}
function getStars(level){try{return +localStorage.getItem('wt-stars-'+level)||0;}catch(e){return 0;}}
function finish(level,max,msg,nextHref,nextLabel){
  const stars=starsFor(score/max);saveStars(level,stars);leaves();prompt('🏆 Level complete!');
  $('#panel').innerHTML=`<h2>Level complete!</h2><div class="stars">${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}</div><p>${msg||''}${msg?'<br>':''}You scored <b>${score} / ${max}</b>.</p>
  <button class="cta alt" id="mq" style="margin-bottom:10px">📝 Take the mini quiz (send answers to your teacher)</button>
  <div class="row"><button class="ghost" onclick="location.reload()">↺ Play again</button>${nextHref?`<a class="cta" style="flex:1;width:auto" href="${nextHref}">${nextLabel||'Next level →'}</a>`:`<a class="cta" style="flex:1;width:auto" href="index.html">🗺️ Back to the map</a>`}</div>`;
  $('#mq').onclick=()=>quiz(level,score,max);setTimeout(()=>quiz(level,score,max),1600);
}
/* Drag an element and drop it on anything matching opts.targets. onDrop(el,target,x,y) returns false to send it back. */
function drag(el,opts){
  el.style.touchAction='none';
  el.addEventListener('pointerdown',e=>{
    if(el.dataset.locked==='1'||e.button>0)return;e.preventDefault();
    const r=el.getBoundingClientRect(),ox=e.clientX-r.left,oy=e.clientY-r.top,sx=e.clientX,sy=e.clientY;
    let moved=false,ph=null;
    const start=()=>{moved=true;ph=el.cloneNode(true);ph.classList.add('ph');el.parentNode.insertBefore(ph,el);
      el.style.width=r.width+'px';el.style.height=r.height+'px';el.style.left=r.left+'px';el.style.top=r.top+'px';el.classList.add('dragging');opts.onStart&&opts.onStart(el);};
    const mv=ev=>{if(!moved){if(Math.hypot(ev.clientX-sx,ev.clientY-sy)<6)return;start();}
      el.style.left=(ev.clientX-ox)+'px';el.style.top=(ev.clientY-oy)+'px';
      const t=document.elementFromPoint(ev.clientX,ev.clientY);$$(opts.targets).forEach(x=>x.classList.toggle('over',!!t&&x.contains(t)));};
    const up=ev=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);
      $$(opts.targets).forEach(x=>x.classList.remove('over'));
      if(!moved){opts.onTap&&opts.onTap(el);return;}
      const t=document.elementFromPoint(ev.clientX,ev.clientY);const target=t&&t.closest(opts.targets);
      el.classList.remove('dragging');['width','height','left','top'].forEach(p=>el.style[p]='');
      ph.parentNode.insertBefore(el,ph);ph.remove();
      if(target){const ok=opts.onDrop(el,target,ev.clientX,ev.clientY);if(ok===false){el.classList.add('shake');setTimeout(()=>el.classList.remove('shake'),400);}}
      else if(opts.onMiss)opts.onMiss(el);};
    addEventListener('pointermove',mv);addEventListener('pointerup',up);addEventListener('pointercancel',up);
  });
}
/* Procedural wood swatch */
function swatch(canvas,spec,seed){
  const ctx=canvas.getContext('2d'),w=canvas.width,h=canvas.height,r=mulberry32(seed||hash(spec.base+spec.dark));
  ctx.fillStyle=spec.base;ctx.fillRect(0,0,w,h);
  const lines=spec.fine?70:spec.bold?26:44;
  for(let i=0;i<lines;i++){const y0=r()*h,amp=(spec.wavy?10:3)+r()*4,fq=0.006+r()*0.01,ph=r()*6;
    ctx.strokeStyle=spec.dark;ctx.globalAlpha=(spec.bold?0.35:0.18)+r()*0.2;ctx.lineWidth=(spec.bold?2.5:1)+r()*(spec.fine?0.6:2);
    ctx.beginPath();for(let x=0;x<=w;x+=6){const y=y0+Math.sin(x*fq+ph)*amp+Math.sin(x*0.03+ph*2)*1.2;x?ctx.lineTo(x,y):ctx.moveTo(x,y);}ctx.stroke();}
  if(spec.rays){for(let i=0;i<60;i++){ctx.globalAlpha=0.25;ctx.fillStyle=spec.ray||'#f3dfb8';ctx.fillRect(r()*w,r()*h,6+r()*14,1.5+r()*1.5);}}
  if(spec.flecks){for(let i=0;i<180;i++){ctx.globalAlpha=0.3;ctx.fillStyle=spec.dark;ctx.fillRect(r()*w,r()*h,1.5,2.5);}}
  if(spec.knots){const n=spec.knots;for(let k=0;k<n;k++){const cx=w*(0.2+0.6*r()),cy=h*(0.2+0.6*r()),rx=8+r()*10;
    for(let j=6;j>=0;j--){ctx.globalAlpha=j?0.22:0.85;ctx.strokeStyle=spec.dark;ctx.fillStyle=spec.knot||'#7a4a22';ctx.beginPath();ctx.ellipse(cx,cy,rx+j*5,(rx+j*5)*0.6,0,0,Math.PI*2);j?ctx.stroke():ctx.fill();}}}
  ctx.globalAlpha=1;
  const g=ctx.createLinearGradient(0,0,w,h);g.addColorStop(0,'rgba(255,255,255,0.12)');g.addColorStop(1,'rgba(0,0,0,0.1)');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
}
const TIMBERS={
  oak:{name:'Oak',kind:'hardwood',base:'#c99d6b',dark:'#7a5330',rays:true},

  pine:{name:'Pine',kind:'softwood',base:'#ecca8c',dark:'#b98444',bold:true,knots:2},

  fir:{name:'Douglas fir',kind:'softwood',base:'#dba36f',dark:'#9a5f2f',bold:true},

<script>
(function(){

function step1(){

function orderDone(){

  const wet=G.clamp((K.mc-8)/52,0,1);const col=lerpC('#d9b47e','#7d5c3c',wet),dark=lerpC('#b88c58','#5a3f27',wet);
  const rows=6,pw=iw*0.72,px=ix+(iw-pw)/2,ph=Math.min(26,ih*0.07),gap=ph*0.55,sy=iy+ih-30-rows*(ph+gap);
  for(let r=0;r<rows;r++){const py=sy+r*(ph+gap);
    x.fillStyle=col;x.fillRect(px,py,pw,ph);x.fillStyle=dark;x.fillRect(px,py+ph-4,pw,4);
    x.strokeStyle='rgba(0,0,0,0.15)';x.lineWidth=1;for(let l=1;l<4;l++){x.beginPath();x.moveTo(px,py+l*ph/4);x.bezierCurveTo(px+pw*0.3,py+l*ph/4+3,px+pw*0.6,py+l*ph/4-3,px+pw,py+l*ph/4);x.stroke();}
    x.fillStyle='#3d2a1c';for(let s=0;s<5;s++)x.fillRect(px+pw*(0.04+s*0.23),py+ph,10,gap);
    if(K.cracked){x.strokeStyle='#120b07';x.lineWidth=2.5;for(let k=0;k<3;k++){const cx=px+pw*(0.15+0.33*k+((r*7)%5)/40);x.beginPath();x.moveTo(cx,py+1);x.lineTo(cx+6,py+ph*0.4);x.lineTo(cx-3,py+ph*0.7);x.lineTo(cx+4,py+ph-1);x.stroke();}}}
  // vapour + steam particles
  if(K.run&&Math.random()<(K.rate||0)*0.25)K.parts.push({x:px+Math.random()*pw,y:sy,vy:-30-Math.random()*30,a:1,r:3+Math.random()*3,c:'150,200,255'});
  if(K.run&&K.steam&&Math.random()<0.6)K.parts.push({x:ix+20,y:iy+ih*0.5,vx:60+Math.random()*40,vy:-20,a:0.8,r:8+Math.random()*10,c:'255,255,255'});
  K.parts=K.parts.filter(p=>p.a>0.02);
  for(const p of K.parts){p.x+=(p.vx||0)*dt;p.y+=p.vy*dt;p.a-=dt*0.5;x.fillStyle=`rgba(${p.c},${p.a})`;x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill();}
  if(!K.run&&!K.done&&!K.cracked&&K.day===0){x.fillStyle='rgba(0,0,0,0.45)';x.fillRect(ix,iy,iw,ih);x.fillStyle='#fff';x.textAlign='center';x.font=`700 ${Math.round(m*0.6)}px Fredoka`;x.fillText('Set the heat, then press ▶ Start',W/2,iy+ih*0.18);}
}
function drawDial(){
  const c=$('#dial'),x=c.getContext('2d'),W=c.width,H=c.height,cx=W/2,cy=H-30,R=W*0.34;x.clearRect(0,0,W,H);
  const ang=v=>Math.PI+Math.PI*G.clamp(v,0,60)/60;
  x.lineWidth=28;x.strokeStyle='#eee';x.beginPath();x.arc(cx,cy,R,Math.PI,2*Math.PI);x.stroke();
  x.strokeStyle='#7ed957';x.beginPath();x.arc(cx,cy,R,ang(8),ang(12));x.stroke();
  x.strokeStyle='#f6b8a0';x.beginPath();x.arc(cx,cy,R,ang(28),ang(60));x.stroke();
  x.fillStyle='#777';x.font='700 20px Fredoka';x.textAlign='center';[0,12,28,60].forEach(v=>{const a=ang(v);x.fillText(v,cx+Math.cos(a)*(R+34),cy+Math.sin(a)*(R+34)+6);});
  const a=ang(K.mc);x.strokeStyle='#1d2b24';x.lineWidth=7;x.lineCap='round';x.beginPath();x.moveTo(cx,cy);x.lineTo(cx+Math.cos(a)*R*0.92,cy+Math.sin(a)*R*0.92);x.stroke();
  x.fillStyle='#1d2b24';x.beginPath();x.arc(cx,cy,12,0,7);x.fill();
  x.font='700 46px Fredoka';x.fillStyle=K.mc>=8&&K.mc<=12?'#2f7d1e':'#1f4d36';x.fillText(K.mc.toFixed(1)+'%',cx,cy-R*0.35);
}

/* ================= STEP 3: AIR OR KILN ================= */
const SC=[
 {q:'A garden bench that will stay outside all year.',a:'air',e:'Outdoor timber only needs to match the moisture of outdoor air (about 15–20%), so slower, cheaper air seasoning is fine.'},
 {q:'A dining table for a centrally heated home.',a:'kiln',e:'In a heated home, timber must be dried to about 8–12% or it will shrink, warp and split. Only a kiln can get it that dry.'},
 {q:'A furniture factory needs dry oak by next week.',a:'kiln',e:'A kiln takes days or weeks. Air drying thick oak could take years (about 1 year per 25 mm of thickness).'},
 {q:'A small woodland owner wants the cheapest, lowest-energy method.',a:'air',e:'Air seasoning only needs time and a covered stack, with no fuel or electricity.'},
 {q:'Wooden flooring for a heated office.',a:'kiln',e:'Heated buildings are dry. Flooring that hasn’t been kiln-dried will shrink and leave gaps.'},
 {q:'Fence posts for a farm field.',a:'air',e:'Fence posts live outdoors, so air-seasoned timber is the sensible, low-cost choice.'}];
let si=0,answered=false;
const AIR_SVG=`<svg viewBox="0 0 300 140"><rect x="0" y="0" width="300" height="140" fill="#e6f4fb"/><polygon points="30,30 150,8 270,30" fill="#8a5a32"/><rect x="40" y="30" width="6" height="96" fill="#6b4a2f"/><rect x="254" y="30" width="6" height="96" fill="#6b4a2f"/>${[0,1,2,3,4].map(i=>`<rect x="60" y="${48+i*15}" width="180" height="9" rx="2" fill="#d9b47e"/>${[0,1,2,3].map(s=>`<rect x="${66+s*55}" y="${57+i*15}" width="8" height="6" fill="#5b3a22"/>`).join('')}`).join('')}<rect x="20" y="126" width="260" height="6" fill="#7fb069"/>${[0,1,2].map(i=>`<path d="M${4} ${60+i*22} q14 -8 28 0" stroke="#4a9be0" stroke-width="3" fill="none"/><path d="M${268} ${60+i*22} q14 -8 28 0" stroke="#4a9be0" stroke-width="3" fill="none"/>`).join('')}</svg>`;
const KILN_SVG=`<svg viewBox="0 0 300 140"><rect x="0" y="0" width="300" height="140" fill="#fbeee2"/><rect x="30" y="10" width="240" height="122" rx="12" fill="#b5653f"/><rect x="45" y="25" width="210" height="95" rx="8" fill="#2c2019"/>${[0,1,2,3].map(i=>`<rect x="75" y="${40+i*16}" width="150" height="10" rx="2" fill="#d9b47e"/>`).join('')}${[0,1,2,3].map(i=>`<rect x="${60+i*48}" y="110" width="34" height="5" fill="#ff8a3c"/>`).join('')}<circle cx="236" cy="42" r="12" fill="#888"/><path d="M236 42 l10 -6 M236 42 l-2 12 M236 42 l-9 -5" stroke="#ddd" stroke-width="4"/><g fill="#fff" opacity=".8"><circle cx="62" cy="60" r="7"/><circle cx="70" cy="50" r="5"/><circle cx="60" cy="45" r="4"/></g></svg>`;
function step3(){
  G.setStep(2);si=0;
  stage.innerHTML=`<div class="methods"><button class="method" data-m="air"><h3>🌬️ Air seasoning</h3>${AIR_SVG}<ul><li>Stacked with spacers (<b>stickers</b>) under a roof, with open sides so air flows through</li><li><b>Slow</b>: about 1 year per 25 mm thickness</li><li>Dries to about <b>15–20%</b></li><li>Cheap and uses little energy</li></ul></button>
  <button class="method" data-m="kiln"><h3>🔥 Kiln seasoning</h3>${KILN_SVG}<ul><li>Heated chamber with controlled <b>steam and fans</b></li><li><b>Fast</b>: days or weeks</li><li>Dries to about <b>8–12%</b> or lower</li><li>Costs more and uses energy</li></ul></button></div>`;
  $$('.method').forEach(b=>b.onclick=()=>answer(b.dataset.m));
  showScenario();
}
function showScenario(){answered=false;$$('.method').forEach(b=>b.classList.remove('right','wrong'));
  G.prompt(`🤔 Air or kiln? <em>${si+1} of ${SC.length}</em>`);
  panel.innerHTML=`<div class="dots">${SC.map((s,i)=>`<i class="${i<si?(s.ok?'ok':'no'):''}"></i>`).join('')}</div><div class="scn">${SC[si].q}</div><p>Tap the seasoning method you would choose.</p>`;}
function answer(m){if(answered)return;answered=true;const s=SC[si];s.ok=m===s.a;if(s.ok)G.addScore(1);
  $(`.method[data-m="${m}"]`).classList.add(s.ok?'right':'wrong');if(!s.ok)$(`.method[data-m="${s.a}"]`).classList.add('right');
  G.toast(s.ok?'✓ Good choice! +1':`It’s ${s.a==='air'?'air':'kiln'} seasoning`,s.ok?'good':'bad');
  panel.innerHTML=`<div class="dots">${SC.map((x,i)=>`<i class="${i<=si?(x.ok?'ok':'no'):''}"></i>`).join('')}</div><span class="tag ${s.ok?'':'bad'}">${s.ok?'✓ Correct':'✗ Not quite'}: ${s.a==='air'?'🌬️ Air':'🔥 Kiln'}</span><div class="scn">${s.q}</div><p>${s.e}</p><button class="cta" id="nx">${si<SC.length-1?'Next →':'Finish level 🏁'}</button>`;
  $('#nx').onclick=()=>{si++;if(si<SC.length)showScenario();else G.finish(2,MAX,'You know how timber gets from the forest to the timber yard.','level3.html','Next level: Slice the log →');};}

step1();
})();
