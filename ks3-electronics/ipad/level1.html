<!DOCTYPE html>
<html lang="en">
<head>
<script src="../../book-kit/solo-pages.js?h=70eba3ce"></script>
<link rel="manifest" href="app.webmanifest">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KS3 Electronics – Interactive Workbook">

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Level 1 · Symbol Spotter</title>
<link rel="stylesheet" href="../common.css?h=1095ee77">
<style>
.cards{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));margin-top:14px}
.flip{perspective:900px;height:210px;cursor:pointer;border:0;background:none;padding:0;font:inherit;color:inherit}
.flip .in{position:relative;width:100%;height:100%;transition:transform .55s;transform-style:preserve-3d}
.flip.open .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;border-radius:18px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px;border:3px solid #dde7f3;background:#fff}
.flip .b{transform:rotateY(180deg);background:var(--paper);border-color:#9fd6ea}
.flip .f svg{height:110px;width:150px}
.flip .b svg{height:70px;width:150px}
.flip h4{font:600 20px Fredoka;margin:6px 0 2px}
.flip small{font-size:13.5px;font-weight:700;color:#4c607c;text-align:center;line-height:1.3}
.flip .tapme{font-size:12px;font-weight:800;color:#8aa0bd;margin-top:4px}
.sy line,.sy path,.sy rect,.sy circle{stroke:var(--ink);stroke-width:3.2;stroke-linecap:round;fill:none}
.match{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.zone{border:3px dashed #c8d6e8;border-radius:16px;background:#fff;display:flex;flex-direction:column;align-items:center;padding:8px;min-height:190px;transition:background .2s}
.zone svg.pic{height:88px;width:130px}
.zone .slotz{height:58px;width:100%;border-radius:12px;background:#f2f6fb;margin-top:6px;display:flex;align-items:center;justify-content:center}
.zone.ok{border-style:solid;border-color:var(--green);background:#effdf8}
.zone.hot{background:#fff4e2;border-color:var(--orange)}
.zone b{font:600 16px Fredoka;margin-top:4px}
.tray{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;padding:12px;background:#13233b;border-radius:18px;min-height:84px}
.chip{background:var(--paper);border-radius:12px;padding:4px 6px;touch-action:none;cursor:grab;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.chip svg{width:100px;height:52px;display:block;pointer-events:none}
.chip.drag{position:fixed;z-index:50;pointer-events:none;transform:scale(1.12);box-shadow:0 12px 24px rgba(0,0,0,.35)}
.bigsym{display:flex;justify-content:center;background:var(--paper);border-radius:18px;border:3px solid #d3e0f0;padding:14px}
.bigsym svg{height:120px;width:240px}
.timer{font:600 18px Fredoka;color:var(--blue)}
</style>
</head>
<body>
<script src="../common.js?h=daf867c1"></script>
<script src="../circuit.js?h=8b387158"></script>
<script>
const PIC={
 cell:`<svg viewBox="0 0 150 110" class="pic"><rect x="22" y="40" width="96" height="34" rx="8" fill="#2b2d42"/><rect x="22" y="40" width="40" height="34" rx="8" fill="#e9a23b"/><rect x="50" y="40" width="12" height="34" fill="#e9a23b"/><rect x="118" y="50" width="8" height="14" rx="2" fill="#adb5bd"/><text x="98" y="63" fill="#fff" font-size="16" font-weight="800" font-family="Nunito">+</text><text x="28" y="63" fill="#5a3b00" font-size="12" font-weight="800" font-family="Nunito">1.5V</text></svg>`,
 battery:`<svg viewBox="0 0 150 110" class="pic"><rect x="18" y="22" width="104" height="66" rx="6" fill="#343a40"/><rect x="24" y="28" width="92" height="24" rx="6" fill="#e9a23b"/><rect x="24" y="58" width="92" height="24" rx="6" fill="#e9a23b"/><rect x="70" y="28" width="46" height="24" rx="6" fill="#2b2d42"/><rect x="24" y="58" width="46" height="24" rx="6" fill="#2b2d42"/><path d="M122 36 C140 36 140 20 148 18" stroke="#e63946" stroke-width="5" fill="none"/><path d="M122 74 C140 74 140 92 148 94" stroke="#222" stroke-width="5" fill="none"/></svg>`,
 bulb:`<svg viewBox="0 0 150 110" class="pic"><circle cx="75" cy="42" r="30" fill="#fff7cf" stroke="#c9b458" stroke-width="3"/><path d="M66 70 L66 52 Q75 34 84 52 L84 70" stroke="#8d6e1f" stroke-width="2.5" fill="none"/><path d="M68 46 q3 -6 7 0 q4 -6 7 0" stroke="#e76f51" stroke-width="2.5" fill="none"/><rect x="61" y="70" width="28" height="22" rx="3" fill="#adb5bd"/><path d="M61 76 h28 M61 82 h28 M61 88 h28" stroke="#7d8790" stroke-width="2"/><rect x="69" y="92" width="12" height="8" rx="2" fill="#495057"/></svg>`,
 switch:`<svg viewBox="0 0 150 110" class="pic"><rect x="30" y="56" width="90" height="34" rx="8" fill="#495057"/><rect x="58" y="44" width="34" height="18" rx="5" fill="#adb5bd"/><rect x="66" y="16" width="14" height="40" rx="7" fill="#dee2e6" transform="rotate(20 73 56)"/><circle cx="44" cy="73" r="6" fill="#c0a060"/><circle cx="106" cy="73" r="6" fill="#c0a060"/><text x="38" y="104" font-size="12" font-weight="800" fill="#495057" font-family="Nunito">OFF</text><text x="96" y="104" font-size="12" font-weight="800" fill="#495057" font-family="Nunito">ON</text></svg>`,
 push:`<svg viewBox="0 0 150 110" class="pic"><rect x="36" y="56" width="78" height="30" rx="6" fill="#343a40"/><rect x="52" y="46" width="46" height="14" rx="4" fill="#6c757d"/><ellipse cx="75" cy="44" rx="22" ry="9" fill="#c1121f"/><rect x="53" y="30" width="44" height="14" fill="#e63946"/><ellipse cx="75" cy="30" rx="22" ry="9" fill="#ff6b6b"/><rect x="48" y="86" width="6" height="16" fill="#adb5bd"/><rect x="96" y="86" width="6" height="16" fill="#adb5bd"/></svg>`,
 resistor:`<svg viewBox="0 0 150 110" class="pic"><line x1="6" y1="55" x2="144" y2="55" stroke="#adb5bd" stroke-width="4"/><rect x="40" y="40" width="70" height="30" rx="14" fill="#e9d8a6"/><rect x="52" y="40" width="7" height="30" fill="#8b4513"/><rect x="66" y="40" width="7" height="30" fill="#222"/><rect x="80" y="40" width="7" height="30" fill="#b5651d"/><rect x="96" y="40" width="5" height="30" fill="#d4af37"/></svg>`,
 motor:`<svg viewBox="0 0 150 110" class="pic"><rect x="30" y="28" width="76" height="54" rx="12" fill="#ced4da"/><rect x="30" y="28" width="76" height="14" rx="7" fill="#e9ecef"/><rect x="96" y="34" width="14" height="42" rx="4" fill="#868e96"/><rect x="110" y="51" width="32" height="8" rx="2" fill="#495057"/><rect x="22" y="40" width="8" height="10" fill="#c0a060"/><rect x="22" y="62" width="8" height="10" fill="#c0a060"/><text x="52" y="62" font-size="14" font-weight="800" fill="#6c757d" font-family="Nunito">DC</text></svg>`,
 buzzer:`<svg viewBox="0 0 150 110" class="pic"><ellipse cx="75" cy="66" rx="40" ry="12" fill="#111"/><rect x="35" y="36" width="80" height="30" fill="#222"/><ellipse cx="75" cy="36" rx="40" ry="12" fill="#343a40"/><circle cx="75" cy="36" r="5" fill="#111"/><path d="M60 78 v24" stroke="#e63946" stroke-width="4"/><path d="M90 78 v24" stroke="#222" stroke-width="4"/><path d="M118 20 q8 8 0 16 M126 14 q14 14 0 28" stroke="#7b5cff" stroke-width="3" fill="none"/></svg>`,
 led:`<svg viewBox="0 0 150 110" class="pic"><path d="M58 52 L58 30 A17 17 0 0 1 92 30 L92 52 Z" fill="#ff4d6d" opacity=".9"/><rect x="54" y="52" width="42" height="8" rx="2" fill="#e5383b"/><path d="M92 52 v8" stroke="#fff" stroke-width="3"/><rect x="64" y="60" width="4" height="46" fill="#adb5bd"/><rect x="82" y="60" width="4" height="34" fill="#adb5bd"/><text x="44" y="104" font-size="11" font-weight="800" fill="#495057" font-family="Nunito">long +</text><text x="90" y="92" font-size="11" font-weight="800" fill="#495057" font-family="Nunito">short −</text></svg>`,
 wire:`<svg viewBox="0 0 150 110" class="pic"><path d="M14 70 C40 20 70 100 100 50 S130 40 136 44" stroke="#e63946" stroke-width="9" fill="none" stroke-linecap="round"/><path d="M8 74 l8 -6" stroke="#d08c3a" stroke-width="4"/><path d="M136 44 l9 -2" stroke="#d08c3a" stroke-width="4"/></svg>`
};
const COMP=[
 {k:'cell',n:'Cell',j:'Provides the push (voltage) that makes current flow. The long line is +.'},
 {k:'battery',n:'Battery',j:'Two or more cells joined together – a bigger push.'},
 {k:'bulb',n:'Bulb (lamp)',j:'Gives out light when current flows through its thin filament.'},
 {k:'switch',n:'Switch',j:'Opens or closes a gap in the circuit to turn it off or on.'},
 {k:'push',n:'Push switch',j:'Only completes the circuit while you hold it down – like a doorbell.'},
 {k:'resistor',n:'Resistor',j:'Reduces (resists) the current. Protects parts like LEDs.'},
 {k:'motor',n:'Motor',j:'Turns electrical energy into movement – it spins.'},
 {k:'buzzer',n:'Buzzer',j:'Makes a sound when current flows through it.'},
 {k:'led',n:'LED',j:'Light Emitting Diode. Lights up but only works one way round.'},
 {k:'wire',n:'Wire',j:'Connects the parts. Drawn as a straight line.'}
];
const symSVG=(k,w=150,h=70)=>`<svg viewBox="-60 -30 120 60" style="width:${w}px;height:${h}px">${Circuit.sym(Circuit.parse(k),{},55)}${k==='motor'?'<text x="0" y="6.5" text-anchor="middle" style="font:800 18px Nunito;fill:var(--ink)">M</text>':''}</svg>`;

Level({n:1,title:'Symbol Spotter',summary:'every component has its own symbol. Engineers all over the world use the same symbols, so anyone can read a circuit diagram.',steps:[
 // 1. meet the components
 (st,api)=>{
  const c=h('div',{class:'card'});st.append(c);
  c.append(h('div',{class:'kicker'},'Step 1 · Meet the components'),h('h2',{},'What do they look like?'),
   h('p',{class:'lead'},'Each component has a real-life look and a circuit symbol. Tap every card to flip it and see its symbol and job.'));
  const grid=h('div',{class:'cards'});c.append(grid);
  const seen=new Set();const nx=api.nextBtn('I know them all →');nx.disabled=true;
  const cnt=h('span',{style:'font-weight:800;color:#5a6f8c'},'0 / 10 flipped');
  COMP.forEach(o=>{
   const b=h('button',{class:'flip',html:`<div class="in"><div class="f">${PIC[o.k]}<h4>${o.n}</h4><div class="tapme">TAP TO FLIP</div></div><div class="b">${symSVG(o.k)}<h4>${o.n}</h4><small>${o.j}</small></div></div>`,
    onclick:()=>{Sfx.click();b.classList.toggle('open');seen.add(o.k);cnt.textContent=`${seen.size} / 10 flipped`;if(seen.size===10&&nx.disabled){nx.disabled=false;Sfx.good();}}});
   grid.append(b);
  });
  c.append(h('div',{class:'row',style:'margin-top:16px;justify-content:space-between'},cnt,nx));
 },
 // 2. drag symbols onto pictures
 (st,api)=>{
  const c=h('div',{class:'card'});st.append(c);
  c.append(h('div',{class:'kicker'},'Step 2 · Match up'),h('h2',{},'Drag each symbol onto its component'),
   h('p',{class:'lead'},'Drag a symbol from the tray and drop it on the matching picture. Try to get them all right first time!'));
  const m=h('div',{class:'match'});c.append(m);
  const zones={};
  shuffle(COMP).forEach(o=>{const z=h('div',{class:'zone','data-k':o.k,html:`${PIC[o.k]}<b>${o.n}</b><div class="slotz"></div>`});zones[o.k]=z;m.append(z);});
  const tray=h('div',{class:'tray'});c.append(tray);
  const msg=h('div',{class:'msg hide'});c.append(msg);
  const nxt=h('div',{class:'row hide',style:'margin-top:14px'},api.nextBtn());c.append(nxt);
  let mistakes=0,placed=0;
  shuffle(COMP).forEach(o=>{
   const chip=h('div',{class:'chip',html:symSVG(o.k,100,52)});tray.append(chip);
   chip.addEventListener('pointerdown',e=>{
    e.preventDefault();Sfx.ac();const r=chip.getBoundingClientRect();const dx=e.clientX-r.left,dy=e.clientY-r.top;
    const ghost=chip.cloneNode(true);ghost.classList.add('drag');document.body.append(ghost);chip.style.opacity=.3;
    const mv=ev=>{ghost.style.left=(ev.clientX-dx)+'px';ghost.style.top=(ev.clientY-dy)+'px';
      Object.values(zones).forEach(z=>z.classList.remove('hot'));const t=document.elementFromPoint(ev.clientX,ev.clientY);const z=t&&t.closest('.zone');if(z&&!z.classList.contains('ok'))z.classList.add('hot');};
    mv(e);
    const up=ev=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);
      ghost.remove();chip.style.opacity=1;Object.values(zones).forEach(z=>z.classList.remove('hot'));
      const t=document.elementFromPoint(ev.clientX,ev.clientY);const z=t&&t.closest('.zone');
      if(!z||z.classList.contains('ok'))return;
      if(z.dataset.k===o.k){z.classList.add('ok');z.querySelector('.slotz').innerHTML=symSVG(o.k,100,52);chip.remove();placed++;Sfx.good();
        if(placed===10){const pts=Math.max(0,10-mistakes);api.add(pts,10);msg.className='msg good';msg.innerHTML=`🎉 All matched with ${mistakes} mistake${mistakes===1?'':'s'}. +${pts} points`;nxt.classList.remove('hide');confetti(60);}}
      else{mistakes++;Sfx.bad();z.classList.add('shake');setTimeout(()=>z.classList.remove('shake'),400);msg.className='msg bad';msg.textContent='Not that one – look at the shape of the symbol again.';}
    };
    addEventListener('pointermove',mv);addEventListener('pointerup',up);addEventListener('pointercancel',up);
   });
  });
 },
 // 3. speed round
 (st,api)=>{
  const c=h('div',{class:'card'});st.append(c);
  const qs=shuffle(COMP).map((o,i)=>({o,type:i%2}));
  let k=0,right=0;const t0=Date.now();
  const tm=h('span',{class:'timer'});const tick=setInterval(()=>{if(!document.body.contains(tm))return clearInterval(tick);tm.textContent='⏱ '+((Date.now()-t0)/1000).toFixed(0)+'s';},250);
  function show(){
   c.innerHTML='';
   c.append(h('div',{class:'row',style:'justify-content:space-between'},h('div',{class:'kicker'},`Step 3 · Speed round · ${k+1} of ${qs.length}`),tm));
   const q=qs[k],wrong=shuffle(COMP.filter(x=>x.k!==q.o.k)).slice(0,3),opts=shuffle([q.o,...wrong]);
   let done=false;
   const grid=h('div',{class:'opts two'});
   if(q.type===0){
    c.append(h('h2',{},'What is this symbol?'),h('div',{class:'bigsym',html:symSVG(q.o.k,240,120)}));
    opts.forEach(o=>grid.append(h('button',{class:'opt',onclick:e=>pick(e.currentTarget,o)},o.n)));
   }else{
    c.append(h('h2',{},`Which is the symbol for a ${q.o.n.toLowerCase()}?`));
    opts.forEach(o=>grid.append(h('button',{class:'opt',style:'display:flex;justify-content:center;background:var(--paper)',html:symSVG(o.k,150,64),onclick:e=>pick(e.currentTarget,o)})));
   }
   c.append(grid);
   function pick(b,o){if(done)return;done=true;const ok=o.k===q.o.k;if(ok){right++;Sfx.good();b.classList.add('right');}else{Sfx.bad();b.classList.add('wrong','shake');grid.children[opts.indexOf(q.o)].classList.add('right');}
    api.add(ok?1:0,1);
    setTimeout(()=>{k++;if(k<qs.length)show();else end();},ok?650:1500);}
  }
  function end(){clearInterval(tick);const s=((Date.now()-t0)/1000).toFixed(0);c.innerHTML='';
   c.append(h('h2',{},'Speed round done!'),h('p',{class:'lead'},`You got ${right} out of ${qs.length} in ${s} seconds.`),
    h('div',{class:'fact'},'💡 Top tip: the long line on a cell symbol is the positive (+) side. A battery is just two or more cells joined together.'),
    h('div',{class:'row',style:'margin-top:14px'},api.nextBtn('Finish level →')));}
  show();
 }
]});
</script>
</body>
</html>
