<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Production lesson</title>
<link rel="stylesheet" href="../../../../fonts/lexend.css">
<style>
/* VOICE: clear, calm teaching board, readable from the back row
   IDEA: a finishing workshop's test bench: try a finish, watch what happens
   PICTURE: a live lab test on every section, run after the class predicts
   COLOUR and TYPE: workshop paper white, ink, one colour per material area; Lexend
   LAYOUT: section tabs down the side, finish cards left, lab test right */
:root{color-scheme:light;--bg:#f6f4ef;--card:#fff;--ink:#1b2a33;--mut:#5b6670;--line:#d8d3c7;--ok:#2e8b57;--a:#0f766e}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.45 "Lexend",system-ui,sans-serif;display:grid;grid-template-columns:260px 1fr;overflow:hidden}
nav{background:var(--ink);color:#fff;padding:18px 12px;display:flex;flex-direction:column;gap:6px;overflow:auto}
nav h1{font-size:20px;line-height:1.15;margin:4px 8px 14px;font-weight:700}
nav button{all:unset;cursor:pointer;padding:12px 14px;border-radius:12px;font-size:17px;display:flex;gap:10px;align-items:center;min-height:44px}
nav button:hover{background:#ffffff14}
nav button[aria-current=true]{background:#fff;color:var(--ink);font-weight:700}
nav button:focus-visible{outline:3px solid #ffe14d}
nav .dot{width:14px;height:14px;border-radius:4px;flex:none}
main{overflow:auto;padding:28px 34px}
.head{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap;margin-bottom:6px}
h2{font-size:40px;line-height:1.05;margin:0}
.lead{color:var(--mut);margin:0 0 20px;max-width:70ch;font-size:19px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:28px;align-items:start}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{all:unset;cursor:pointer;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px;min-height:118px;display:flex;flex-direction:column;gap:6px;transition:border-color .2s,transform .2s}
.card:hover{transform:translateY(-2px)}
.card:focus-visible{outline:3px solid var(--a);outline-offset:2px}
.card b{font-size:20px}
.card .hint{color:var(--mut);font-size:14px;margin-top:auto}
.card .back{display:none;font-size:15.5px;line-height:1.4}
.card.open{border-color:var(--c,var(--a))}
.card.open .back{display:block}.card.open .hint{display:none}
.back em{font-style:normal;font-weight:700;color:var(--c,var(--a))}
.lab{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:20px}
.lab h3{margin:0 0 4px;font-size:24px}
.lab .q{font-size:20px;margin:6px 0 12px}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.opt{all:unset;cursor:pointer;border:2px solid var(--line);border-radius:999px;padding:8px 16px;font-size:16px;min-height:28px}
.opt.sel{border-color:var(--ink);background:#1b2a330d;font-weight:700}
.opt.right{border-color:var(--ok);background:#2e8b571a;color:#1d6b40;font-weight:700}
.stage{position:relative;border-radius:14px;background:#efeae0;overflow:hidden}
.stage svg{display:block;width:100%;height:auto}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.go{all:unset;cursor:pointer;background:var(--ink);color:#fff;border-radius:12px;padding:12px 22px;font-weight:700;min-height:20px}
.go.sec{background:transparent;color:var(--ink);border:2px solid var(--line)}
.go:focus-visible,.opt:focus-visible{outline:3px solid var(--a);outline-offset:2px}
.clock{font-size:22px;font-weight:700;margin-left:auto}
input[type=range]{width:220px;accent-color:var(--ink)}
.result{display:none;margin-top:14px;padding:14px 16px;border-radius:12px;background:#2e8b5714;border-left:6px solid var(--ok);font-size:17px}
.result.show{display:block}
.qa{display:grid;gap:10px}
.qa .card{min-height:0}
@media(max-width:1000px){body{grid-template-columns:1fr;overflow:auto}nav{flex-direction:row;flex-wrap:wrap;padding:10px}nav h1{width:100%}.grid{grid-template-columns:1fr}main{overflow:visible;padding:18px}}
@media(prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<nav id="nav"><h1>Scales of production and quality<br><span style="font-weight:400;font-size:14px;opacity:.75">AQA GCSE D&amp;T 3.2.7, 3.3.8</span></h1></nav>
<main id="main"></main>
<script>
{

const S=[
{t:'Scales of production',c:'#2478B3',lead:'How many products are needed decides how they are made.',
 cards:[['One-off','A single, unique product made to order: a wedding dress, a prototype. Very high cost per item.'],['Batch','A set quantity of identical products, then the line switches: school shirts, chair legs.'],['Mass','Huge numbers on a production line, often automated: phone cases, cars.'],['Continuous','Runs 24 hours a day without stopping: drinks cans, paper, steel.']],
 demo:{type:'scale',title:'Lab test: cost per item',q:'A mould costs £10,000 to make. As you make more products, the cost per item...',opts:['Goes up','Stays the same','Goes down'],right:2,ms:5000,
  res:'The set-up cost is shared over more products. 10 items: £1,000 each for the mould. 10,000 items: £1 each. That is why mass production is cheap per item.'}},
{t:'Production aids',c:'#8B5A2B',lead:'Production aids make every product the same, faster and with less skill.',
 cards:[['Jig','Guides a tool to the same place every time, e.g. a drilling jig.'],['Template','A shape to draw or cut around again and again.'],['Pattern','Paper pieces for cutting fabric, including seam allowance.'],['Mould / former','Shapes material identically: vacuum forming, injection moulding.'],['CAD/CAM','A CAD file drives a laser, CNC router or embroidery machine.']],
 demo:{type:'jig',title:'Lab test: drilling 8 holes',q:'What does using a drilling jig improve most?',opts:['How strong the wood is','How consistent each hole is','The colour of the product'],right:1,ms:5000,
  res:'Without a jig each hole is measured and marked by hand, so positions drift. The jig puts every hole in exactly the same place, quickly, with no measuring.'}},
{t:'Tolerances',c:'#C2410C',lead:'Nothing is made to the exact size. A tolerance is the acceptable difference from the design size.',
 cards:[['Reading it','50 ± 0.5 mm means anything from 49.5 to 50.5 mm is acceptable.'],['Limits','Lower limit = size − tolerance. Upper limit = size + tolerance.'],['On the limit','A part exactly on a limit passes.'],['Why it matters','Parts must fit together: a lid on a box, a bolt in a nut.']],
 demo:{type:'tol',title:'Lab test: checking a batch',q:'Spacers are 50 ± 0.5 mm. Does a spacer measuring 50.5 mm pass?',opts:['Yes','No'],right:0,ms:6000,
  res:'Yes: 50.5 is exactly on the upper limit, so it is in tolerance. 50.6 or 49.4 would fail.'}},
{t:'Quality control in printing',c:'#7449B0',lead:'Printed products have their own quality checks, printed in the waste area and trimmed off.',
 cards:[['Registration marks','Crosses printed in every colour. If they line up, the colours line up.'],['Colour bars','Strips of ink checked for the right density.'],['Crop marks','Show where to trim the sheet.'],['CMYK','Cyan, magenta, yellow and black plates printed one after another.']],
 demo:{type:'print',title:'Lab test: lining up four colours',q:'What do registration marks check?',opts:['The ink is dry','The colour plates line up','The paper is the right weight'],right:1,ms:5000,
  res:'Each colour is printed separately. When the registration crosses sit exactly on top of each other, the image is sharp. If not, you get blurry, shifted colours.'}},
{t:'Quality control and assurance',c:'#2E8B57',lead:'Quality control checks products. Quality assurance is the system that makes sure quality happens at every stage.',
 cards:[['Quality control','Inspecting and testing products as they are made: measuring, gauges, visual checks.'],['Go/no-go gauge','One end must fit, the other must not. Fast, with no reading needed.'],['Sampling','Checking some products from each batch, e.g. 1 in every 10.'],['Quality assurance','Standards, training, checked suppliers and records at every stage.']],
 demo:{type:'sample',title:'Lab test: sampling on the line',q:'Why check 1 in 10 instead of every product?',opts:['It saves time and money','It finds more faults','Products do not need checking'],right:0,ms:6000,
  res:'Checking every item is slow and costly. Regular sampling spots problems early: if a sample fails, the batch around it is checked and the machine is fixed.'}},
{t:'Quick fire',c:'#14213d',lead:'Say the answer before you tap. Then the exam question.',
 cards:[['200 school shirts','<em>Batch</em>'],['Drinks cans, nonstop','<em>Continuous</em>'],['Guides a drill','<em>Jig</em>'],['20 ± 0.1: lower limit','<em>19.9</em> mm'],['Lines up print colours','<em>Registration marks</em>'],['One end fits, one does not','<em>Go/no-go gauge</em>']],
 exam:{q:'A shelf bracket hole must be 6 ± 0.2 mm. Four holes measure 6.1, 5.7, 6.2 and 6.3 mm. Which pass? Explain why tolerances are used. (4 marks)',a:'Limits 5.8 to 6.2 (1). Pass: 6.1 and 6.2 (1); fail: 5.7 and 6.3 (1). Tolerances allow for small variation in manufacture while making sure parts still fit and work (1).'}}
];
const DEMOS={
scale:(t)=>{let o=`<line x1="60" y1="260" x2="580" y2="260" stroke="#999"/><line x1="60" y1="260" x2="60" y2="30" stroke="#999"/>`+T(300,290,'Number made (10 → 10,000)','text-anchor="middle" font-size="14"')+T(14,40,'£ per item','font-size="13"');let p='';const n=Math.floor(t*100);
 for(let i=0;i<=n;i++){const q=Math.pow(10,1+i*0.03),c=10000/q+2;p+=`${60+i*5.2},${260-Math.min(220,c/1000*220)} `}
 const q=Math.pow(10,1+n*0.03);return o+`<polyline points="${p}" fill="none" stroke="#2478b3" stroke-width="4"/>`+T(360,70,`${Math.round(q).toLocaleString()} made: £${(10000/q+2).toFixed(2)} each`,'font-weight="700" font-size="17"')},
jig:(t)=>{let o=`<rect x="40" y="60" width="240" height="60" fill="#d9b382"/><rect x="320" y="60" width="240" height="60" fill="#d9b382"/>`+T(160,45,'By hand','text-anchor="middle" font-weight="700"')+T(440,45,'With a jig','text-anchor="middle" font-weight="700"');
 const k=Math.floor(t*8.5);for(let i=0;i<Math.min(8,k);i++){const y=150+i*18;o+=`<rect x="40" y="${y}" width="240" height="12" fill="#d9b382"/><rect x="320" y="${y}" width="240" height="12" fill="#d9b382"/><circle cx="${100+Math.sin(i*2.7)*9}" cy="${y+6}" r="4" fill="#1b2a33"/><circle cx="380" cy="${y+6}" r="4" fill="#1b2a33"/>`}
 return o+`<line x1="100" y1="140" x2="100" y2="300" stroke="#c2410c" stroke-dasharray="4 4"/><line x1="380" y1="140" x2="380" y2="300" stroke="#2e8b57" stroke-dasharray="4 4"/><rect x="360" y="64" width="40" height="52" fill="none" stroke="#2e8b57" stroke-width="4"/>`+T(470,95,'jig','fill="#2e8b57" font-weight="700"')},
tol:(t)=>{const v=[50.2,49.4,50.5,49.8,50.6,50.0];let o=`<rect x="${300+(-0.5)*200}" y="40" width="200" height="200" fill="#e5f4e4"/>`+T(200,32,'49.5','text-anchor="middle" font-weight="700"')+T(400,32,'50.5','text-anchor="middle" font-weight="700"')+`<line x1="300" y1="40" x2="300" y2="240" stroke="#999" stroke-dasharray="4 4"/>`+T(300,262,'50.0','text-anchor="middle"');
 v.forEach((m,i)=>{const k=clamp(t*6-i);if(k<=0)return;const x=lerp(40,300+(m-50)*200,k),y=55+i*30,ok=Math.abs(m-50)<=0.5001;o+=`<circle cx="${x}" cy="${y}" r="9" fill="${k>=1?(ok?'#2e8b57':'#c2410c'):'#5b6670'}"/>`;if(k>=1)o+=T(x+16,y+5,m.toFixed(1)+(ok?' pass':' fail'),'font-size="14" fill="'+(ok?'#2e8b57':'#c2410c')+'" font-weight="700"')});return o},
print:(t)=>{const cols=['#00a3e0','#e5007e','#f2c500','#1b2a33'],k=clamp(t*1.2);let o='';
 cols.forEach((c,i)=>{const off=(1-k)*[22,-16,12,-8][i],offy=(1-k)*[-10,14,-18,6][i];o+=`<g transform="translate(${off} ${offy})" opacity="${i<3?.75:1}"><circle cx="260" cy="150" r="${70-i*14}" fill="none" stroke="${c}" stroke-width="10"/><line x1="470" y1="130" x2="530" y2="130" stroke="${c}" stroke-width="3"/><line x1="500" y1="100" x2="500" y2="160" stroke="${c}" stroke-width="3"/><circle cx="500" cy="130" r="14" fill="none" stroke="${c}" stroke-width="3"/></g>`});
 return o+T(500,200,'registration mark','text-anchor="middle" font-size="14"')+T(260,270,k>=1?'In register: sharp':'Out of register: blurry','text-anchor="middle" font-weight="700" fill="'+(k>=1?'#2e8b57':'#c2410c')+'"')},
sample:(t)=>{const sh=t*400;let o=`<rect x="0" y="180" width="600" height="20" fill="#5b6670"/>`;let checked=0,fails=0;
 for(let i=0;i<40;i++){const x=sh*3-i*40;if(x<-30||x>620)continue;const s=i%10===0&&x>300,bad=i===20;o+=`<rect x="${x}" y="140" width="28" height="40" rx="4" fill="${s?(bad?'#c2410c':'#2e8b57'):'#cdbfa4'}"/>`}
 for(let i=0;i<40;i++){if(sh*3-i*40>300&&i%10===0){checked++;if(i===20)fails++}}
 return o+`<rect x="290" y="60" width="50" height="60" fill="none" stroke="#1b2a33" stroke-width="3"/>`+T(315,50,'check 1 in 10','text-anchor="middle" font-size="14"')+T(20,250,`Samples checked: ${checked}`,'font-weight="700"')+(fails?T(20,280,'Sample failed: stop the line and check the batch!','fill="#c2410c" font-weight="700"'):'')}
};


const nav=document.getElementById('nav'),main=document.getElementById('main');let cur=0,anim=null;
S.forEach((s,i)=>{const b=document.createElement('button');b.innerHTML=`<span class="dot" style="background:${s.c}"></span>${i+1}. ${s.t}`;b.onclick=()=>show(i);nav.appendChild(b)});
const T=(x,y,t,o='')=>`<text x="${x}" y="${y}" font-family="Lexend" font-size="18" fill="#1b2a33" ${o}>${t}</text>`;
const AR=(x1,y1,x2,y2,c='#c2410c',w=5)=>{const a=Math.atan2(y2-y1,x2-x1),s=12;return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}"/><polygon points="${x2},${y2} ${x2-s*Math.cos(a-.5)},${y2-s*Math.sin(a-.5)} ${x2-s*Math.cos(a+.5)},${y2-s*Math.sin(a+.5)}" fill="${c}"/>`};
const lerp=(a,b,t)=>a+(b-a)*t, clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
function show(i){cur=i;cancelAnimationFrame(anim);[...nav.querySelectorAll('button')].forEach((b,k)=>b.setAttribute('aria-current',k===i));const s=S[i];
 const cards=s.cards.map(([n,b])=>`<button class="card" style="--c:${s.c}"><b>${n}</b><span class="back">${b}</span><span class="hint">Tap to reveal</span></button>`).join('');
 let right='';
 if(s.demo){const d=s.demo;right=`<section class="lab"><h3>${d.title}</h3><p class="q">${d.q}</p><div class="opts">${d.opts.map((o,k)=>`<button class="opt" data-k="${k}">${o}</button>`).join('')}</div><div class="stage" id="stage"></div><div class="row"><button class="go" id="run">${d.run||'Run the test'}</button><button class="go sec" id="reset">Reset</button>${(d.buttons||[]).map(b=>`<button class="opt" data-b="${b}">${b}</button>`).join('')}${d.slider?`<input type="range" id="slider" min="0" max="1000" value="0" aria-label="${d.slider}"><span class="clock" id="clock"></span>`:''}</div><div class="result" id="res">${d.res}</div></section>`}
 if(s.exam)right=`<section class="lab"><h3>Exam question</h3><p class="q">${s.exam.q}</p><button class="go" id="ex">Show a model answer</button><div class="result" id="res">${s.exam.a}</div></section>`;
 main.innerHTML=`<div class="head"><h2 style="color:${s.c}">${s.t}</h2></div><p class="lead">${s.lead}</p><div class="grid"${right?'':' style="grid-template-columns:1fr"'}><div class="cards">${cards}</div>${right}</div>`;
 main.querySelectorAll('.card').forEach(c=>c.onclick=()=>c.classList.toggle('open'));
 main.querySelectorAll('.opt[data-k]').forEach(o=>o.onclick=()=>o.classList.toggle('sel'));
 if(s.exam)document.getElementById('ex').onclick=()=>document.getElementById('res').classList.add('show');
 if(s.demo)setup(s.demo);main.scrollTop=0}
function setup(d){const st=document.getElementById('stage'),res=document.getElementById('res'),run=document.getElementById('run'),sl=document.getElementById('slider'),ck=document.getElementById('clock');
 const D=DEMOS[d.type];let state={mode:d.mode0||(d.buttons||[])[0]};
 const draw=t=>{st.innerHTML=`<svg viewBox="0 0 600 300">${D(t,state,d)}</svg>`;if(sl){sl.value=Math.round(t*1000);if(d.clock)ck.textContent=d.clock(t)}};
 const finish=()=>{res.classList.add('show');main.querySelector(`.opt[data-k="${d.right}"]`).classList.add('right')};
 const play=(ms,done=finish)=>{cancelAnimationFrame(anim);const t0=performance.now();const step=now=>{const t=Math.min(1,(now-t0)/ms);draw(t);if(t<1)anim=requestAnimationFrame(step);else done()};anim=requestAnimationFrame(step)};
 const reset=()=>{cancelAnimationFrame(anim);res.classList.remove('show');main.querySelectorAll('.opt').forEach(o=>o.classList.remove('right'));state.mode=d.mode0||(d.buttons||[])[0];draw(0)};
 run.onclick=()=>{reset();if(d.runMode)state.mode=d.runMode;play(d.ms||3000)};
 document.getElementById('reset').onclick=reset;
 main.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{state.mode=b.dataset.b;play(d.bms||1600,()=>{})});
 if(sl)sl.oninput=()=>{cancelAnimationFrame(anim);draw(sl.value/1000);if(sl.value>=1000)finish()};
 draw(0)}
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='ArrowDown'||e.key==='PageDown')show(Math.min(S.length-1,cur+1));if(e.key==='ArrowUp'||e.key==='PageUp')show(Math.max(0,cur-1))});
show(0);

}
</script>
</body>
</html>
