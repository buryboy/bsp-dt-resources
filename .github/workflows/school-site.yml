# Builds the student-facing site for dt.bsphosted.fr (Hostinger) on every push to main, uploads it to
# public_html over FTPS (repository secrets FTP_HOST / FTP_USER / FTP_PASSWORD), and keeps a copy on the
# `hostinger-site` branch. Hostinger's own Git deployment is blocked for managed-client hPanel logins.
# Only the open iPad workbooks, front pages and teacher lesson files go there: no admin tools, no backend code.
name: School site (dt.bsphosted.fr)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: school-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build front pages and site
        run: |
          python3 book-kit/tools/make_home.py
          python3 book-kit/tools/build_ipad_site.py "$RUNNER_TEMP/site"
          cp book-kit/hostinger/htaccess "$RUNNER_TEMP/site/.htaccess"
          rm -f "$RUNNER_TEMP/site/README.md"
          echo "files: $(find "$RUNNER_TEMP/site" -type f | wc -l)"
      - name: Tidy the FTP host (allow "ftp://…" or spaces pasted from hPanel)
        if: env.FTP_HOST != ''
        run: |
          host=$(printf '%s' "$FTP_HOST" | sed -E 's#^[a-zA-Z]+://##; s#[/:].*$##' | LC_ALL=C tr -cd 'A-Za-z0-9.-')
          echo "FTP host shape: $(printf '%s' "$host" | sed 's/[0-9]/9/g; s/[A-Za-z]/a/g') (raw length ${#FTP_HOST})"
          echo "::add-mask::$host"
          echo "FTP_SERVER=$host" >> "$GITHUB_ENV"
      - name: Upload to dt.bsphosted.fr by FTP
        if: env.FTP_HOST != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTP_SERVER }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          security: loose
          local-dir: ${{ runner.temp }}/site/
          server-dir: public_html/
      - name: Publish to the hostinger-site branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$RUNNER_TEMP/site"
          git init -q -b hostinger-site
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "School site built from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" hostinger-site
