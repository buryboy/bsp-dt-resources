/* Shared helpers for the Woods & Timbers workbook */
window.G=(function(){
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function hash(s){let h=2166136261;for(const c of s)h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0;}

let score=0;
function addScore(d){score+=d;const el=$('#score');if(!el)return;el.textContent='⭐ '+score;if(d>0){el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump');}}

function toast(html,kind,ms){const t=$('#toast');t.innerHTML=html;t.className='show '+(kind||'');clearTimeout(toastT);toastT=setTimeout(()=>t.className='',ms||1500);}
function prompt(html){const p=$('#prompt');if(!html){p.classList.remove('show');return;}p.innerHTML=html;p.classList.remove('show');void p.offsetWidth;p.classList.add('show');}
function leaves(){const e=['🍂','🍃','🍁','⭐','🪵'];for(let i=0;i<40;i++){const s=document.createElement('div');s.className='leafc';s.textContent=e[i%e.length];s.style.left=Math.random()*100+'vw';s.style.animationDuration=(2.4+Math.random()*2)+'s';s.style.animationDelay=(Math.random()*0.8)+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),5500);}}

/* Drag an element and drop it on anything matching opts.targets. onDrop(el,target,x,y) returns false to send it back. */
function drag(el,opts){
  el.style.touchAction='none';
  el.addEventListener('pointerdown',e=>{
    if(el.dataset.locked==='1'||e.button>0)return;e.preventDefault();
    const r=el.getBoundingClientRect(),ox=e.clientX-r.left,oy=e.clientY-r.top,sx=e.clientX,sy=e.clientY;
    let moved=false,ph=null;
    const start=()=>{moved=true;ph=el.cloneNode(true);ph.classList.add('ph');el.parentNode.insertBefore(ph,el);
      el.style.width=r.width+'px';el.style.height=r.height+'px';el.style.left=r.left+'px';el.style.top=r.top+'px';el.classList.add('dragging');opts.onStart&&opts.onStart(el);};
    const mv=ev=>{if(!moved){if(Math.hypot(ev.clientX-sx,ev.clientY-sy)<6)return;start();}
      el.style.left=(ev.clientX-ox)+'px';el.style.top=(ev.clientY-oy)+'px';
      const t=document.elementFromPoint(ev.clientX,ev.clientY);$$(opts.targets).forEach(x=>x.classList.toggle('over',!!t&&x.contains(t)));};
    const up=ev=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);
      $$(opts.targets).forEach(x=>x.classList.remove('over'));
      if(!moved){opts.onTap&&opts.onTap(el);return;}
      const t=document.elementFromPoint(ev.clientX,ev.clientY);const target=t&&t.closest(opts.targets);
      el.classList.remove('dragging');['width','height','left','top'].forEach(p=>el.style[p]='');
      ph.parentNode.insertBefore(el,ph);ph.remove();
      if(target){const ok=opts.onDrop(el,target,ev.clientX,ev.clientY);if(ok===false){el.classList.add('shake');setTimeout(()=>el.classList.remove('shake'),400);}}
      else if(opts.onMiss)opts.onMiss(el);};
    addEventListener('pointermove',mv);addEventListener('pointerup',up);addEventListener('pointercancel',up);
  });
}
/* Procedural wood swatch */
function swatch(canvas,spec,seed){
  const ctx=canvas.getContext('2d'),w=canvas.width,h=canvas.height,r=mulberry32(seed||hash(spec.base+spec.dark));
  ctx.fillStyle=spec.base;ctx.fillRect(0,0,w,h);
  const lines=spec.fine?70:spec.bold?26:44;
  for(let i=0;i<lines;i++){const y0=r()*h,amp=(spec.wavy?10:3)+r()*4,fq=0.006+r()*0.01,ph=r()*6;
    ctx.strokeStyle=spec.dark;ctx.globalAlpha=(spec.bold?0.35:0.18)+r()*0.2;ctx.lineWidth=(spec.bold?2.5:1)+r()*(spec.fine?0.6:2);
    ctx.beginPath();for(let x=0;x<=w;x+=6){const y=y0+Math.sin(x*fq+ph)*amp+Math.sin(x*0.03+ph*2)*1.2;x?ctx.lineTo(x,y):ctx.moveTo(x,y);}ctx.stroke();}
  if(spec.rays){for(let i=0;i<60;i++){ctx.globalAlpha=0.25;ctx.fillStyle=spec.ray||'#f3dfb8';ctx.fillRect(r()*w,r()*h,6+r()*14,1.5+r()*1.5);}}
  if(spec.flecks){for(let i=0;i<180;i++){ctx.globalAlpha=0.3;ctx.fillStyle=spec.dark;ctx.fillRect(r()*w,r()*h,1.5,2.5);}}
  if(spec.knots){const n=spec.knots;for(let k=0;k<n;k++){const cx=w*(0.2+0.6*r()),cy=h*(0.2+0.6*r()),rx=8+r()*10;
    for(let j=6;j>=0;j--){ctx.globalAlpha=j?0.22:0.85;ctx.strokeStyle=spec.dark;ctx.fillStyle=spec.knot||'#7a4a22';ctx.beginPath();ctx.ellipse(cx,cy,rx+j*5,(rx+j*5)*0.6,0,0,Math.PI*2);j?ctx.stroke():ctx.fill();}}}
  ctx.globalAlpha=1;
  const g=ctx.createLinearGradient(0,0,w,h);g.addColorStop(0,'rgba(255,255,255,0.12)');g.addColorStop(1,'rgba(0,0,0,0.1)');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
}

 ['Which of these is a softwood?',['Spruce','Mahogany','Beech','Balsa']],
 ['Which of these is a hardwood?',['Mahogany','Larch','Pine','Spruce']],
 ['Yew is very hard and heavy. What type of timber is it?',['A softwood, because it comes from a conifer','A hardwood, because it is hard','A manufactured board','A hardwood, because it is heavy']],
 ['What is woodworm?',['Beetle larvae that bore tunnels through timber','A fungus that rots damp wood','A type of softwood','A tool for carving wood']]],
 w:'Explain why softwoods are usually cheaper than hardwoods.'},
7:{qs:[
 ['Which finish is best for garden decking?',['Preservative','Wax','Food-safe oil','Polish']],
 ['Which finish should be used on a chopping board?',['Food-safe oil','Gloss paint','Preservative','Varnish']],
 ['Why are children’s wooden toys finished with non-toxic paint?',['So they are safe if chewed','So they are waterproof outdoors','Because it is the cheapest paint','So the grain shows through']],
 ['Which timber is best for a hammer handle?',['Ash','Balsa','MDF','Pine']],
 ['What is the main purpose of applying a finish to timber?',['To protect it from moisture, decay and wear and improve its appearance','To make it heavier','To make it easier to cut','To change it into a hardwood']]],
 w:'A client wants an outdoor picnic table. Choose a timber and a finish, and justify both choices.'},
8:{qs:[
 ['What causes dry rot?',['A fungus','An insect','Too much sunlight','Over-seasoning']],
 ['Which helps stop timber rotting?',['Seasoning it and treating it with preservative','Keeping it damp','Storing it outside uncovered','Cutting it thinner']],
 ['Which conversion method gives the most stable boards?',['Quarter sawn','Through-and-through','Rotary cut','Slab sawn']],
 ['Which manufactured board is made from veneers?',['Plywood','MDF','Chipboard','Hardboard']],
 ['Kiln-seasoned timber for indoor furniture is dried to about…',['8–12% moisture','25–30% moisture','50% moisture','0% moisture']]],
 w:'Explain how seasoning and preservatives help timber last longer.'}};
function formURL(fields){if(!FORM_TEMPLATE)return null;let u;try{u=new URL(FORM_TEMPLATE);}catch(e){return null;}
  const keys=['NAME','CLASS','LEVEL','SCORE','ANSWERS','WRITTEN'];const out=[];
  for(const [k,v] of u.searchParams.entries()){const bare=v.replace(/^"|"$/g,'').toUpperCase();const hit=keys.find(x=>x===bare);
    if(hit){const val=String(fields[hit]||'').slice(0,900);out.push([k,v.startsWith('"')?'"'+val.replace(/"/g,"'")+'"':val]);}else out.push([k,v]);}
  const q=out.map(([k,v])=>encodeURIComponent(k)+'='+encodeURIComponent(v)).join('&');return u.origin+u.pathname+'?'+q;}
function quiz(level,gameScore,gameMax){
  const bank=QUIZ[level];let i=0,right=0;const res=[];let name='',cls='';try{name=localStorage.getItem('wt-name')||'';cls=localStorage.getItem('wt-class')||'';}catch(e){}
  const qs=bank.qs.map(([q,o])=>({q,ans:o[0],opts:shuffle(o.slice())}));
  const ov=document.createElement('div');ov.id='quiz';ov.innerHTML='<div class="qc"></div>';document.body.appendChild(ov);const qc=ov.querySelector('.qc');
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  function intro(){qc.innerHTML=`<span class="tag">📝 Mini quiz · Level ${level}</span><h2>${LEVEL_NAMES[level]}</h2><p style="font-size:17px;margin:4px 0 6px">5 quick questions and one written answer. Your answers will be sent to your teacher.</p>
    <label>Your name</label><input id="qname" value="${esc(name)}" autocomplete="name"><label>Your class</label><input id="qclass" value="${esc(cls)}" placeholder="e.g. 10D">
    <div class="row" style="margin-top:16px"><button class="ghost" id="qx">Not now</button><button class="cta" style="flex:2;width:auto" id="qgo">Start the quiz →</button></div>`;
    qc.querySelector('#qx').onclick=()=>ov.remove();
    qc.querySelector('#qgo').onclick=()=>{name=qc.querySelector('#qname').value.trim();cls=qc.querySelector('#qclass').value.trim();
      if(!name){qc.querySelector('#qname').classList.add('shake');qc.querySelector('#qname').focus();return;}
      try{localStorage.setItem('wt-name',name);localStorage.setItem('wt-class',cls);}catch(e){}ask();};}
  function ask(){const Q=qs[i];qc.innerHTML=`<div class="qn">QUESTION ${i+1} OF ${qs.length}</div><div class="qbar"><i style="width:${i/qs.length*100}%"></i></div><div class="qq">${Q.q}</div><div class="qo">${Q.opts.map((o,k)=>`<button data-k="${k}">${o}</button>`).join('')}</div><div id="qf"></div>`;
    qc.querySelectorAll('.qo button').forEach(b=>b.onclick=()=>{if(qc.querySelector('.qo').dataset.done)return;qc.querySelector('.qo').dataset.done=1;const pick=Q.opts[+b.dataset.k],ok=pick===Q.ans;if(ok)right++;res.push({ok,pick});
      qc.querySelectorAll('.qo button').forEach(x=>{const o=Q.opts[+x.dataset.k];if(o===Q.ans)x.classList.add('right');else if(x===b)x.classList.add('wrong');});
      qc.querySelector('#qf').innerHTML=`<button class="cta" style="margin-top:14px" id="qn">${i<qs.length-1?'Next question →':'Last one: written answer →'}</button>`;
      qc.querySelector('#qn').onclick=()=>{i++;i<qs.length?ask():written();};});}
  function written(){qc.innerHTML=`<div class="qn">WRITTEN ANSWER</div><div class="qbar"><i style="width:100%"></i></div><div class="qq">${bank.w}</div><textarea id="qw" placeholder="Write your answer in full sentences…"></textarea><button class="cta" style="margin-top:14px" id="qd">Finish ✓</button>`;
    qc.querySelector('#qd').onclick=()=>{const w=qc.querySelector('#qw').value.trim();if(w.length<3){qc.querySelector('#qw').classList.add('shake');setTimeout(()=>qc.querySelector('#qw').classList.remove('shake'),400);return;}summary(w);};}
  function summary(w){
    const answers=qs.map((Q,k)=>`Q${k+1} ${res[k].ok?'✓':'✗'} ${res[k].pick}`).join(' | ');
    const fields={NAME:name,CLASS:cls,LEVEL:`Level ${level}: ${LEVEL_NAMES[level]}`,SCORE:`Quiz ${right}/${qs.length}`+(gameMax?` · Game ${gameScore}/${gameMax}`:''),ANSWERS:answers,WRITTEN:w};
    const url=formURL(fields);const text=`${fields.NAME} (${fields.CLASS})\n${fields.LEVEL}\n${fields.SCORE}\n${qs.map((Q,k)=>`Q${k+1} ${res[k].ok?'✓':'✗'} ${res[k].pick}`).join('\n')}\nWritten: ${w}`;
    try{localStorage.setItem('wt-quiz-'+level,String(right));}catch(e){}
    qc.innerHTML=`<span class="tag">✓ Quiz complete</span><h2>You scored ${right} / ${qs.length}</h2><p style="font-size:17px;margin:4px 0 10px">${url?'<b>Last step:</b> send your answers to your teacher. The form opens with everything filled in. Just press <b>Submit</b> at the bottom.':'Your teacher hasn’t connected the answer form yet. Show this screen to your teacher, or copy your answers.'}</p>
      <div class="sum">${esc(text)}</div>
      <div class="row" style="margin-top:14px">${url?`<a class="cta" style="flex:2;width:auto" href="${esc(url)}" target="_blank" rel="noopener">📤 Send my answers to my teacher</a>`:''}<button class="ghost" id="qc2">📋 Copy answers</button><button class="ghost" id="qcl">Close</button></div>`;
    qc.querySelector('#qcl').onclick=()=>ov.remove();
    qc.querySelector('#qc2').onclick=e=>{try{navigator.clipboard.writeText(text).then(()=>e.target.textContent='✓ Copied',()=>e.target.textContent='Copy failed');}catch(err){e.target.textContent='Copy failed';}};
    if(right>=4)leaves();}
  intro();}

return{QUIZ,quiz,$,$$,mulberry32,shuffle,clamp,hash,addScore,get score(){return score},toast,prompt,leaves,steps,setStep,starsFor,saveStars,getStars,finish,drag,swatch,TIMBERS};
})();

</script>
<script>
(function(){
const {$}=G;const panel=$('#panel'),cv=$('#g'),ctx=cv.getContext('2d');
const ROUNDS=[{t:'hard',label:'HARDWOODS',ic:'🍂',fact:'Hardwoods come from <b>deciduous</b> (broad-leaved) trees: oak, ash, beech, mahogany, balsa…'},
 {t:'soft',label:'SOFTWOODS',ic:'🌲',fact:'Softwoods come from <b>coniferous</b> (cone-bearing) trees: pine, spruce, larch, cedar… and yes, <b>yew</b>!'},
 {t:'board',label:'MANUFACTURED BOARDS',ic:'🧱',fact:'Manufactured boards are made by bonding wood fibres, chips or veneers: <b>MDF, plywood and chipboard</b>.'}];
G.steps(ROUNDS.map(r=>r.label.charAt(0)+r.label.slice(1).toLowerCase()));
const T=G.TIMBERS;
const POOL={hard:['oak','ash','beech','mahogany','balsa','walnut','teak'],soft:['pine','spruce','larch','cedar','fir','yew'],board:['mdf','ply','chip']};
const BOARDS={mdf:{name:'MDF',base:'#b98d5c'},ply:{name:'Plywood',base:'#dcbd8a'},chip:{name:'Chipboard',base:'#c7a26c'}};
// pre-render sprites
const SPR={};
function sprite(key){if(SPR[key])return SPR[key];const c=document.createElement('canvas');c.width=280;c.height=110;const x=c.getContext('2d');
  if(key==='bug'){x.font='90px serif';x.textAlign='center';x.textBaseline='middle';x.fillText('🐛',140,58);SPR[key]=c;return c;}
  const tile=document.createElement('canvas');tile.width=280;tile.height=110;
  if(T[key])G.swatch(tile,T[key],G.hash(key));
  else{const t=tile.getContext('2d'),b=BOARDS[key],r=G.mulberry32(G.hash(key));t.fillStyle=b.base;t.fillRect(0,0,280,110);
    if(key==='ply'){for(let i=0;i<5;i++){t.fillStyle=i%2?'#b88a52':'#e8cb98';t.fillRect(0,i*22,280,22);t.fillStyle='rgba(60,30,10,.6)';t.fillRect(0,i*22,280,2);}}
    else if(key==='chip'){for(let i=0;i<220;i++){t.save();t.translate(r()*280,r()*110);t.rotate(r()*3);t.fillStyle=['#e2c08a','#a87a45','#c99a5e'][i%3];t.fillRect(-8,-3,8+r()*14,4+r()*5);t.restore();}}
    else{for(let i=0;i<2500;i++){t.fillStyle=r()<.5?'rgba(110,70,30,.35)':'rgba(230,200,150,.35)';t.fillRect(r()*280,r()*110,2,1);}}}
  x.save();x.beginPath();x.roundRect?x.roundRect(4,4,272,102,18):x.rect(4,4,272,102);x.clip();x.drawImage(tile,0,0);x.restore();
  x.lineWidth=6;x.strokeStyle='rgba(0,0,0,.25)';x.beginPath();x.roundRect?x.roundRect(4,4,272,102,18):x.rect(4,4,272,102);x.stroke();
  const name=T[key]?T[key].name:BOARDS[key].name;x.font='700 40px Fredoka, sans-serif';x.textAlign='center';x.textBaseline='middle';
  x.lineWidth=8;x.strokeStyle='rgba(255,255,255,.95)';x.strokeText(name,140,57);x.fillStyle='#1d2b24';x.fillText(name,140,57);
  SPR[key]=c;return c;}
const nameOf=k=>T[k]?T[k].name:BOARDS[k]?BOARDS[k].name:'Woodworm';
const kindOf=k=>k==='bug'?'bug':T[k]?(T[k].kind==='hardwood'?'hard':'soft'):'board';

let W=0,H=0,items=[],parts=[],floats=[],cartX=0.5,targetX=0.5,round=-1,tLeft=0,running=false,lives=3,combo=0,spawnT=0,shake=0,caught=0;
function size(){const dpr=Math.min(2,devicePixelRatio||1);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);}
addEventListener('resize',size);size();
const setX=e=>{const r=cv.getBoundingClientRect();targetX=G.clamp((e.clientX-r.left)/r.width,0.06,0.94);};
cv.addEventListener('pointerdown',setX);cv.addEventListener('pointermove',setX);
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')targetX=G.clamp(targetX-0.08,0.06,0.94);if(e.key==='ArrowRight')targetX=G.clamp(targetX+0.08,0.06,0.94);});

function intro(i){round=i;G.setStep(i);const R=ROUNDS[i];running=false;panel.style.display='';
  panel.innerHTML=`<span class="arcade">ROUND ${i+1} OF 3</span><h2>${R.ic} Catch the ${R.label}!</h2><p>${R.fact} Slide your finger to move the cart. Catch the right ones, dodge the wrong ones and <b>avoid the woodworm 🐛</b>. You have 3 lives ❤️.</p><button class="cta" id="go">▶ Go!</button>`;
  $('#go').onclick=()=>{panel.style.display='none';tLeft=25;spawnT=0;running=true;G.prompt(`${R.ic} Catch <em>${R.label}</em>`);setTimeout(()=>G.prompt(''),1800);};}
function spawn(){const R=ROUNDS[round],r=Math.random();let key;
  if(r<0.1)key='bug';else if(r<0.55)key=POOL[R.t][Math.floor(Math.random()*POOL[R.t].length)];
  else{const others=Object.keys(POOL).filter(k=>k!==R.t);const o=others[Math.floor(Math.random()*others.length)];key=POOL[o][Math.floor(Math.random()*POOL[o].length)];}
  const w=Math.min(150,W*0.2);items.push({key,x:w/2+Math.random()*(W-w),y:-60,w,h:w*110/280,vy:(110+round*35)*(H/600)*(0.85+Math.random()*0.4),rot:(Math.random()-0.5)*0.4,vr:(Math.random()-0.5)*1.2});}
function burst(x,y,col){for(let i=0;i<18;i++)parts.push({x,y,vx:(Math.random()-0.5)*260,vy:-Math.random()*260,a:1,c:col});}
function float(x,y,txt,col){floats.push({x,y,txt,col,a:1});}
function catchIt(it){const k=kindOf(it.key),R=ROUNDS[round];
  if(k===R.t){caught++;combo++;G.addScore(1);burst(it.x,H-70,'#ffd34d');float(it.x,H-110,'+1','#2f7d1e');
    if(combo%5===0){G.addScore(1);float(it.x,H-150,`🔥 ${combo} combo! +1`,'#c9762c');}}
  else{combo=0;lives--;shake=0.4;burst(it.x,H-70,'#e2683c');
    float(it.x,H-110,k==='bug'?'🐛 Woodworm!':`✗ ${nameOf(it.key)} is ${k==='hard'?'a hardwood':k==='soft'?'a softwood':'a board'}`,'#c0392b');
    if(lives<=0){running=false;setTimeout(()=>end(true),900);}}}
function end(dead){running=false;items=[];G.prompt('');panel.style.display='';
  G.finish(6,Math.max(30,G.score),dead?'Out of lives… but great catching!':`You caught ${caught} correctly. Target: 30 points.`,'level7.html','Next level: Workshop rush →');}
function drawCart(x){const cw=Math.min(190,W*0.24),ch=58,y=H-74;ctx.save();ctx.translate(x,y);
  ctx.fillStyle='#8a5a32';ctx.beginPath();ctx.moveTo(-cw/2,0);ctx.lineTo(cw/2,0);ctx.lineTo(cw/2-14,ch);ctx.lineTo(-cw/2+14,ch);ctx.closePath();ctx.fill();
  ctx.strokeStyle='#6b4423';ctx.lineWidth=3;for(let i=1;i<3;i++){ctx.beginPath();ctx.moveTo(-cw/2+4,i*ch/3);ctx.lineTo(cw/2-4,i*ch/3);ctx.stroke();}
  ctx.fillStyle='#2b3138';[-cw/3,cw/3].forEach(wx=>{ctx.beginPath();ctx.arc(wx,ch+6,13,0,7);ctx.fill();ctx.fillStyle='#9aa4ad';ctx.beginPath();ctx.arc(wx,ch+6,5,0,7);ctx.fill();ctx.fillStyle='#2b3138';});
  ctx.fillStyle='#c9762c';ctx.fillRect(-cw/2-6,-6,cw+12,10);ctx.restore();return cw;}
let last=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min(0.05,(now-last)/1000);last=now;
  if(cv.clientWidth!==W||cv.clientHeight!==H)size();
  cartX+=(targetX-cartX)*Math.min(1,dt*14);
  ctx.save();if(shake>0){shake-=dt;ctx.translate((Math.random()-0.5)*16*shake/0.4,(Math.random()-0.5)*10*shake/0.4);}
  // background: sky, hills, forest silhouettes
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#86ccf2');g.addColorStop(0.7,'#dff3ff');g.addColorStop(1,'#cdeab8');ctx.fillStyle=g;ctx.fillRect(-20,-20,W+40,H+40);
  ctx.fillStyle='#9fd48a';ctx.beginPath();ctx.moveTo(0,H*0.82);for(let x=0;x<=W;x+=20)ctx.lineTo(x,H*0.8-Math.sin(x*0.008)*28-Math.sin(x*0.02)*10);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();
  ctx.fillStyle='#5aa154';for(let i=0;i<14;i++){const tx=(i+0.5)*W/14,th=50+((i*37)%30);ctx.beginPath();ctx.moveTo(tx,H*0.8-th-Math.sin(tx*0.008)*28);ctx.lineTo(tx-18,H*0.82-Math.sin(tx*0.008)*28);ctx.lineTo(tx+18,H*0.82-Math.sin(tx*0.008)*28);ctx.fill();}
  ctx.fillStyle='#7cbf62';ctx.fillRect(0,H-20,W,20);
  const cx=cartX*W;const cw=drawCart(cx);
  if(running){tLeft-=dt;spawnT-=dt;if(spawnT<=0){spawn();spawnT=Math.max(0.42,0.95-round*0.15-(25-tLeft)*0.008);}
    if(tLeft<=0){running=false;items=[];if(round<2){G.toast(`Round ${round+1} complete!`,'good');setTimeout(()=>intro(round+1),900);}else end(false);}}
  for(const it of items){if(running){it.y+=it.vy*dt;it.rot+=it.vr*dt;}
    if(!it.done&&it.y+it.h/2>=H-74&&it.y<H-40&&Math.abs(it.x-cx)<cw/2+it.w*0.25){it.done=true;catchIt(it);}
    ctx.save();ctx.translate(it.x,it.y);ctx.rotate(it.rot);ctx.drawImage(sprite(it.key),-it.w/2,-it.h/2,it.w,it.h);ctx.restore();}
  items=items.filter(it=>!it.done&&it.y<H+80);
  for(const p of parts){p.vy+=600*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.a-=dt*1.4;ctx.globalAlpha=Math.max(0,p.a);ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,5,5);}ctx.globalAlpha=1;parts=parts.filter(p=>p.a>0);
  for(const f of floats){f.y-=40*dt;f.a-=dt*0.7;ctx.globalAlpha=Math.max(0,f.a);ctx.font='700 22px Fredoka, sans-serif';ctx.textAlign='center';ctx.lineWidth=6;ctx.strokeStyle='#fff';ctx.strokeText(f.txt,f.x,f.y);ctx.fillStyle=f.col;ctx.fillText(f.txt,f.x,f.y);}ctx.globalAlpha=1;floats=floats.filter(f=>f.a>0);
  // HUD
  if(round>=0){ctx.font='700 26px Fredoka, sans-serif';ctx.textAlign='left';ctx.fillStyle='#1d2b24';ctx.fillText('❤️'.repeat(Math.max(0,lives))+'🤍'.repeat(3-Math.max(0,lives)),16,38);
    ctx.textAlign='right';ctx.fillText(`⏱ ${Math.max(0,Math.ceil(tLeft))}s`,W-16,38);
    const R=ROUNDS[round];ctx.textAlign='center';ctx.font='700 20px Fredoka, sans-serif';const lbl=`${R.ic} Catch ${R.label}`;const tw=ctx.measureText(lbl).width+30;
    ctx.fillStyle='rgba(255,255,255,.85)';ctx.beginPath();ctx.roundRect?ctx.roundRect(W/2-tw/2,14,tw,36,18):ctx.rect(W/2-tw/2,14,tw,36);ctx.fill();ctx.fillStyle='#1f4d36';ctx.fillText(lbl,W/2,39);
    if(combo>=3){ctx.fillStyle='#c9762c';ctx.fillText(`🔥 combo ${combo}`,W/2,76);}}
  ctx.restore();}
requestAnimationFrame(loop);
intro(0);
})();
</script>
